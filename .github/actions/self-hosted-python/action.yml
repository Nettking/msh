name: Pinned self-hosted Python
description: Create a fresh job environment from the qualified Beast interpreter.
inputs:
  python-version:
    description: Required Python version or 3.12 series.
    default: '3.12'
    required: false
runs:
  using: composite
  steps:
    - name: Prepare Linux Python and disk-backed test temp
      if: runner.os == 'Linux'
      shell: bash
      env:
        REQUIRED_PYTHON: ${{ inputs.python-version }}
      run: |
        set -euo pipefail
        python=/opt/fcp-ci/python/3.12.13/bin/python3.12
        "$python" -c 'import os, platform; v=platform.python_version(); assert v == "3.12.13", v; assert v == os.environ["REQUIRED_PYTHON"] or os.environ["REQUIRED_PYTHON"] == "3.12", v; print(v)'
        venv=$(mktemp -d "${RUNNER_TEMP}/fcp-python.XXXXXX")
        "$python" -m venv "$venv"
        echo "$venv/bin" >> "$GITHUB_PATH"
        mkdir -p "${RUNNER_TEMP}/fcp-test-tmp"
        echo "TMPDIR=${RUNNER_TEMP}/fcp-test-tmp" >> "$GITHUB_ENV"
    - name: Prepare Windows Python and native shells
      if: runner.os == 'Windows'
      shell: powershell
      env:
        REQUIRED_PYTHON: ${{ inputs.python-version }}
      run: |
        $ErrorActionPreference = 'Stop'
        $env:PSMODULEPATH = 'C:\Windows\System32\WindowsPowerShell\v1.0\Modules;C:\Program Files\WindowsPowerShell\Modules'
        python -c "import os, platform; v=platform.python_version(); assert v == '3.12.10', v; assert v == os.environ['REQUIRED_PYTHON'] or os.environ['REQUIRED_PYTHON'] == '3.12', v; print(v)"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $venv = Join-Path $env:RUNNER_TEMP ('fcp-python-' + [guid]::NewGuid().ToString('N'))
        python -m venv $venv
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $gitRoot = Split-Path (Split-Path (Get-Command git.exe).Source)
        $gitBin = Join-Path $gitRoot 'bin'
        if (-not (Test-Path (Join-Path $gitBin 'bash.exe'))) { throw 'Git Bash is required' }
        $gitBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        (Join-Path $venv 'Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        New-Item -ItemType Directory -Force -Path C:\fcp-qtmp | Out-Null
        'TEMP=C:\fcp-qtmp' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        'TMP=C:\fcp-qtmp' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        'PSMODULEPATH=C:\Windows\System32\WindowsPowerShell\v1.0\Modules;C:\Program Files\WindowsPowerShell\Modules' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
