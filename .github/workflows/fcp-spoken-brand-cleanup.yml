name: FCP spoken brand cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/federated-capability-platform-rename'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/federated-capability-platform-rename
          fetch-depth: 0
      - name: Remove spaced retired product spelling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          legacy = " ".join(chr(value).upper() for value in (109, 115, 104))
          replacement = "F C P"
          tracked = subprocess.check_output(["git", "ls-files", "-z"], text=False).split(b"\0")
          changed = []
          for raw in tracked:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8"))
              if path.as_posix().startswith(".github/workflows/"):
                  continue
              try:
                  original = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = original.replace(legacy, replacement)
              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))
          print("updated", len(changed), "files")
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/workflows'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove spoken retired product name"
          git push origin HEAD:agent/federated-capability-platform-rename
