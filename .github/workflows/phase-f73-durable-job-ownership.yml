name: Phase F7.3 durable job ownership

on:
  pull_request:
    paths:
      - "catalog/capabilities/**"
      - ".github/workflows/phase-f73-durable-job-ownership.yml"
  push:
    branches: [main]
    paths:
      - "catalog/capabilities/**"
      - ".github/workflows/phase-f73-durable-job-ownership.yml"

permissions:
  contents: read

concurrency:
  group: f73-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  durable-job-ownership:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest ruff
      - name: Compile capability domain
        run: >-
          python -m compileall
          catalog/capabilities
      - name: F7 capability and affected federation tests
        run: >-
          python -m pytest -o addopts= -q
          catalog/capabilities/tests
          catalog/federation/tests/test_phase0.py
          catalog/federation/tests/test_phase1.py
      - name: Ruff capability domain
        run: >-
          python -m ruff check
          catalog/capabilities
          --ignore I001,RUF022,B008,C408,PLC0206

  repository-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Validate diff hygiene
        run: git diff --check HEAD^ HEAD
