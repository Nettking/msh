          actual="$(git -C "${GITHUB_WORKSPACE}/repo" rev-parse HEAD)"
          if [ "${actual}" != "${sha}" ]; then
            echo "refusing to run: HEAD is ${actual}, expected ${sha}" >&2
            exit 1
          fi
          echo "HEAD verified: ${actual}"
          python3 "${GITHUB_WORKSPACE}/repo/scripts/ci_release_disk_preflight.py" \
            "${GITHUB_WORKSPACE}/repo" /tmp || true
          
          rm -f "${temp}/telemetry-${phase}.log"
          nohup "${temp}/telemetry.sh" > "${temp}/telemetry-${phase}.log" 2>&1 &
          sampler=$!
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          
          if [ "${mode}" = "targeted" ]; then
            inner='set +e
                   fails=0
                   for i in $(seq 1 30); do
                     out=$(python -m pytest -o addopts= -o cache_dir=/tmp/pytest_cache -p no:randomly -q \
                       catalog/mtconnect_recorder/tests/test_source_availability_retry.py \
                       catalog/relay/tests/test_phase2_integration.py::test_f2_006_revocation_rejects_traffic_and_reconnect_but_peer_survives \
                       catalog/flask_app/tests/test_federation_pairing_relay.py \
                       catalog/node/tests/test_live_storage_catchup.py 2>&1 | tail -1)
                     rc=$?
                     [ $rc -ne 0 ] && fails=$((fails+1))
                     echo "repeat $i rc=$rc :: $out"
                   done
                   echo "TARGETED_REPEATS: $fails of 30 failed"
                   exit $fails'
          else
            inner='python -m pytest -o addopts= -o cache_dir=/tmp/pytest_cache -p no:randomly -v --durations=50'
          fi
          
          set +e
          docker run --rm --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}/repo:/workspace" \
            -v "${RUNNER_TEMP}/pipcache:/pipcache" \
            -e PYTHONPYCACHEPREFIX=/tmp/pycache \
            -e PIP_CACHE_DIR=/pipcache \
            -w /workspace \
            python:3.12.13-bookworm bash -lc "
              set -euo pipefail
              python --version
              python -m pip install --quiet --upgrade pip==26.2.1
              python -m pip install --quiet -r requirements.txt -c constraints-release.txt
              python -m pip install --quiet pytest==9.1.1 -c constraints-release.txt
              python -m pytest -o addopts= -p no:randomly --collect-only -q 2>&1 | tail -1
              ${inner}
            "
          rc=$?
          set -e
          finished="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          kill "${sampler}" 2>/dev/null || true
          
          echo "===== PHASE ${phase} host telemetry (30s samples, ${started} to ${finished}) ====="
          cat "${temp}/telemetry-${phase}.log" || echo "(no samples)"
          echo "===== END PHASE ${phase} telemetry ====="
          
          echo "${phase} sha=${sha} mode=${mode} rc=${rc} started=${started} finished=${finished}" \
            >> "${temp}/results.txt"
          echo "===== PHASE ${phase} RESULT rc=${rc} ====="
          
          "${temp}/cleanstate.sh" "after ${phase}"
          SH
          chmod +x "${RUNNER_TEMP}/ab/runphase.sh"
      - name: "Full suite B: main"
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/ab/runphase.sh" b1-main 6101c86d94294c70db47d1a8053cac93b9a41356 full
      - name: "Full suite A: candidate"
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/ab/runphase.sh" b2-candidate ba8a3b0b828f59c36c5aaaf6130480a2432a5578 full
      - name: A/B summary
        if: always()
        shell: bash
        run: |
          echo "phase results (rc=0 means the suite passed):"
          cat "${RUNNER_TEMP}/ab/results.txt" || echo "(none)"
          echo
          echo "This job never decides a classification. It produces two"
          echo "measurements of the same host under the same command, and the"
          echo "handoff records what they mean."

