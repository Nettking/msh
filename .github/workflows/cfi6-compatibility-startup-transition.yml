name: CFI-6 compatibility startup transition

on:
  pull_request:
    paths:
      - ".github/workflows/cfi6-compatibility-startup-transition.yml"
      - "catalog/flask_app/app.py"
      - "catalog/flask_app/capability_startup_transition_routes.py"
      - "catalog/flask_app/services/capability_startup_transition_service.py"
      - "catalog/flask_app/templates/base.html"
      - "catalog/flask_app/templates/federation/onboarding/_finish.html"
      - "catalog/flask_app/tests/test_capability_startup_transition_route.py"
      - "catalog/flask_app/tests/test_streamlined_onboarding_flow.py"
      - "catalog/federation/onboarding_compat.py"
      - "catalog/federation/onboarding_models.py"
  push:
    branches:
      - main
      - "agent/cfi6-*"
      - "agent/cf7d-*"
    paths:
      - ".github/workflows/cfi6-compatibility-startup-transition.yml"
      - "catalog/flask_app/app.py"
      - "catalog/flask_app/capability_startup_transition_routes.py"
      - "catalog/flask_app/services/capability_startup_transition_service.py"
      - "catalog/flask_app/templates/base.html"
      - "catalog/flask_app/templates/federation/onboarding/_finish.html"
      - "catalog/flask_app/tests/test_capability_startup_transition_route.py"
      - "catalog/flask_app/tests/test_streamlined_onboarding_flow.py"
      - "catalog/federation/onboarding_compat.py"
      - "catalog/federation/onboarding_models.py"

permissions:
  contents: read

concurrency:
  group: cfi6-startup-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transition:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest ruff
      - name: Compile CFI-6 composition
        run: >-
          python -m compileall -q
          catalog/flask_app/app.py
          catalog/flask_app/capability_startup_transition_routes.py
          catalog/flask_app/services/capability_startup_transition_service.py
          catalog/flask_app/tests/test_capability_startup_transition_route.py
          catalog/flask_app/tests/test_streamlined_onboarding_flow.py
      - name: Run CFI-6 and affected regressions
        run: >-
          python -m pytest -o addopts= -q
          catalog/flask_app/tests/test_capability_startup_transition_route.py
          catalog/flask_app/tests/test_streamlined_onboarding_flow.py
          catalog/flask_app/tests/test_capability_contribution_route.py
          catalog/flask_app/tests/test_capability_benchmark_route.py
          catalog/flask_app/tests/test_capability_inspection_route.py
          catalog/flask_app/tests/test_capability_onboarding_route.py
          catalog/flask_app/tests/test_post_setup_handoff.py
          catalog/flask_app/tests/test_cf5_ui_shell.py
          catalog/flask_app/tests/test_federation_overview_route.py
          catalog/federation/tests/test_onboarding_contracts.py
          catalog/federation/tests/test_onboarding_discovery_service.py
          catalog/capabilities/contributions/tests
          catalog/federation/tests/test_federation_projections.py
      - name: Validate Compose configuration
        run: docker compose config
      - name: Ruff CFI-6 composition
        run: >-
          python -m ruff check
          catalog/flask_app/app.py
          catalog/flask_app/capability_startup_transition_routes.py
          catalog/flask_app/services/capability_startup_transition_service.py
          catalog/flask_app/tests/test_capability_startup_transition_route.py
          catalog/flask_app/tests/test_streamlined_onboarding_flow.py
      - name: Diff hygiene
        shell: bash
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi
