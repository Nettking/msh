name: Apply CF7-E functional onboarding fixes

on:
  push:
    branches:
      - agent/cf7e-functional-onboarding-pairing
    paths:
      - ".github/workflows/cf7e-apply-functional-onboarding.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cf7e-functional-onboarding-pairing
          fetch-depth: 0

      - name: Apply exact bounded changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_text: str, old: str, new: str) -> None:
              path = Path(path_text)
              text = path.read_text(encoding="utf-8")
              assert text.count(old) == 1, (path_text, text.count(old))
              path.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "catalog/capabilities/benchmarking/adapters/ollama.py",
              '''        prerequisites = (OLLAMA_PREREQUISITE,) if available else ()
          recommended = (self.definition.benchmark_id,) if available else ()
''',
              '''        prerequisites = (OLLAMA_PREREQUISITE,) if available else ()
          # A configured target must remain visible in onboarding even when the
          # model is missing or the target is temporarily unavailable. The
          # resulting card is evidence-only and cannot grant authority.
          recommended = (self.definition.benchmark_id,)
''',
          )

          replace_once(
              "catalog/flask_app/services/capability_benchmark_service.py",
              '''        reviewed = sum(card["state"] in reviewed_states for card in cards)
          complete = not cards or reviewed == len(cards)
          pending = len(cards) - reviewed
          summary = {
              "state": "complete" if complete else "pending",
              "label": (
                  "All recommended checks reviewed"
                  if complete
                  else f"{pending} check{'s' if pending != 1 else ''} need review"
              ),
              "can_skip": any(item.runnable for item in plan),
          }
          return summary, cards, complete
''',
              '''        reviewed = sum(card["state"] in reviewed_states for card in cards)
          if not cards:
              return (
                  {
                      "state": "blocked",
                      "label": "No supported checks configured",
                      "can_skip": False,
                      "setup_url": "/startup",
                  },
                  cards,
                  False,
              )
          complete = reviewed == len(cards)
          pending = len(cards) - reviewed
          summary = {
              "state": "complete" if complete else "pending",
              "label": (
                  "All recommended checks reviewed"
                  if complete
                  else f"{pending} check{'s' if pending != 1 else ''} need review"
              ),
              "can_skip": any(item.runnable for item in plan),
              "setup_url": "/startup",
          }
          return summary, cards, complete
''',
          )

          replace_once(
              "catalog/capabilities/contributions/adapters/ai.py",
              '''        return tuple(
              LocalContributionDescriptor(
                  logical_service_id=spec.service_id,
                  capability_type="language-model",
                  capability_protocol=spec.protocol,
                  display_label=spec.display_label,
                  capacity_envelope={
                      **spec.capacity_envelope,
                      "provider_id": spec.service_id,
                  },
                  missing_prerequisites=spec.missing_prerequisites,
              )
              for service_id, spec in sorted(self._services.items())
              if service_id in detected
          )
''',
              '''        return tuple(
              LocalContributionDescriptor(
                  logical_service_id=spec.service_id,
                  capability_type="language-model",
                  capability_protocol=spec.protocol,
                  display_label=spec.display_label,
                  capacity_envelope={
                      **spec.capacity_envelope,
                      "provider_id": spec.service_id,
                  },
                  missing_prerequisites=(
                      spec.missing_prerequisites
                      if service_id in detected
                      else tuple(
                          dict.fromkeys(
                              (*spec.missing_prerequisites, "configured-service-not-detected")
                          )
                      )
                  ),
              )
              for service_id, spec in sorted(self._services.items())
          )
''',
          )

          replace_once(
              "catalog/flask_app/services/capability_contribution_service.py",
              '''        if available and requested_step in {None, "contributions"}:
              view_model["current_step"] = "contributions"
          if available and complete and requested_step == "finish":
              view_model["current_step"] = "finish"
''',
              '''        if available and complete and requested_step in {None, "finish"}:
              view_model["current_step"] = "finish"
          elif available and requested_step in {None, "contributions"}:
              view_model["current_step"] = "contributions"
''',
          )

          Path(".github/workflows/cf7e-apply-functional-onboarding.yml").unlink()
          PY

      - name: Commit bounded changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expose configured checks and contribution candidates"
          git push origin HEAD:agent/cf7e-functional-onboarding-pairing
