name: F6.4.2 isolated lint repair

on:
  push:
    branches:
      - agent/phase-f642-verified-chunk-transfer
    paths:
      - ".github/workflows/f642-lint-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-f642-verified-chunk-transfer
      - name: Apply the three reviewed lint fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("catalog/federation/verified_chunk_transfer.py")
          text = path.read_text(encoding="utf-8")

          old = "import base64\n"
          new = "import asyncio\nimport base64\n"
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''            with source.open("rb") as handle:
                          for index in range(manifest.chunk_count):
                              data = handle.read(manifest.expected_chunk_length(index))
                              chunk = ObjectTransferChunk.create(
                                  manifest=manifest,
                                  index=index,
                                  data=data,
                              )
                              _, sequence = await self._send(
                                  target,
                                  opening,
                                  secret,
                                  sequence,
                                  manifest,
                                  "chunk",
                                  {"chunk": chunk.to_dict()},
                                  chunk_index=index,
                              )
                          if handle.read(1):
                              raise FederationValidationError(
                                  "object-transfer-source-size-changed",
                                  "source_path",
                                  "source file grew during transfer",
                              )
          '''
          old = old.replace("          ", "")
          new = '''            for index in range(manifest.chunk_count):
                          expected_length = manifest.expected_chunk_length(index)
                          data = await asyncio.to_thread(
                              self._read_source_chunk,
                              source,
                              index * manifest.chunk_size,
                              expected_length,
                          )
                          if len(data) != expected_length:
                              raise FederationValidationError(
                                  "object-transfer-source-size-changed",
                                  "source_path",
                                  "source file size changed during transfer",
                              )
                          chunk = ObjectTransferChunk.create(
                              manifest=manifest,
                              index=index,
                              data=data,
                          )
                          _, sequence = await self._send(
                              target,
                              opening,
                              secret,
                              sequence,
                              manifest,
                              "chunk",
                              {"chunk": chunk.to_dict()},
                              chunk_index=index,
                          )
                      source_size = (await asyncio.to_thread(source.stat)).st_size
                      if source_size != manifest.total_size:
                          raise FederationValidationError(
                              "object-transfer-source-size-changed",
                              "source_path",
                              "source file size changed during transfer",
                          )
          '''
          new = new.replace("          ", "")
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''            del sequence
                      return self._receipt(ack, manifest)
          '''.replace("          ", "")
          new = '''            return self._receipt(ack, manifest)
          '''.replace("          ", "")
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          marker = '''    @staticmethod
              def _file_manifest(
          '''.replace("          ", "")
          helper = '''    @staticmethod
              def _read_source_chunk(source: Path, offset: int, length: int) -> bytes:
                  try:
                      with source.open("rb") as handle:
                          handle.seek(offset)
                          return handle.read(length)
                  except OSError as exc:
                      raise FederationOperationError(
                          "object-transfer-source-unavailable",
                          "source file could not be read",
                          "source_path",
                      ) from exc
          
              @staticmethod
              def _file_manifest(
          '''.replace("          ", "")
          assert text.count(marker) == 1
          text = text.replace(marker, helper, 1)

          old = '''        except Exception:
                      return
          '''.replace("          ", "")
          new = '''        except (
                          OSError,
                          TimeoutError,
                          DirectTransportUnavailable,
                          FederationOperationError,
                          FederationValidationError,
                      ):
                          return
          '''.replace("          ", "")
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit repair and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/f642-lint-repair.yml
          git add catalog/federation/verified_chunk_transfer.py
          git commit -m "Fix F6.4.2 lint findings"
          git push origin HEAD:agent/phase-f642-verified-chunk-transfer
