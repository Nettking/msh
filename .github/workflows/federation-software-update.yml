name: Federation software update

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  update-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest ruff
      - name: Compile update Python
        run: >-
          python -m compileall -q
          catalog/federation/software_update.py
          catalog/flask_app/services/federation_update_handoff.py
          catalog/flask_app/services/federation_update_events.py
          catalog/flask_app/services/federation_update_service.py
          catalog/flask_app/tests/test_federation_update_runtime.py
          catalog/flask_app/tests/test_federation_update_orchestration.py
          catalog/flask_app/tests/test_federation_update_host_agents.py
          catalog/flask_app/tests/test_termux_federation_update_agent.py
          catalog/flask_app/tests/test_windows_migration_script.py
          catalog/flask_app/tests/test_windows_relay_volume_selector.py
          scripts/posix/fcp_recorder_update_agent.py
          scripts/fcp_native_recorder_update_agent.py
          catalog/mtconnect_recorder/native_identity.py
          catalog/mtconnect_recorder/native_update.py
          catalog/mtconnect_recorder/native_update_agent.py
          catalog/mtconnect_recorder/federation_update.py
          termux/fcp_phone_update_codec.py
      - name: Run update contract tests
        run: >-
          python -m pytest -o addopts= -q
          catalog/federation/tests/test_software_update.py
          catalog/flask_app/tests/test_federation_update_runtime.py
          catalog/flask_app/tests/test_federation_update_orchestration.py
          catalog/flask_app/tests/test_federation_update_host_agents.py
          catalog/flask_app/tests/test_termux_federation_update_agent.py
          catalog/flask_app/tests/test_windows_migration_script.py
          catalog/flask_app/tests/test_windows_relay_volume_selector.py
          catalog/mtconnect_recorder/tests/test_native_recorder_update_agent.py
          catalog/mtconnect_recorder/tests/test_native_recorder_supervisor_boundary.py
          catalog/mtconnect_recorder/tests/test_recorder_federation_update.py
      - name: Ruff update Python
        # TRY004: malformed event fields intentionally use the same ValueError
        # contract as the rest of the bounded protocol validator.
        # BLE001/S110: host-agent failure boundaries deliberately collapse
        # unexpected local failures into bounded non-sensitive result records.
        # RUF100 follows from ignoring BLE001 on those explicit boundaries.
        # EXE001: the POSIX recorder agent is invoked explicitly with Python;
        # GitHub's contents API does not preserve an executable mode on creation.
        run: >-
          python -m ruff check --ignore TRY004,BLE001,S110,RUF100,EXE001
          catalog/federation/software_update.py
          catalog/flask_app/services/federation_update_handoff.py
          catalog/flask_app/services/federation_update_events.py
          catalog/flask_app/services/federation_update_service.py
          catalog/flask_app/tests/test_federation_update_runtime.py
          catalog/flask_app/tests/test_federation_update_orchestration.py
          catalog/flask_app/tests/test_federation_update_host_agents.py
          catalog/flask_app/tests/test_termux_federation_update_agent.py
          catalog/flask_app/tests/test_windows_migration_script.py
          catalog/flask_app/tests/test_windows_relay_volume_selector.py
          scripts/posix/fcp_recorder_update_agent.py
          scripts/fcp_native_recorder_update_agent.py
          catalog/mtconnect_recorder/native_identity.py
          catalog/mtconnect_recorder/native_update.py
          catalog/mtconnect_recorder/native_update_agent.py
          catalog/mtconnect_recorder/federation_update.py
          catalog/mtconnect_recorder/tests/test_native_recorder_update_agent.py
          catalog/mtconnect_recorder/tests/test_native_recorder_supervisor_boundary.py
          catalog/mtconnect_recorder/tests/test_recorder_federation_update.py
          termux/fcp_phone_update_codec.py

      - name: Parse and smoke Windows host agent
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($script in @(
            'scripts/windows/fcp_update_agent.ps1',
            'scripts/windows/fcp_recorder_update_agent.ps1',
            'scripts/windows/fcp_recorder_supervisor.ps1',
            'scripts/windows/start_tailscale_recorder.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }

          $state = Join-Path $env:RUNNER_TEMP 'fcp-update-agent-smoke'
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\windows\fcp_update_agent.ps1 `
            -RepoRoot (Resolve-Path '.').Path `
            -DataDirectory $state `
            -Once
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $recorderState = Join-Path $env:RUNNER_TEMP 'fcp-recorder-update-agent-smoke'
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\windows\fcp_recorder_update_agent.ps1 `
            -RepoRoot (Resolve-Path '.').Path `
            -DataDirectory $recorderState `
            -ComposeProjectName recorder-smoke `
            -Once
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Dot-source one no-request pass so the native-process helper remains
          # available for an explicit Windows PowerShell 5.1 stderr regression.
          $probeState = Join-Path $env:RUNNER_TEMP 'fcp-update-agent-native-probe'
          . .\scripts\windows\fcp_update_agent.ps1 `
            -RepoRoot (Resolve-Path '.').Path `
            -DataDirectory $probeState `
            -Once
          $probe = Invoke-External 'powershell.exe' @(
            '-NoProfile',
            '-Command',
            "[Console]::Error.WriteLine('stderr-ok'); exit 0"
          )
          if (($probe -join "`n") -notmatch 'stderr-ok') {
            throw 'native_stderr_success_was_not_preserved'
          }
          $nonzeroRejected = $false
          try {
            Invoke-External 'powershell.exe' @(
              '-NoProfile', '-Command', 'exit 7'
            ) | Out-Null
          }
          catch {
            $nonzeroRejected = (
              $_.Exception.Message -match 'external_command_failed:powershell.exe:7'
            )
          }
          # GitHub's PowerShell step wrapper propagates a lingering native
          # LASTEXITCODE even when the expected exception above was handled.
          $global:LASTEXITCODE = 0
          if (-not $nonzeroRejected) {
            throw 'native_nonzero_exit_was_not_rejected'
          }

      - name: Smoke native recorder update agent
        shell: bash
        run: |
          python scripts/fcp_native_recorder_update_agent.py \
            --repo-root "$PWD" \
            --data-directory "$RUNNER_TEMP/fcp-native-recorder-agent-smoke" \
            --supervisor-session 0123456789abcdef0123456789abcdef \
            --once
          # A finalize with no pending activation must refuse, not mutate.
          set +e
          python scripts/fcp_native_recorder_update_agent.py \
            --repo-root "$PWD" \
            --data-directory "$RUNNER_TEMP/fcp-native-recorder-agent-smoke" \
            --supervisor-session 0123456789abcdef0123456789abcdef \
            --finalize
          finalize_status=$?
          set -e
          if [ "$finalize_status" -ne 1 ]; then
            echo "finalize without an activation must refuse" >&2
            exit 1
          fi
          # A malformed supervisor session must never be accepted.
          set +e
          python scripts/fcp_native_recorder_update_agent.py \
            --repo-root "$PWD" \
            --data-directory "$RUNNER_TEMP/fcp-native-recorder-agent-smoke" \
            --supervisor-session not-a-session \
            --once
          session_status=$?
          set -e
          if [ "$session_status" -eq 0 ]; then
            echo "a malformed supervisor session must be refused" >&2
            exit 1
          fi

      - name: Smoke Windows activation exit handling
        if: runner.os == 'Windows'
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\windows\tests\fcp_update_agent_activation_smoke.ps1

      - name: Parse and smoke POSIX host agent
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n start.sh
          bash -n termux/fcp-phone.sh
          bash -n termux/fcp-phone-update-agent.sh
          python scripts/posix/fcp_update_agent.py \
            --repo-root "$PWD" \
            --data-directory "$RUNNER_TEMP/fcp-update-agent-smoke" \
            --once
          python scripts/posix/fcp_recorder_update_agent.py \
            --repo-root "$PWD" \
            --data-directory "$RUNNER_TEMP/fcp-recorder-update-agent-smoke" \
            --compose-project-name recorder-smoke \
            --once
