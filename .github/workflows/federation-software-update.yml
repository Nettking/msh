name: Federation software update

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  update-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest ruff
      - name: Compile update Python
        run: >-
          python -m compileall -q
          catalog/federation/software_update.py
          catalog/flask_app/services/federation_update_handoff.py
          catalog/flask_app/services/federation_update_events.py
          catalog/flask_app/services/federation_update_service.py
          catalog/flask_app/tests/test_federation_update_runtime.py
          catalog/flask_app/tests/test_federation_update_orchestration.py
          catalog/flask_app/tests/test_federation_update_host_agents.py
          catalog/flask_app/tests/test_windows_migration_script.py
          catalog/flask_app/tests/test_windows_relay_volume_selector.py
      - name: Run update contract tests
        run: >-
          python -m pytest -o addopts= -q
          catalog/federation/tests/test_software_update.py
          catalog/flask_app/tests/test_federation_update_runtime.py
          catalog/flask_app/tests/test_federation_update_orchestration.py
          catalog/flask_app/tests/test_federation_update_host_agents.py
          catalog/flask_app/tests/test_windows_migration_script.py
          catalog/flask_app/tests/test_windows_relay_volume_selector.py
      - name: Ruff update Python
        # TRY004: malformed event fields intentionally use the same ValueError
        # contract as the rest of the bounded protocol validator.
        # BLE001: passive update status must degrade safely rather than break GET.
        run: >-
          python -m ruff check --ignore TRY004,BLE001
          catalog/federation/software_update.py
          catalog/flask_app/services/federation_update_handoff.py
          catalog/flask_app/services/federation_update_events.py
          catalog/flask_app/services/federation_update_service.py
          catalog/flask_app/tests/test_federation_update_runtime.py
          catalog/flask_app/tests/test_federation_update_orchestration.py
          catalog/flask_app/tests/test_federation_update_host_agents.py
          catalog/flask_app/tests/test_windows_migration_script.py
          catalog/flask_app/tests/test_windows_relay_volume_selector.py

      - name: Parse and smoke Windows host agent
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/windows/fcp_update_agent.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
          $state = Join-Path $env:RUNNER_TEMP 'fcp-update-agent-smoke'
          powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\windows\fcp_update_agent.ps1 `
            -RepoRoot (Resolve-Path '.').Path `
            -DataDirectory $state `
            -Once
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Dot-source one no-request pass so the native-process helper remains
          # available for an explicit Windows PowerShell 5.1 stderr regression.
          $probeState = Join-Path $env:RUNNER_TEMP 'fcp-update-agent-native-probe'
          . .\scripts\windows\fcp_update_agent.ps1 `
            -RepoRoot (Resolve-Path '.').Path `
            -DataDirectory $probeState `
            -Once
          $probe = Invoke-External 'powershell.exe' @(
            '-NoProfile',
            '-Command',
            "[Console]::Error.WriteLine('stderr-ok'); exit 0"
          )
          if (($probe -join "`n") -notmatch 'stderr-ok') {
            throw 'native_stderr_success_was_not_preserved'
          }
          $nonzeroRejected = $false
          try {
            Invoke-External 'powershell.exe' @(
              '-NoProfile', '-Command', 'exit 7'
            ) | Out-Null
          }
          catch {
            $nonzeroRejected = (
              $_.Exception.Message -match 'external_command_failed:powershell.exe:7'
            )
          }
          # GitHub's PowerShell step wrapper propagates a lingering native
          # LASTEXITCODE even when the expected exception above was handled.
          $global:LASTEXITCODE = 0
          if (-not $nonzeroRejected) {
            throw 'native_nonzero_exit_was_not_rejected'
          }

      - name: Smoke Windows activation exit handling
        if: runner.os == 'Windows'
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\windows\tests\fcp_update_agent_activation_smoke.ps1

      - name: Parse and smoke POSIX host agent
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n start.sh
          python scripts/posix/fcp_update_agent.py \
            --repo-root "$PWD" \
            --data-directory "$RUNNER_TEMP/fcp-update-agent-smoke" \
            --once
