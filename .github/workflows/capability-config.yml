name: Capability configuration boundary

on:
  pull_request:
    paths:
      - ".github/workflows/capability-config.yml"
      - "catalog/flask_app/app.py"
      - "catalog/flask_app/capability_startup_transition_routes.py"
      - "catalog/flask_app/server_setup_routes.py"
      - "catalog/flask_app/services/capability_config_migration_service.py"
      - "catalog/flask_app/services/capability_config_service.py"
      - "catalog/flask_app/services/server_setup_service.py"
      - "catalog/mtconnect_recorder/runtime.py"
      - "docker-compose.yml"
      - "catalog/flask_app/tests/test_app_capability_config_saver.py"
      - "catalog/flask_app/tests/test_capability_config_migration_service.py"
      - "catalog/flask_app/tests/test_recorder_capability_config_runtime.py"
      - "catalog/flask_app/tests/test_post_setup_handoff.py"
      - "catalog/flask_app/tests/test_connected_ai_provider.py"
      - "catalog/flask_app/tests/test_legacy_startup_retired.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/capability-config.yml"
      - "catalog/flask_app/app.py"
      - "catalog/flask_app/capability_startup_transition_routes.py"
      - "catalog/flask_app/server_setup_routes.py"
      - "catalog/flask_app/services/capability_config_migration_service.py"
      - "catalog/flask_app/services/capability_config_service.py"
      - "catalog/flask_app/services/server_setup_service.py"
      - "catalog/mtconnect_recorder/runtime.py"
      - "docker-compose.yml"
      - "catalog/flask_app/tests/test_app_capability_config_saver.py"
      - "catalog/flask_app/tests/test_capability_config_migration_service.py"
      - "catalog/flask_app/tests/test_recorder_capability_config_runtime.py"
      - "catalog/flask_app/tests/test_post_setup_handoff.py"
      - "catalog/flask_app/tests/test_connected_ai_provider.py"
      - "catalog/flask_app/tests/test_legacy_startup_retired.py"

permissions:
  contents: read

concurrency:
  group: capability-config-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capability-config:
    name: capability-config (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest ruff

      - name: Compile capability configuration boundary
        run: >-
          python -m compileall -q
          catalog/flask_app/app.py
          catalog/flask_app/capability_startup_transition_routes.py
          catalog/flask_app/server_setup_routes.py
          catalog/flask_app/services/capability_config_migration_service.py
          catalog/flask_app/services/capability_config_service.py
          catalog/mtconnect_recorder/runtime.py
          catalog/flask_app/tests/test_app_capability_config_saver.py
          catalog/flask_app/tests/test_capability_config_migration_service.py
          catalog/flask_app/tests/test_recorder_capability_config_runtime.py
          catalog/flask_app/tests/test_post_setup_handoff.py
          catalog/flask_app/tests/test_legacy_startup_retired.py

      - name: Run capability configuration regressions
        run: >-
          python -m pytest -o addopts= -q
          catalog/flask_app/tests/test_app_capability_config_saver.py
          catalog/flask_app/tests/test_capability_config_migration_service.py
          catalog/flask_app/tests/test_recorder_capability_config_runtime.py
          catalog/flask_app/tests/test_post_setup_handoff.py
          catalog/flask_app/tests/test_connected_ai_provider.py
          catalog/flask_app/tests/test_legacy_startup_retired.py
          catalog/flask_app/tests/test_capability_startup_transition_route.py
          catalog/flask_app/tests/test_recorder_control_service.py

      - name: Ruff capability configuration boundary
        run: >-
          python -m ruff check
          catalog/flask_app/app.py
          catalog/flask_app/capability_startup_transition_routes.py
          catalog/flask_app/server_setup_routes.py
          catalog/flask_app/services/capability_config_migration_service.py
          catalog/flask_app/services/capability_config_service.py
          catalog/mtconnect_recorder/runtime.py
          catalog/flask_app/tests/test_app_capability_config_saver.py
          catalog/flask_app/tests/test_capability_config_migration_service.py
          catalog/flask_app/tests/test_recorder_capability_config_runtime.py
          catalog/flask_app/tests/test_post_setup_handoff.py
          catalog/flask_app/tests/test_legacy_startup_retired.py
          --ignore I001,RUF022,B008,C408,PLC0206,UP035

      - name: Validate Compose configuration
        run: docker compose config

      - name: Diff hygiene
        shell: bash
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi
