name: Physical rig read-only baseline

# Strictly read-only inventory of the self-hosted rig machines, taken through
# the runners that already live on them. Nothing here starts, stops,
# reconfigures or writes to any service: it reads process tables, listening
# sockets, Docker's own listings, git metadata in the rig checkouts, and
# SQLite state opened in read-only mode. No secret values are printed, only
# the names of the keys that are set.
#
# Astra needs this baseline before any physical deployment decision, and the
# rig machines are only reachable from themselves, so the runners collect it.

on:
  push:
    branches:
      - ci/rig-readonly-baseline
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rig-readonly-baseline
  cancel-in-progress: false

jobs:
  nettking:
    name: Nettking baseline (read-only)
    runs-on: fcp-windows
    timeout-minutes: 20
    steps:
      - name: Use Nettking Python 3.12.10
        shell: cmd
        run: |
          if not exist "C:\actions-runner\toolchains\python-3.12.10\python.exe" exit /b 1
          echo C:\actions-runner\toolchains\python-3.12.10>>"%GITHUB_PATH%"

      - name: Host identity, OS and uptime
        shell: cmd
        continue-on-error: true
        run: |
          echo === hostname ===
          hostname
          echo === os ===
          ver
          systeminfo | findstr /B /C:"OS Name" /C:"OS Version" /C:"System Boot Time" /C:"Total Physical Memory"

      - name: Volumes and free space
        shell: python
        continue-on-error: true
        run: |
          import os
          import shutil
          import string

          GIB = 1024 ** 3
          for letter in string.ascii_uppercase:
              root = f"{letter}:\\"
              if not os.path.exists(root):
                  continue
              try:
                  usage = shutil.disk_usage(root)
              except OSError as error:
                  print(f"{root:6s} unavailable ({error})")
                  continue
              print(
                  f"{root:6s} {usage.free / GIB:9.2f} GiB free of "
                  f"{usage.total / GIB:9.2f} GiB"
              )

      - name: FCP-related processes
        shell: cmd
        continue-on-error: true
        run: |
          echo === python / flask / ollama / docker processes ===
          tasklist /fi "IMAGENAME eq python.exe" /v
          tasklist /fi "IMAGENAME eq pythonw.exe"
          tasklist /fi "IMAGENAME eq ollama.exe"
          tasklist /fi "IMAGENAME eq com.docker.backend.exe"
          tasklist /fi "IMAGENAME eq Docker Desktop.exe"
          echo === wsl ===
          wsl --list --verbose

      - name: Listening sockets on the product ports
        shell: cmd
        continue-on-error: true
        run: |
          echo === product ports: flask 5000, relay 8765, provider 11434 ===
          netstat -ano | findstr /R /C:":5000 " /C:":8765 " /C:":11434 "
          echo === all listening ===
          netstat -ano | findstr LISTENING

      - name: Docker containers, compose projects and volumes
        shell: cmd
        continue-on-error: true
        run: |
          echo === docker version ===
          docker version --format "{{.Server.Version}}"
          echo === containers (all) ===
          docker ps -a --format "table {{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"
          echo === compose projects ===
          docker compose ls --all
          echo === compose project labels ===
          docker ps -a --format "{{.Names}}\t{{.Label \"com.docker.compose.project\"}}\t{{.Label \"com.docker.compose.service\"}}"
          echo === volumes ===
          docker volume ls
          echo === images ===
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.CreatedAt}}"

      - name: Rig checkout state
        shell: python
        continue-on-error: true
        run: |
          import subprocess
          from pathlib import Path

          # -c safe.directory is command-scoped. It reads through git's dubious
          # ownership guard (the checkouts belong to the interactive user, the
          # runner is NetworkService) without writing any git configuration.
          BASE = ["git", "-c", "safe.directory=*"]
          candidates = [
              Path(r"C:\wsl\msh"),
              Path(r"C:\msh\git"),
              Path(r"C:\actions-runner\_work\msh\msh"),
          ]
          for repo in candidates:
              print(f"\n=== {repo} ===")
              if not (repo / ".git").exists():
                  print("  not a git checkout (or absent)")
                  continue
              for label, args in (
                  ("HEAD", ["rev-parse", "HEAD"]),
                  ("branch", ["rev-parse", "--abbrev-ref", "HEAD"]),
                  ("last commit", ["log", "-1", "--format=%h %ad %s", "--date=iso"]),
                  ("describes main?", ["merge-base", "--is-ancestor", "HEAD", "origin/main"]),
                  ("status", ["status", "--porcelain"]),
              ):
                  try:
                      out = subprocess.run(
                          [*BASE, "-C", str(repo), *args],
                          capture_output=True, text=True, timeout=60,
                      )
                      value = (out.stdout or out.stderr).strip()
                      if label.startswith("describes"):
                          value = "yes" if out.returncode == 0 else "no (or unknown)"
                  except Exception as error:  # noqa: BLE001
                      value = f"<{error}>"
                  if label == "status":
                      lines = [l for l in value.splitlines() if l]
                      print(f"  status: {len(lines)} modified/untracked entries")
                      for line in lines[:25]:
                          print(f"    {line}")
                  else:
                      print(f"  {label}: {value}")

      - name: Identify the processes holding the product ports
        shell: python
        continue-on-error: true
        run: |
          import csv
          import io
          import re
          import subprocess
          from pathlib import Path

          def run(args):
              return subprocess.run(
                  args, capture_output=True, text=True, timeout=120
              ).stdout

          images = {}
          for row in csv.reader(io.StringIO(run(["tasklist", "/fo", "csv", "/nh"]))):
              if len(row) >= 2:
                  images[row[1]] = row[0]

          print("=== owners of the product ports ===")
          wanted = {"5000", "8765", "11434"}
          for line in run(["netstat", "-ano"]).splitlines():
              parts = line.split()
              if len(parts) < 5 or parts[0] != "TCP" or parts[3] != "LISTENING":
                  continue
              port = parts[1].rsplit(":", 1)[-1]
              if port not in wanted:
                  continue
              pid = parts[4]
              print(f"  {parts[1]:32s} pid={pid:8s} image={images.get(pid, '<unknown>')}")

          print("\n=== every python/ollama/docker process ===")
          for pid, image in sorted(images.items(), key=lambda kv: kv[1].lower()):
              if re.search(r"python|ollama|docker|flask|node", image, re.I):
                  print(f"  pid={pid:8s} {image}")

          print("\n=== msh-shaped directories ===")
          for base in (Path("C:/"), Path("C:/msh"), Path("C:/wsl")):
              if not base.exists():
                  print(f"  {base}: absent")
                  continue
              try:
                  entries = sorted(
                      d.name for d in base.iterdir()
                      if d.is_dir() and re.search(r"msh|fcp|wsl|acceptance|candidate", d.name, re.I)
                  )
              except OSError as error:
                  print(f"  {base}: unreadable ({error})")
                  continue
              print(f"  {base}: {entries or '(none matching)'}")

      - name: Environment configuration (key names only, no secret values)
        shell: python
        continue-on-error: true
        run: |
          from pathlib import Path

          SAFE = {
              "FCP_BUILD_COMMIT", "FCP_WEB_PORT", "FCP_WEB_BIND",
              "FCP_RELAY_PORT", "FCP_RELAY_BIND", "FCP_PROVIDER_PORT",
              "FCP_DATA_DIR", "FCP_RECORDER_DATA_DIR", "FCP_RELAY_VOLUME_NAME",
              "FCP_BASE_URL", "FCP_AI_MODEL", "COMPOSE_PROJECT_NAME",
          }
          for repo in (Path(r"C:\wsl\msh"), Path(r"C:\msh\git")):
              env = repo / ".env"
              print(f"\n=== {env} ===")
              if not env.exists():
                  print("  absent")
                  continue
              for raw in env.read_text(encoding="utf-8", errors="replace").splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#") or "=" not in line:
                      continue
                  key, _, value = line.partition("=")
                  key = key.strip()
                  if key in SAFE:
                      print(f"  {key}={value.strip()}")
                  else:
                      print(f"  {key}=<set, not shown>")

      - name: Federation and recorder state (SQLite, read-only)
        shell: python
        continue-on-error: true
        run: |
          import sqlite3
          from pathlib import Path

          INTERESTING = (
              "capabilit", "session", "node", "member", "grant", "group",
              "identity", "enrol",
          )
          roots = [Path(r"C:\wsl\msh"), Path(r"C:\msh\git")]
          seen = 0
          for root in roots:
              if not root.exists():
                  print(f"\n=== {root}: absent ===")
                  continue
              print(f"\n=== {root}: SQLite state ===")
              for db in sorted(root.rglob("*.sqlite3")):
                  if ".git" in db.parts or "node_modules" in db.parts:
                      continue
                  seen += 1
                  if seen > 40:
                      print("  ... more databases not listed")
                      break
                  print(f"\n  {db}  ({db.stat().st_size} bytes)")
                  try:
                      connection = sqlite3.connect(
                          f"file:{db.as_posix()}?mode=ro", uri=True, timeout=5
                      )
                  except sqlite3.Error as error:
                      print(f"    unreadable: {error}")
                      continue
                  try:
                      connection.row_factory = sqlite3.Row
                      tables = [
                          r[0] for r in connection.execute(
                              "SELECT name FROM sqlite_master WHERE type='table'"
                          )
                      ]
                      print(f"    tables: {', '.join(tables) or '(none)'}")
                      for table in tables:
                          if not any(k in table.lower() for k in INTERESTING):
                              continue
                          try:
                              rows = list(
                                  connection.execute(
                                      f'SELECT * FROM "{table}" LIMIT 10'
                                  )
                              )
                          except sqlite3.Error as error:
                              print(f"    {table}: unreadable ({error})")
                              continue
                          print(f"    {table}: {len(rows)} row(s) shown")
                          for row in rows:
                              item = {
                                  k: row[k]
                                  for k in row.keys()
                                  if not isinstance(row[k], (bytes, bytearray))
                              }
                              print(f"      {item}")
                  finally:
                      connection.close()

      - name: MSH Recorder reachability (best effort, read-only)
        shell: cmd
        continue-on-error: true
        run: |
          echo === ssh availability under the runner account ===
          where ssh
          echo === probe (BatchMode, no interactive auth) ===
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new martin@msh-recorder.tail4ccd2b.ts.net "hostname && uname -a || ver"

      # The job log is only readable from its tail through the API available
      # here, and the SQLite dump above is long, so restate the facts that
      # matter in one compact block at the end.
      - name: Baseline summary
        shell: python
        if: always()
        run: |
          import csv
          import io
          import json
          import re
          import shutil
          import sqlite3
          import subprocess
          from pathlib import Path

          GIB = 1024 ** 3

          def run(args):
              try:
                  return subprocess.run(
                      args, capture_output=True, text=True, timeout=120
                  ).stdout
              except Exception:  # noqa: BLE001
                  return ""

          print("================ RIG BASELINE SUMMARY: NETTKING ================")
          print(f"hostname            : {run(['hostname']).strip()}")
          usage = shutil.disk_usage("C:/")
          print(
              f"C: volume           : {usage.free / GIB:.2f} GiB free of "
              f"{usage.total / GIB:.2f} GiB"
          )

          images = {}
          for row in csv.reader(io.StringIO(run(["tasklist", "/fo", "csv", "/nh"]))):
              if len(row) >= 2:
                  images[row[1]] = row[0]
          print("product ports       :")
          for line in run(["netstat", "-ano"]).splitlines():
              parts = line.split()
              if len(parts) < 5 or parts[0] != "TCP" or parts[3] != "LISTENING":
                  continue
              if parts[1].rsplit(":", 1)[-1] not in {"5000", "8765", "11434"}:
                  continue
              print(f"    {parts[1]:28s} pid={parts[4]:7s} {images.get(parts[4], '?')}")

          print("checkouts           :")
          for repo in (Path(r"C:\wsl\msh"), Path(r"C:\msh\git")):
              if not (repo / ".git").exists():
                  print(f"    {repo}: absent / not a checkout")
                  continue
              head = run(["git", "-c", "safe.directory=*", "-C", str(repo),
                          "rev-parse", "HEAD"]).strip()
              branch = run(["git", "-c", "safe.directory=*", "-C", str(repo),
                            "rev-parse", "--abbrev-ref", "HEAD"]).strip()
              dirty = run(["git", "-c", "safe.directory=*", "-C", str(repo),
                           "status", "--porcelain"]).strip()
              print(f"    {repo}: {branch} @ {head} "
                    f"({'clean' if not dirty else 'dirty'})")

          print("sibling checkouts   :")
          for base in (Path("C:/"), Path("C:/msh"), Path("C:/wsl")):
              if not base.exists():
                  print(f"    {base}: absent")
                  continue
              try:
                  matches = sorted(
                      d for d in base.iterdir()
                      if d.is_dir()
                      and re.search(r"msh|fcp|acceptance|candidate", d.name, re.I)
                  )
              except OSError as error:
                  print(f"    {base}: unreadable ({error})")
                  continue
              if not matches:
                  print(f"    {base}: (none matching)")
              for match in matches:
                  if (match / ".git").exists():
                      head = run(["git", "-c", "safe.directory=*", "-C", str(match),
                                  "rev-parse", "HEAD"]).strip()[:12]
                      branch = run(["git", "-c", "safe.directory=*", "-C", str(match),
                                    "rev-parse", "--abbrev-ref", "HEAD"]).strip()
                      subject = run(["git", "-c", "safe.directory=*", "-C", str(match),
                                     "log", "-1", "--format=%ad %s", "--date=short"]).strip()
                      print(f"    {match}: {branch} @ {head} | {subject[:80]}")
                  else:
                      try:
                          entries = len(list(match.iterdir()))
                      except OSError:
                          entries = "?"
                      print(f"    {match}: not a checkout ({entries} entries)")

          device = Path(r"C:\wsl\msh\data\federation\device\node_state.sqlite3")
          print("device node state   :")
          if not device.exists():
              print("    absent")
          else:
              connection = sqlite3.connect(
                  f"file:{device.as_posix()}?mode=ro", uri=True, timeout=5
              )
              connection.row_factory = sqlite3.Row
              try:
                  runtime = connection.execute("SELECT * FROM node_runtime").fetchone()
                  print(f"    node_id           : {runtime['node_id']}")
                  print(f"    enrollment_state  : {runtime['enrollment_state']}")
                  print(f"    connection_state  : {runtime['connection_state']}")
                  print(f"    updated_at        : {runtime['updated_at']}")
                  for row in connection.execute("SELECT * FROM joined_sessions"):
                      print(f"    session           : {row['session_id']} "
                            f"({row['membership_state']}, rev "
                            f"{row['last_applied_revision']})")
                  print("    cached capabilities:")
                  for row in connection.execute(
                      "SELECT capability_id, capability_json FROM advertised_capabilities"
                  ):
                      payload = json.loads(row["capability_json"])
                      print(f"      {row['capability_id']}  "
                            f"type={payload.get('type')} status={payload.get('status')}")
              finally:
                  connection.close()
          print("===============================================================")

  nitro:
    name: Nitro baseline (read-only)
    runs-on: fcp-linux
    timeout-minutes: 20
    steps:
      - name: Nitro read-only inventory
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "=== host ==="
          hostname; uname -a; uptime
          echo "=== disk ==="
          df -h / /home 2>/dev/null | sort -u
          echo "=== fcp-shaped processes ==="
          ps -eo pid,etime,cmd --sort=start_time \
            | grep -Ei 'fcp|flask|recorder|relay|gunicorn|ollama|python' \
            | grep -v grep || echo "  (none)"
          echo "=== listening sockets ==="
          ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null || echo "  (unavailable)"
          echo "=== docker ==="
          docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' || true
          docker compose ls --all || true
          docker volume ls || true
          echo "=== rig checkouts ==="
          for repo in /home/martin/fcp /home/martin/msh /home/martin/actions-runner/_work/msh/msh; do
            if [ -d "$repo/.git" ]; then
              echo "  $repo: $(git -c safe.directory='*' -C "$repo" rev-parse --abbrev-ref HEAD) @ $(git -c safe.directory='*' -C "$repo" rev-parse HEAD)"
              echo "    last: $(git -c safe.directory='*' -C "$repo" log -1 --format='%ad %s' --date=short)"
              dirty=$(git -c safe.directory='*' -C "$repo" status --porcelain | wc -l)
              echo "    working tree entries changed: $dirty"
            else
              echo "  $repo: absent or not a checkout"
            fi
          done
          echo "=== sibling directories ==="
          ls -1d /home/martin/*fcp* /home/martin/*msh* 2>/dev/null || echo "  (none)"

      - name: Nitro federation state (SQLite, read-only)
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          roots = [Path("/home/martin/fcp"), Path("/home/martin/msh")]
          print("================ RIG BASELINE SUMMARY: NITRO ================")
          for root in roots:
              if not root.exists():
                  print(f"{root}: absent")
                  continue
              devices = sorted(root.rglob("node_state.sqlite3"))
              if not devices:
                  print(f"{root}: no node_state.sqlite3 found")
              for device in devices:
                  print(f"\n{device}")
                  try:
                      connection = sqlite3.connect(
                          f"file:{device.as_posix()}?mode=ro", uri=True, timeout=5
                      )
                  except sqlite3.Error as error:
                      print(f"  unreadable: {error}")
                      continue
                  connection.row_factory = sqlite3.Row
                  try:
                      runtime = connection.execute(
                          "SELECT * FROM node_runtime"
                      ).fetchone()
                      if runtime is not None:
                          print(f"  node_id          : {runtime['node_id']}")
                          print(f"  enrollment_state : {runtime['enrollment_state']}")
                          print(f"  connection_state : {runtime['connection_state']}")
                          print(f"  updated_at       : {runtime['updated_at']}")
                      for row in connection.execute("SELECT * FROM joined_sessions"):
                          print(f"  session          : {row['session_id']} "
                                f"({row['membership_state']}, rev "
                                f"{row['last_applied_revision']})")
                      print("  cached capabilities:")
                      for row in connection.execute(
                          "SELECT capability_id, capability_json "
                          "FROM advertised_capabilities"
                      ):
                          payload = json.loads(row["capability_json"])
                          print(f"    {row['capability_id']}  "
                                f"type={payload.get('type')} "
                                f"status={payload.get('status')}")
                  except sqlite3.Error as error:
                      print(f"  query failed: {error}")
                  finally:
                      connection.close()
          print("============================================================")
          PY

