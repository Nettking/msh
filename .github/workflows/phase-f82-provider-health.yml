name: Phase F8.2 provider health synchronization

on:
  pull_request:
    paths:
      - "catalog/capabilities/provider_health.py"
      - "catalog/capabilities/tests/test_provider_health.py"
      - "catalog/capabilities/provider_enrollment.py"
      - "catalog/capabilities/provider_reports.py"
      - "catalog/capabilities/provider_selection.py"
      - "catalog/capabilities/__init__.py"
      - "docs/implementation/phase_f8_plan.md"
      - ".github/workflows/phase-f82-provider-health.yml"
  push:
    branches: [main]
    paths:
      - "catalog/capabilities/provider_health.py"
      - "catalog/capabilities/tests/test_provider_health.py"
      - "catalog/capabilities/provider_enrollment.py"
      - "catalog/capabilities/provider_reports.py"
      - "catalog/capabilities/provider_selection.py"
      - "catalog/capabilities/__init__.py"
      - "docs/implementation/phase_f8_plan.md"
      - ".github/workflows/phase-f82-provider-health.yml"

permissions:
  contents: read

concurrency:
  group: f82-provider-health-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-health:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest ruff
      - name: Compile F8.2 boundary
        run: >-
          python -m compileall
          catalog/capabilities/provider_health.py
          catalog/capabilities/tests/test_provider_health.py
      - name: F8.2 and affected federation regressions
        run: >-
          python -m pytest -o addopts= -q
          catalog/capabilities/tests
          catalog/federation/tests/test_phase0.py
          catalog/federation/tests/test_phase1.py
          catalog/federation/tests/test_phase2_unit.py
      - name: Ruff F8.2 boundary
        run: >-
          python -m ruff check
          catalog/capabilities/provider_health.py
          catalog/capabilities/tests/test_provider_health.py
          --ignore I001,RUF022,B008,C408,PLC0206,UP035
      - name: Compose validation
        run: docker compose config --quiet
      - name: Diff hygiene
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD
