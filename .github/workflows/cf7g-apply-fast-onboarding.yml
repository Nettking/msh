name: Apply CF7-G fast onboarding

on:
  push:
    branches:
      - agent/cf7g-fast-federation-onboarding

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cf7g-fast-federation-onboarding
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply patch
        run: python tools/apply_cf7g_fast_onboarding.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest ruff
      - name: Compile changed Python
        run: |
          python -m compileall -q \
            catalog/flask_app/capability_startup_transition_routes.py \
            catalog/flask_app/services/capability_startup_transition_service.py \
            catalog/flask_app/services/onboarding_view_normalizer.py \
            catalog/flask_app/tests/test_fast_federation_onboarding.py \
            catalog/flask_app/tests/test_functional_onboarding_progress.py
      - name: Run focused tests
        run: |
          python -m pytest -o addopts= -q \
            catalog/flask_app/tests/test_fast_federation_onboarding.py \
            catalog/flask_app/tests/test_functional_onboarding_progress.py \
            catalog/flask_app/tests/test_capability_onboarding_route.py \
            catalog/flask_app/tests/test_federation_pairing_service.py \
            catalog/flask_app/tests/test_cf5_ui_shell.py \
            catalog/flask_app/tests/test_federation_overview_route.py
      - name: Ruff changed Python
        run: |
          ruff check \
            catalog/flask_app/capability_startup_transition_routes.py \
            catalog/flask_app/services/capability_startup_transition_service.py \
            catalog/flask_app/services/onboarding_view_normalizer.py \
            catalog/flask_app/tests/test_fast_federation_onboarding.py \
            catalog/flask_app/tests/test_functional_onboarding_progress.py
      - name: Commit validated change
        run: |
          rm tools/apply_cf7g_fast_onboarding.py
          rm .github/workflows/cf7g-apply-fast-onboarding.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Make Federation onboarding finish after inspection"
          git push origin HEAD:agent/cf7g-fast-federation-onboarding
