name: Apply F3 refresh fence follow-up

on:
  push:
    branches:
      - agent/phase-f3-refresh-fence-fix
    paths:
      - ".github/workflows/f3-refresh-fence-cherrypick.yml"

permissions:
  contents: write

jobs:
  cherry-pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-f3-refresh-fence-fix
          fetch-depth: 0
      - name: Apply only post-merge F3 fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin 79c8141e801a552e8c17ee05c82f072de00a0c2a db0c306b44dea42a01113cc063694a49659b592b
          git cherry-pick 79c8141e801a552e8c17ee05c82f072de00a0c2a
          git cherry-pick db0c306b44dea42a01113cc063694a49659b592b
          git diff --check origin/main...HEAD
          git push origin HEAD:agent/phase-f3-refresh-fence-fix
