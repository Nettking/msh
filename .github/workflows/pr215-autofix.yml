name: PR 215 scoped autofix

on:
  push:
    branches:
      - fix-production-readiness-issues-in-pipeline

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-production-readiness-issues-in-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest ruff
      - name: Apply reviewed fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {count}: {old[:80]!r}")
              file_path.write_text(text.replace(old, new, 1), encoding="utf-8")

          def append_once(path: str, marker: str, addition: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              if marker in text:
                  return
              file_path.write_text(text.rstrip() + "\n\n\n" + addition.rstrip() + "\n", encoding="utf-8")

          # Ruff fixes plus safer background exception boundary.
          replace_once(
              "catalog/flask_app/services/data_upload_service.py",
              """        except (\n            BaseException\n        ) as exc:  # noqa: BLE001 - worker must persist a safe terminal state\n""",
              """        except Exception as exc:  # noqa: BLE001 - worker must persist a safe terminal state\n""",
          )
          replace_once(
              "catalog/flask_app/services/data_upload_service.py",
              "                        payload = json.dumps(\n",
              "                        json.dumps(\n",
          )
          replace_once(
              "catalog/flask_app/services/upload_analysis_job_service.py",
              """            except (\n                Exception\n            ):  # noqa: BLE001,S112 - one damaged job must not hide others\n""",
              """            except Exception:  # noqa: BLE001,S112 - one damaged job must not hide others\n""",
          )
          replace_once(
              "catalog/flask_app/services/upload_analysis_job_service.py",
              """            except (\n                Exception\n            ):  # noqa: BLE001,S112 - startup remains available and fails closed\n""",
              """            except Exception:  # noqa: BLE001,S112 - startup remains available and fails closed\n""",
          )

          # Track source freshness per date so processed sessions are invalidated
          # when new uploads add/change files for an already-processed day.
          replace_once(
              "catalog/runner/data_filtering.py",
              "import json\n",
              "import hashlib\nimport json\n",
          )
          replace_once(
              "catalog/runner/data_filtering.py",
              """FILTER_PROGRESS_RECORD_INTERVAL = 100_000\n\n\ndef discover_available_dates""",
              """FILTER_PROGRESS_RECORD_INTERVAL = 100_000\n\n\ndef source_date_signatures(data_dir: Path) -> dict[str, str]:\n    \"\"\"Return stable source identities grouped by represented telemetry date.\n\n    The data index already owns the repository's conservative size/mtime freshness\n    contract.  Reuse that same contract to invalidate filtered sessions when a\n    newly published upload changes the source set for a date that was processed\n    previously.\n    \"\"\"\n    index_data, root_entries, _stats = _refresh_data_index_for_root(data_dir)\n    _write_data_index(index_data)\n    digests: dict[str, Any] = {}\n    for relative_path, entry in sorted(root_entries.items()):\n        identity = (\n            f\"{relative_path}\\0{entry.get('file_size')}\\0{entry.get('mtime_ns')}\\n\"\n        ).encode(\"utf-8\")\n        for represented_date in sorted(\n            _deserialize_dates(entry.get(\"dates\", []))\n        ):\n            key = represented_date.isoformat()\n            digest = digests.setdefault(key, hashlib.sha256())\n            digest.update(identity)\n    return {key: digest.hexdigest() for key, digest in digests.items()}\n\n\ndef date_range_source_signature(\n    signatures: dict[str, str], start_date: date, end_date: date\n) -> str:\n    \"\"\"Combine per-day source identities for one session filter range.\"\"\"\n    digest = hashlib.sha256()\n    for key in sorted(signatures):\n        try:\n            represented_date = date.fromisoformat(key)\n        except ValueError:\n            continue\n        if start_date <= represented_date <= end_date:\n            digest.update(key.encode(\"utf-8\"))\n            digest.update(b\"\\0\")\n            digest.update(signatures[key].encode(\"ascii\"))\n            digest.update(b\"\\n\")\n    return digest.hexdigest()\n\n\ndef discover_available_dates""",
          )
          replace_once(
              "catalog/runner/data_filtering.py",
              """    filtered_data_dir = session_dir / str(metadata[\"paths\"][\"filtered_data_dir\"])\n    filter_result = metadata.setdefault(\"filter_result\", {})\n    if _session_filter_cache_is_valid(session_dir, metadata):\n""",
              """    filtered_data_dir = session_dir / str(metadata[\"paths\"][\"filtered_data_dir\"])\n    filter_result = metadata.setdefault(\"filter_result\", {})\n    filter_config = metadata[\"filter\"]\n    filter_start_date = date.fromisoformat(str(filter_config[\"start_date\"]))\n    filter_end_date = date.fromisoformat(str(filter_config[\"end_date\"]))\n    source_signature = date_range_source_signature(\n        source_date_signatures(source_data_dir),\n        filter_start_date,\n        filter_end_date,\n    )\n    if _session_filter_cache_is_valid(\n        session_dir, metadata, source_signature=source_signature\n    ):\n""",
          )
          replace_once(
              "catalog/runner/data_filtering.py",
              """    filter_config = metadata[\"filter\"]\n    matched_records, matched_files = filter_data_by_date_range(\n""",
              """    matched_records, matched_files = filter_data_by_date_range(\n""",
          )
          replace_once(
              "catalog/runner/data_filtering.py",
              """    filter_result[\"matched_files\"] = matched_files\n    filter_result[\"filtered_data_path\"] = metadata[\"paths\"][\"filtered_data_dir\"]\n""",
              """    filter_result[\"matched_files\"] = matched_files\n    filter_result[\"source_signature\"] = source_signature\n    filter_result[\"filtered_data_path\"] = metadata[\"paths\"][\"filtered_data_dir\"]\n""",
          )
          replace_once(
              "catalog/runner/data_filtering.py",
              """def _session_filter_cache_is_valid(session_dir: Path, metadata: dict) -> bool:\n""",
              """def _session_filter_cache_is_valid(\n    session_dir: Path,\n    metadata: dict,\n    *,\n    source_signature: str | None = None,\n) -> bool:\n""",
          )
          replace_once(
              "catalog/runner/data_filtering.py",
              """    filter_payload = metadata.get(\"filter\", {})\n""",
              """    if (\n        source_signature is not None\n        and str(filter_result.get(\"source_signature\") or \"\") != source_signature\n    ):\n        return False\n    filter_payload = metadata.get(\"filter\", {})\n""",
          )

          # Make the orchestrator use the source freshness evidence and fence the
          # explicit execution reservation against the periodic poller race.
          replace_once(
              "catalog/orchestrator/pipeline.py",
              """from catalog.runner.data_filtering import (\n    discover_available_dates,\n    ensure_session_filtered_data,\n)\n""",
              """from catalog.runner.data_filtering import (\n    date_range_source_signature,\n    discover_available_dates,\n    ensure_session_filtered_data,\n    source_date_signatures,\n)\n""",
          )
          replace_once(
              "catalog/orchestrator/pipeline.py",
              """        while not self._stop.is_set():\n            try:\n""",
              """        while not self._stop.is_set():\n            with self._lock:\n                execution_reserved = self._state.active_execution_id is not None\n            if execution_reserved:\n                # Explicit user-triggered work owns this scheduling slot.  Do not\n                # let the periodic poller win the race between reservation and the\n                # requested worker entering _run_update().\n                self._stop.wait(1)\n                continue\n            try:\n""",
          )
          replace_once(
              "catalog/orchestrator/pipeline.py",
              """    def _verified_processed_dates(self, *, script_options) -> set[str]:\n""",
              """    def _verified_processed_dates(\n        self,\n        *,\n        script_options,\n        source_signatures: dict[str, str] | None = None,\n    ) -> set[str]:\n""",
          )
          replace_once(
              "catalog/orchestrator/pipeline.py",
              """            filtered_dir = session.session_dir / str(\n""",
              """            if source_signatures is not None:\n                filter_result = metadata.get(\"filter_result\", {})\n                if not isinstance(filter_result, dict):\n                    continue\n                try:\n                    expected_source_signature = date_range_source_signature(\n                        source_signatures,\n                        date.fromisoformat(start_date),\n                        date.fromisoformat(end_date),\n                    )\n                except ValueError:\n                    continue\n                if (\n                    str(filter_result.get(\"source_signature\") or \"\")\n                    != expected_source_signature\n                ):\n                    continue\n            filtered_dir = session.session_dir / str(\n""",
          )
          replace_once(
              "catalog/orchestrator/pipeline.py",
              """            if self._state.update_running and not bootstrap:\n                return OrchestrationResult(\"none\", self.workflows_root, [], [], [], [])\n""",
              """            if (\n                self._state.active_execution_id is not None\n                and self._state.active_execution_id != execution_id\n            ):\n                return OrchestrationResult(\"none\", self.workflows_root, [], [], [], [])\n            if self._state.update_running and not bootstrap:\n                return OrchestrationResult(\"none\", self.workflows_root, [], [], [], [])\n""",
          )
          replace_once(
              "catalog/orchestrator/pipeline.py",
              """        script_options = discover_runnable_scripts(self.root / \"catalog\")\n""",
              """        current_source_signatures = source_date_signatures(self.data_dir)\n        script_options = discover_runnable_scripts(self.root / \"catalog\")\n""",
          )
          # Two verification passes occur in _run_update; both must use the same
          # source snapshot for the cycle.
          pipeline_path = Path("catalog/orchestrator/pipeline.py")
          pipeline_text = pipeline_path.read_text(encoding="utf-8")
          old_call = """        verified_processed_dates = self._verified_processed_dates(\n            script_options=script_options\n        )\n"""
          if pipeline_text.count(old_call) != 1:
              raise SystemExit(f"expected initial verified call once, found {pipeline_text.count(old_call)}")
          pipeline_text = pipeline_text.replace(
              old_call,
              """        verified_processed_dates = self._verified_processed_dates(\n            script_options=script_options,\n            source_signatures=current_source_signatures,\n        )\n""",
              1,
          )
          old_post = """                verified_processed_dates = self._verified_processed_dates(\n                    script_options=script_options\n                )\n"""
          if pipeline_text.count(old_post) != 1:
              raise SystemExit(f"expected post-run verified call once, found {pipeline_text.count(old_post)}")
          pipeline_text = pipeline_text.replace(
              old_post,
              """                verified_processed_dates = self._verified_processed_dates(\n                    script_options=script_options,\n                    source_signatures=current_source_signatures,\n                )\n""",
              1,
          )
          pipeline_path.write_text(pipeline_text, encoding="utf-8")

          # Regression: changing source for an already filtered date must rebuild
          # the session instead of reusing stale filtered data.
          replace_once(
              "catalog/runner/tests/test_data_filtering.py",
              "from catalog.runner import data_filtering\n",
              "from catalog.runner import data_filtering\nfrom catalog.runner.session_store import initialize_session_metadata\n",
          )
          append_once(
              "catalog/runner/tests/test_data_filtering.py",
              "test_session_filter_cache_invalidates_when_source_changes_for_processed_date",
              '''def test_session_filter_cache_invalidates_when_source_changes_for_processed_date(\n    tmp_path: Path, isolated_data_index: Path\n) -> None:\n    data_dir = tmp_path / "data"\n    source = data_dir / "2026-04-11.jsonl"\n    _write_jsonl(\n        source,\n        [{"timestamp": "2026-04-11T08:00:00Z", "machine": "A"}],\n    )\n    session_dir = tmp_path / "session"\n    session_dir.mkdir()\n    metadata = initialize_session_metadata(\n        "session-source-refresh",\n        date(2026, 4, 11),\n        date(2026, 4, 11),\n        start_hour=None,\n        end_hour=None,\n        runtime_namespace="test",\n        script_options=[],\n    )\n\n    first = data_filtering.ensure_session_filtered_data(\n        source_data_dir=data_dir,\n        session_dir=session_dir,\n        metadata=metadata,\n    )\n    assert first == (1, 1, "created")\n\n    _write_jsonl(\n        source,\n        [\n            {"timestamp": "2026-04-11T08:00:00Z", "machine": "A"},\n            {"timestamp": "2026-04-11T09:00:00Z", "machine": "B"},\n        ],\n    )\n    os.utime(source, None)\n\n    second = data_filtering.ensure_session_filtered_data(\n        source_data_dir=data_dir,\n        session_dir=session_dir,\n        metadata=metadata,\n    )\n    third = data_filtering.ensure_session_filtered_data(\n        source_data_dir=data_dir,\n        session_dir=session_dir,\n        metadata=metadata,\n    )\n\n    assert second == (2, 1, "created")\n    assert third == (2, 1, "cached")\n''',
          )

          append_once(
              "catalog/orchestrator/tests/test_pipeline_bootstrap.py",
              "test_correlated_execution_reservation_blocks_uncorrelated_update",
              '''def test_correlated_execution_reservation_blocks_uncorrelated_update(\n    tmp_path: Path,\n) -> None:\n    orchestrator = pipeline.RuntimeOrchestrator.__new__(pipeline.RuntimeOrchestrator)\n    orchestrator._lock = threading.Lock()\n    orchestrator.workflows_root = tmp_path / "workflows"\n    orchestrator.workflows_root.mkdir(parents=True)\n    orchestrator._state = pipeline.RuntimeOrchestrator._default_state(orchestrator)\n    orchestrator._state.startup_mode = pipeline.STARTUP_MODE_CLEAN\n    orchestrator._state.active_execution_id = "analysis-upload-race"\n\n    result = pipeline.RuntimeOrchestrator._run_update(\n        orchestrator, bootstrap=False, execution_id=None\n    )\n\n    assert result.session_id == "none"\n    assert orchestrator._state.active_execution_id == "analysis-upload-race"\n    assert orchestrator._state.update_running is False\n''',
          )
          PY
      - name: Lint reviewed boundaries
        run: >-
          python -m ruff check
          catalog/flask_app/services/data_upload_service.py
          catalog/flask_app/services/upload_analysis_job_service.py
          catalog/orchestrator/pipeline.py
          catalog/runner/data_filtering.py
          catalog/runner/tests/test_data_filtering.py
          catalog/orchestrator/tests/test_pipeline_bootstrap.py
          --ignore I001,RUF022,B008,C408,PLC0206,UP035
      - name: Run focused regressions
        run: >-
          python -m pytest -o addopts= -q
          catalog/flask_app/tests/test_data_upload.py
          catalog/flask_app/tests/test_upload_analysis_jobs.py
          catalog/runner/tests/test_data_filtering.py
          catalog/orchestrator/tests/test_pipeline_bootstrap.py
      - name: Commit reviewed fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/flask_app/services/data_upload_service.py \
                  catalog/flask_app/services/upload_analysis_job_service.py \
                  catalog/orchestrator/pipeline.py \
                  catalog/runner/data_filtering.py \
                  catalog/runner/tests/test_data_filtering.py \
                  catalog/orchestrator/tests/test_pipeline_bootstrap.py
          git diff --cached --check
          git commit -m "Fix upload refresh freshness and execution races"
          git push origin HEAD:fix-production-readiness-issues-in-pipeline
