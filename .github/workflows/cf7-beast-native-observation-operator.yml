name: Bounded CF7 BEAST existing-host metadata (operator only)
on:
  push:
    branches: [codex/cf7-beast-windows-d4d29b-20261012]
    paths: [.github/workflows/cf7-beast-native-observation-operator.yml]
permissions:
  contents: read
concurrency:
  group: cf7-beast-readonly-existing-host-metadata
  cancel-in-progress: false
jobs:
  windows-existing-volumes:
    runs-on: [self-hosted, Windows, X64, beast-windows]
    timeout-minutes: 3
    steps:
      - name: Read already mounted fixed local Windows volume facts only
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'Beast') { throw 'Wrong trusted Windows runner' }
          $root = Join-Path 'C:\fcp-cf7-physical' ('volumes-' + $env:GITHUB_RUN_ID + '-a' + $env:GITHUB_RUN_ATTEMPT)
          if (Test-Path -LiteralPath $root) { throw 'Existing evidence namespace' }
          New-Item -ItemType Directory -Path $root | Out-Null
          "CF7_VOLUME_EVIDENCE=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $sha = [Security.Cryptography.SHA256]::Create()
          function Hash-Text([string]$v) { -join ($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($v)) | ForEach-Object { $_.ToString('x2') }) }
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $volumes = @(Get-CimInstance Win32_LogicalDisk -Filter 'DriveType=3' | Select-Object -First 16 | ForEach-Object {
            [ordered]@{drive=$_.DeviceID; filesystem=$_.FileSystem; total_bytes=[long]$_.Size; free_bytes=[long]$_.FreeSpace; volume_identity_sha256=(Hash-Text $_.VolumeSerialNumber); user_writeability='NOT_TESTED'; directory_scanned=$false}
          })
          [ordered]@{schema='fcp.cf7.windows-existing-volumes-metadata.v1'; utc=[DateTime]::UtcNow.ToString('o'); run_id=$env:GITHUB_RUN_ID; runner_id=28; runner_name=$env:RUNNER_NAME; principal_sha256=(Hash-Text $sid); local_fixed_volumes=$volumes; mutations='Only new tiny metadata evidence namespace'; no_product_or_cleanup_or_docker_or_wsl=$true} | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $root 'WINDOWS_VOLUMES.json') -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cf7-beast-windows-volumes-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ env.CF7_VOLUME_EVIDENCE }}
          retention-days: 90
          if-no-files-found: error
  linux-existing-topology:
    runs-on: [self-hosted, Linux, X64, beast-linux, fcp-linux-fast]
    timeout-minutes: 3
    steps:
      - name: Read actual already running Linux environment facts only
        shell: bash
        run: |
          set -eu
          test "$RUNNER_NAME" = 'Beast-Linux-WSL'
          root="$RUNNER_TEMP/cf7-linux-topology-$GITHUB_RUN_ID-a$GITHUB_RUN_ATTEMPT"
          test ! -e "$root"
          mkdir "$root"
          echo "CF7_LINUX_EVIDENCE=$root" >> "$GITHUB_ENV"
          CF7_FACT_ROOT="$root" python3 -I -B - <<'PY'
          import datetime, hashlib, json, os, pathlib, platform, subprocess
          def hashed_file(path):
              try: return hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              except OSError: return None
          def virt(flag):
              try:
                  result=subprocess.run(['systemd-detect-virt', flag], capture_output=True, text=True, timeout=5)
                  return {'exit':result.returncode, 'kind':result.stdout.strip()[:128]}
              except (OSError, subprocess.TimeoutExpired) as e:
                  return {'unavailable':type(e).__name__}
          release={}
          for line in pathlib.Path('/etc/os-release').read_text().splitlines():
              key,sep,value=line.partition('=')
              if sep and key in ('NAME','PRETTY_NAME','ID','VERSION_ID'): release[key]=value.strip('"')
          proc=pathlib.Path('/proc/version').read_text()[:8192]
          facts={'schema':'fcp.cf7.already-running-linux-topology-metadata.v1', 'utc':datetime.datetime.now(datetime.timezone.utc).isoformat(), 'run_id':os.environ['GITHUB_RUN_ID'], 'runner_id':29, 'runner_name':os.environ['RUNNER_NAME'], 'actual_os':platform.system(), 'kernel_release':platform.release(), 'architecture':platform.machine(), 'distro':release, 'uid':os.getuid(), 'principal_sha256':hashlib.sha256((str(os.getuid())+'|'+str(os.getgid())).encode()).hexdigest(), 'linux_instance_identity_sha256':hashed_file('/etc/machine-id'), 'boot_identity_sha256':hashed_file('/proc/sys/kernel/random/boot_id'), 'machine_dmi_identity_sha256':hashed_file('/sys/class/dmi/id/product_uuid'), 'vm_virtualization':virt('--vm'), 'container_virtualization':virt('--container'), 'proc_version_microsoft':('microsoft' in proc.lower()), 'wsl_distro_name':os.environ.get('WSL_DISTRO_NAME'), 'wsl_interop_present':bool(os.environ.get('WSL_INTEROP')), 'new_runtime_started':False, 'checkout_or_packages_or_benchmarks':False, 'physical_linux_acceptance_pass_claimed':False}
          pathlib.Path(os.environ['CF7_FACT_ROOT'],'LINUX_TOPOLOGY.json').write_text(json.dumps(facts,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cf7-beast-linux-topology-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ env.CF7_LINUX_EVIDENCE }}
          retention-days: 90
          if-no-files-found: error
