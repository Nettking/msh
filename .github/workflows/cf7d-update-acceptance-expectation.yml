name: Update CF7-B onboarding completion expectation

on:
  push:
    branches:
      - agent/cf7d-streamlined-onboarding-flow
    paths:
      - ".github/workflows/cf7d-update-acceptance-expectation.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cf7d-streamlined-onboarding-flow
          fetch-depth: 0

      - name: Update exact product-flow assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("catalog/federation/tests/cf7_acceptance/test_product_acceptance.py")
          text = path.read_text(encoding="utf-8")
          old = '    assert finished.location.endswith("/federation")\n'
          new = '    assert finished.location == "/onboarding?step=finish"\n'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new), encoding="utf-8")
          Path(".github/workflows/cf7d-update-acceptance-expectation.yml").unlink()
          PY

      - name: Commit bounded acceptance update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep CF7 product acceptance inside onboarding finish"
          git push origin HEAD:agent/cf7d-streamlined-onboarding-flow
