name: PR 435 self-hosted bootstrap check

on:
  push:
    branches:
      - ci/self-hosted-pr435
  workflow_dispatch:

permissions:
  contents: read

env:
  VALIDATED_SHA: 13967aea9f4561cea64b5427bdf572de823ec577

jobs:
  linux-bootstrap:
    name: Linux bootstrap (Nitro)
    runs-on: fcp-linux
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VALIDATED_SHA }}
      - name: Verify candidate SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${VALIDATED_SHA}"
      - name: Verify exact Python in Docker
        shell: bash
        run: |
          docker run --rm python:3.12.13-bookworm python --version
          docker run --rm python:3.12.13-bookworm python -c "import platform; print(platform.machine())"

  windows-bootstrap:
    name: Windows bootstrap (Nettking)
    runs-on: fcp-windows
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VALIDATED_SHA }}
      - name: Use Nettking Python 3.12.10
        shell: cmd
        run: |
          @echo off
          set "ROOT=C:\actions-runner\toolchains\python-3.12.10"
          if not exist "%ROOT%\python.exe" (
            echo Python toolchain missing: %ROOT%\python.exe
            exit /b 1
          )
          >>"%GITHUB_PATH%" echo %ROOT%
          >>"%GITHUB_PATH%" echo %ROOT%\Scripts
      - name: Verify candidate SHA and Python
        shell: cmd
        run: |
          @echo off
          for /f %%H in ('git rev-parse HEAD') do set "ACTUAL=%%H"
          if /I not "%ACTUAL%"=="%VALIDATED_SHA%" (
            echo candidate SHA mismatch: %ACTUAL% != %VALIDATED_SHA%
            exit /b 1
          )
          for /f "delims=" %%V in ('python --version 2^>^&1') do set "PYVER=%%V"
          if not "%PYVER%"=="Python 3.12.10" (
            echo unexpected Python: %PYVER%
            exit /b 1
          )
          python -m pip --version
          python -c "import subprocess,sys; print(sys.executable); subprocess.check_call([sys.executable, '-c', 'print(42)'])"
