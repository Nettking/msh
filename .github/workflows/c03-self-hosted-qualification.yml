name: C03 self-hosted physical-readiness qualification

on:
  push:
    branches:
      - release/federation-v1-physical-readiness-20260908
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c03-physical-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-c03:
    name: C03 and acceptance qualification (Linux)
    runs-on: fcp-linux
    timeout-minutes: 180
    steps:
      - name: Repair workspace ownership before checkout
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "${GITHUB_WORKSPACE}:/workspace" python:3.12.13-bookworm \
            chown -R "$(id -u):$(id -g)" /workspace

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record exact candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git status --porcelain

      - name: Focused release qualification in Python 3.12.13
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -e PYTHONPYCACHEPREFIX=/tmp/pycache \
            -w /workspace \
            python:3.12.13-bookworm bash -lc '
              set -euo pipefail
              python -m pip install --upgrade pip==26.2.1
              python -m pip install -r requirements.txt -c constraints-release.txt
              python -m pip install pytest==9.1.1 ruff==0.16.3 -c constraints-release.txt
              python -m compileall -q catalog scripts
              python -m pytest -q \
                catalog/federation/tests/test_control_plane_replication.py \
                catalog/federation/tests/test_control_plane_replication_adversarial.py \
                catalog/federation/tests/test_control_plane_secure_transport.py \
                catalog/federation/tests/test_control_plane_physical_runtime.py \
                catalog/federation/tests/test_human_auth_event_policy.py \
                catalog/federation/tests/test_session_leadership.py \
                catalog/federation/tests/cf7_acceptance/test_v1_physical_runtime_binding.py \
                catalog/federation/tests/cf7_acceptance/test_b01_b09_physical_contract.py
              python -m ruff check \
                catalog/federation/control_plane_credentials.py \
                catalog/federation/control_plane_facade.py \
                catalog/federation/control_plane_materialized.py \
                catalog/federation/control_plane_product.py \
                catalog/federation/control_plane_readiness.py \
                catalog/federation/control_plane_replication.py \
                catalog/federation/control_plane_runtime.py \
                catalog/federation/control_plane_transport.py \
                catalog/federation/event_log.py \
                catalog/federation/human_auth.py \
                catalog/flask_app/auth/extension.py \
                catalog/flask_app/auth/federation_failover.py \
                catalog/relay/replicated_provider_service.py \
                scripts/acceptance/b01_b09_physical_contract.py \
                scripts/acceptance/v1_physical_campaign.py \
                scripts/acceptance/v1_physical_campaign_strict.py \
                scripts/acceptance/v1_physical_probes.py \
                scripts/acceptance/v1_physical_runner.py \
                scripts/acceptance/v1_physical_runtime_binding.py \
                catalog/federation/tests/test_control_plane_physical_runtime.py
              git diff --check origin/main...HEAD
            '

      - name: Validate Compose product wiring
        shell: bash
        run: docker compose config --quiet

      - name: Return workspace ownership to runner
        if: always()
        shell: bash
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/workspace" python:3.12.13-bookworm \
            chown -R "$(id -u):$(id -g)" /workspace

      - name: Repository remains clean
        shell: bash
        run: test -z "$(git status --porcelain)"

  windows-c03:
    name: Acceptance and C03 qualification (Windows)
    runs-on: fcp-windows
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use qualified Windows Python
        shell: cmd
        run: |
          if not exist "C:\actions-runner\toolchains\python-3.12.10\python.exe" exit /b 1
          echo C:\actions-runner\toolchains\python-3.12.10>>"%GITHUB_PATH%"
          echo C:\actions-runner\toolchains\python-3.12.10\Scripts>>"%GITHUB_PATH%"

      - name: Install release dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements.txt -c constraints-release.txt
          python -m pip install pytest==9.1.1 ruff==0.16.3 -c constraints-release.txt

      - name: Compile changed Python packages
        shell: cmd
        run: python -m compileall -q catalog scripts

      - name: Run Windows-relevant C03 and acceptance tests
        shell: cmd
        run: >-
          python -m pytest -q
          catalog/federation/tests/test_control_plane_replication.py
          catalog/federation/tests/test_control_plane_replication_adversarial.py
          catalog/federation/tests/test_control_plane_secure_transport.py
          catalog/federation/tests/test_control_plane_physical_runtime.py
          catalog/federation/tests/cf7_acceptance/test_v1_physical_runtime_binding.py
          catalog/federation/tests/cf7_acceptance/test_b01_b09_physical_contract.py

      - name: Diff hygiene
        shell: cmd
        run: git diff --check origin/main...HEAD

      - name: Repository remains clean
        shell: cmd
        run: git status --porcelain