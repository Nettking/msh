name: Fix F4.1 lazy import boundary

on:
  push:
    branches:
      - agent/phase-f41-live-former-primary-catchup
    paths:
      - ".github/workflows/f41-lazy-import.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-f41-live-former-primary-catchup
          fetch-depth: 0
      - name: Defer recovery import until request dispatch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('catalog/federation/phase_d_service.py')
          text = path.read_text()
          text = text.replace(
              'from .live_catchup import dispatch_live_catchup_request\n',
              '',
              1,
          )
          old = '''        try:\n            catchup = dispatch_live_catchup_request(self, envelope)\n'''
          new = '''        try:\n            from .live_catchup import dispatch_live_catchup_request\n\n            catchup = dispatch_live_catchup_request(self, envelope)\n'''
          if old not in text:
              raise SystemExit('dispatch anchor missing')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/federation/phase_d_service.py
          git commit -m "Defer F4.1 recovery import until dispatch"
          git push origin HEAD:agent/phase-f41-live-former-primary-catchup
