name: One-time F8.1 test-order repair

on:
  push:
    branches:
      - agent/phase-f81-provider-enrollment
    paths:
      - ".github/workflows/f81-fix-test-order.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-f81-provider-enrollment
          fetch-depth: 0
      - name: Replace nondeterministic assertion and remove this workflow
        shell: python
        run: |
          from pathlib import Path

          path = Path("catalog/capabilities/tests/test_provider_enrollment.py")
          text = path.read_text(encoding="utf-8")
          old = '''    assert [record.capability_id for record in eligible] == [
              "language-owner",
              "language-provider",
          ]
          '''
          new = '''    assert {record.capability_id for record in eligible} == {
              "language-owner",
              "language-provider",
          }
          ordering = [
              (record.capability_type, record.node_id, record.capability_id)
              for record in eligible
          ]
          assert ordering == sorted(ordering)
          '''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one enrollment ordering assertion")
          path.write_text(text.replace(old, new), encoding="utf-8")
          Path(".github/workflows/f81-fix-test-order.yml").unlink()
      - name: Commit exact repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix deterministic enrollment ordering test"
          git push origin HEAD:agent/phase-f81-provider-enrollment
