name: Install Phase E completion payload

on:
  push:
    branches:
      - agent/complete-phase-e-recovery
    paths:
      - ".phase-e-bootstrap/**"
      - ".github/workflows/phase-e-bootstrap.yml"
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]
    paths:
      - ".phase-e-bootstrap/**"
      - ".github/workflows/phase-e-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: phase-e-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify and extract payload
        shell: bash
        run: |
          set -euo pipefail
          cat .phase-e-bootstrap/chunk-* | base64 --decode > /tmp/phase-e-payload.tar.gz
          echo "f775b2dc3771ac464af2b21ce76fb41aca9964d9e50e1fb598586e6618d20f89  /tmp/phase-e-payload.tar.gz" | sha256sum --check -
          python - <<'PY'
          import tarfile
          from pathlib import Path

          archive = Path('/tmp/phase-e-payload.tar.gz')
          with tarfile.open(archive, 'r:gz') as payload:
              for member in payload.getmembers():
                  path = Path(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive path: {member.name}')
              payload.extractall('.')
          PY
      - name: Mark recovery plan implemented
        shell: python
        run: |
          from pathlib import Path

          path = Path('docs/implementation/phase_e7_recovery_plan.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'Status: **prepared; implementation not started**',
              'Status: **implemented; pending final CI and merge validation**',
              1,
          )
          marker = '## Implementation completion\n'
          if marker not in text:
              text += '''\n\n## Implementation completion\n\nE7.2-E7.6 are implemented by `former_primary_repair.py` and\n`former_primary_completion.py`. The implementation reuses the existing\n`storage-replication` relay path, verifies source and target immutable identity,\nreconciles lost responses, persists retry/conflict/completion evidence, requires a\nnew authenticated synchronized report, and exposes E8 operator diagnostics.\n\nThe checkpoint is accepted only after Linux and Windows CI are green and the\ncompletion PR is merged to `main`. Phase F direct transport and Phase G scheduling\nremain excluded.\n'''
          path.write_text(text, encoding='utf-8')
      - name: Commit generated implementation
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/phase2-federation.yml
          git rm -r .phase-e-bootstrap
          git add \
            catalog/federation/former_primary_repair.py \
            catalog/federation/former_primary_completion.py \
            catalog/federation/tests/test_phase_e72_former_primary_transfer.py \
            catalog/federation/tests/test_phase_e78_former_primary_completion.py \
            docs/implementation/phase_e_progress.md \
            docs/implementation/phase_e7_recovery_plan.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete Phase E former-primary recovery"
          git push origin HEAD:agent/complete-phase-e-recovery
