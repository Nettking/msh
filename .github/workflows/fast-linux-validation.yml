name: Fast Linux validation

# Nitro is a 2-CPU box on a rotating disk: a full suite there costs one to two
# hours and its wall-clock behaviour is its own variable. Beast-Linux and
# Nettking-Linux exist to give a release answer in minutes instead, so this
# workflow puts the release-relevant Linux work on them and keeps Nitro for what
# it is now good for, slow-host stress.
#
# It validates one exact SHA, asserted in every job. It changes no product code,
# no test, no timeout and no Federation state, and it does not touch the runners.

on:
  push:
    branches:
      - ci/fast-linux-validation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ba8a3b0b828f59c36c5aaaf6130480a2432a5578
  MAIN_SHA: 6101c86d94294c70db47d1a8053cac93b9a41356
  IMAGE: python:3.12.13-bookworm

jobs:
  smoke-beast:
    name: "Smoke: Beast-Linux"
    runs-on: beast-linux
    timeout-minutes: 20
    steps:
      - name: Runner and container identity
        shell: bash
        run: |
          set -euo pipefail
          echo "runner name : ${RUNNER_NAME:-unknown}"
          echo "host        : $(hostname)"
          echo "user        : $(id -un) ($(id -u))"
          echo "cpus        : $(nproc)"
          free -h | sed -n '1,2p'
          df -h / | tail -1
          lsblk -d -o NAME,ROTA,SIZE 2>/dev/null | sed 's/^/  /' || true
          docker version --format '  docker client {{.Client.Version}} server {{.Server.Version}}'
          docker run --rm "${IMAGE}" python -c "import sys; print('  container python', sys.version.split()[0])"

  smoke-nettking-linux:
    name: "Smoke: Nettking-Linux"
    runs-on: nettking-linux
    timeout-minutes: 20
    steps:
      - name: Runner and container identity
        shell: bash
        run: |
          set -euo pipefail
          echo "runner name : ${RUNNER_NAME:-unknown}"
          echo "host        : $(hostname)"
          echo "user        : $(id -un) ($(id -u))"
          echo "cpus        : $(nproc)"
          free -h | sed -n '1,2p'
          df -h / | tail -1
          lsblk -d -o NAME,ROTA,SIZE 2>/dev/null | sed 's/^/  /' || true
          docker version --format '  docker client {{.Client.Version}} server {{.Server.Version}}'
          docker run --rm "${IMAGE}" python -c "import sys; print('  container python', sys.version.split()[0])"

  targeted-beast:
    name: "Beast-Linux: the five Nitro failures, 20 repeats"
    runs-on: beast-linux
    needs: smoke-beast
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ba8a3b0b828f59c36c5aaaf6130480a2432a5578
      - name: Verify exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          echo "HEAD verified: ${CANDIDATE_SHA}"
      - name: Storage precondition
        shell: bash
        run: python3 scripts/ci_release_disk_preflight.py "${GITHUB_WORKSPACE}" /tmp
      - name: Repeat the five tests that failed on Nitro
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -e PYTHONPYCACHEPREFIX=/tmp/pycache \
            -w /workspace "${IMAGE}" bash -lc '
              set -euo pipefail
              python --version
              python -m pip install --quiet --upgrade pip==26.2.1
              python -m pip install --quiet -r requirements.txt -c constraints-release.txt
              python -m pip install --quiet pytest==9.1.1 -c constraints-release.txt
              set +e
              fails=0
              for i in $(seq 1 20); do
                out=$(python -m pytest -o addopts= -o cache_dir=/tmp/pytest_cache -p no:randomly -q \
                  catalog/mtconnect_recorder/tests/test_source_availability_retry.py \
                  catalog/relay/tests/test_phase2_integration.py::test_f2_006_revocation_rejects_traffic_and_reconnect_but_peer_survives \
                  catalog/flask_app/tests/test_federation_pairing_relay.py \
                  catalog/node/tests/test_live_storage_catchup.py 2>&1 | tail -1)
                rc=$?
                [ $rc -ne 0 ] && fails=$((fails+1))
                echo "repeat $i rc=$rc :: $out"
              done
              echo "TARGETED_REPEATS: $fails of 20 failed"
              exit $fails
            '

  full-beast:
    name: "Beast-Linux: full candidate suite"
    runs-on: beast-linux
    needs: targeted-beast
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ba8a3b0b828f59c36c5aaaf6130480a2432a5578
      - name: Verify exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          echo "HEAD verified: ${CANDIDATE_SHA}"
      - name: Storage precondition
        shell: bash
        run: python3 scripts/ci_release_disk_preflight.py "${GITHUB_WORKSPACE}" /tmp
      - name: Full suite, default order
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -e PYTHONPYCACHEPREFIX=/tmp/pycache \
            -w /workspace "${IMAGE}" bash -lc '
              set -euo pipefail
              python --version
              python -m pip install --quiet --upgrade pip==26.2.1
              python -m pip install --quiet -r requirements.txt -c constraints-release.txt
              python -m pip install --quiet pytest==9.1.1 -c constraints-release.txt
              python -m pytest -o addopts= -o cache_dir=/tmp/pytest_cache -p no:randomly -v --durations=50
            '
      - name: Return workspace ownership to the runner account
        if: always()
        shell: bash
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/ws" "${IMAGE}" \
            chown -R "$(id -u):$(id -g)" /ws
      - name: Repository stays clean after the suite
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree modified by the test suite:"; git status --porcelain; exit 1
          fi

  static-nettking:
    name: "Nettking-Linux: release static checks"
    runs-on: nettking-linux
    needs: smoke-nettking-linux
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ba8a3b0b828f59c36c5aaaf6130480a2432a5578
          fetch-depth: 2
      - name: Verify exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          echo "HEAD verified: ${CANDIDATE_SHA}"
      - uses: actions/setup-go@v5
      - name: Storage and host-resource preconditions
        shell: bash
        run: python3 scripts/ci_release_disk_preflight.py "${GITHUB_WORKSPACE}" /tmp
      - name: Compile, manifest, ruff and branding in the release container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -e PYTHONPYCACHEPREFIX=/tmp/pycache \
            -w /workspace "${IMAGE}" bash -lc '
              set -euo pipefail
              python -m pip install --quiet --upgrade pip==26.2.1
              python -m pip install --quiet -r requirements.txt -c constraints-release.txt
              python -m pip install --quiet ruff==0.16.3 -c constraints-release.txt
              python -m compileall -q catalog
              python -c "import json, pathlib; m = json.loads(pathlib.Path(\"catalog/federation/tests/cf7_acceptance/scenarios.json\").read_text(encoding=\"utf-8\")); req = {\"federation_v1_end_to_end_accepted\", \"capability_first_onboarding_end_to_end_accepted\", \"automated_product_acceptance_executable\", \"physical_evidence_accepted\", \"executable_now\", \"blocked_by_cfi\", \"manual_physical_verification\"}; assert req <= m.keys(); assert m[\"automated_product_acceptance_executable\"] is True; assert m[\"executable_now\"]; assert m[\"manual_physical_verification\"]"
              python -m ruff check catalog/capabilities catalog/ai/remote_provider.py catalog/common/data_loading.py catalog/flask_app/app.py catalog/flask_app/capability_startup_transition_routes.py catalog/flask_app/data_upload_routes.py catalog/flask_app/docs_routes.py catalog/flask_app/provider_federation_routes.py catalog/flask_app/services/capability_contribution_components.py catalog/flask_app/services/data_upload_service.py catalog/flask_app/services/device_state_reset.py catalog/flask_app/services/existing_setup_resume.py catalog/flask_app/services/federation_pairing_install.py catalog/flask_app/services/local_capability_candidates.py catalog/flask_app/services/resilient_pairing_runtime.py catalog/flask_app/services/run_once_capability_evidence.py catalog/flask_app/services/upload_analysis_job_service.py catalog/flask_app/tests/test_legacy_startup_retired.py catalog/flask_app/tests/test_ai_explainer_candidate_visibility.py catalog/flask_app/tests/test_capability_runtime_startup.py catalog/flask_app/tests/test_capability_startup_transition_route.py catalog/flask_app/tests/test_data_upload.py catalog/flask_app/tests/test_device_state_reset.py catalog/flask_app/tests/test_docs_viewer.py catalog/flask_app/tests/test_existing_setup_resume.py catalog/flask_app/tests/test_federation_auto_reconnect.py catalog/flask_app/tests/test_local_capability_candidates.py catalog/flask_app/tests/test_provider_federation_surface.py catalog/flask_app/tests/test_release_reproducibility.py catalog/flask_app/tests/test_run_once_capability_evidence.py catalog/flask_app/tests/test_upload_analysis_jobs.py catalog/flask_app/tests/test_windows_start_script.py catalog/flask_app/tests/test_windows_update_script.py catalog/flask_app/tests/test_windows_volume_name_selection.py catalog/federation/projections/benchmark_adapter.py catalog/federation/projections/onboarding_adapter.py catalog/federation/projections/storage_job_adapters.py catalog/federation/tests/cf7_acceptance/physical_evidence.py catalog/federation/tests/cf7_acceptance/test_physical_evidence.py catalog/federation/tests/cf7_acceptance/test_product_acceptance.py catalog/federation/tests/test_benchmark_latest_projection.py catalog/federation/tests/test_onboarding_projection_policy.py catalog/federation/tests/test_release_documentation_links.py catalog/relay/tests/test_phase_f83_remote_ai_binding.py catalog/relay/tests/test_phase_f84_compute_worker_activation.py --ignore I001,RUF022,B008,C408,PLC0206,UP035
              python scripts/check_product_branding.py
            '
      - name: Go direct peer sidecar tests
        shell: bash
        working-directory: cmd/fcp-peer-sidecar
        run: |
          go mod tidy
          go test ./...
      - name: Validate Compose configuration
        shell: bash
        run: docker compose config --quiet
      - name: Diff hygiene
        shell: bash
        run: git diff --check HEAD^ HEAD
      - name: Return workspace ownership to the runner account
        if: always()
        shell: bash
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/ws" "${IMAGE}" \
            chown -R "$(id -u):$(id -g)" /ws

  targeted-nettking:
    name: "Nettking-Linux: independent targeted control, 20 repeats"
    runs-on: nettking-linux
    needs: static-nettking
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ba8a3b0b828f59c36c5aaaf6130480a2432a5578
      - name: Verify exact candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          echo "HEAD verified: ${CANDIDATE_SHA}"
      - name: Repeat the five tests that failed on Nitro
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -e PYTHONPYCACHEPREFIX=/tmp/pycache \
            -w /workspace "${IMAGE}" bash -lc '
              set -euo pipefail
              python -m pip install --quiet --upgrade pip==26.2.1
              python -m pip install --quiet -r requirements.txt -c constraints-release.txt
              python -m pip install --quiet pytest==9.1.1 -c constraints-release.txt
              set +e
              fails=0
              for i in $(seq 1 20); do
                out=$(python -m pytest -o addopts= -o cache_dir=/tmp/pytest_cache -p no:randomly -q \
                  catalog/mtconnect_recorder/tests/test_source_availability_retry.py \
                  catalog/relay/tests/test_phase2_integration.py::test_f2_006_revocation_rejects_traffic_and_reconnect_but_peer_survives \
                  catalog/flask_app/tests/test_federation_pairing_relay.py \
                  catalog/node/tests/test_live_storage_catchup.py 2>&1 | tail -1)
                rc=$?
                [ $rc -ne 0 ] && fails=$((fails+1))
                echo "repeat $i rc=$rc :: $out"
              done
              echo "TARGETED_REPEATS: $fails of 20 failed"
              exit $fails
            '
