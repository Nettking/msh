          fi

  release-verdict:
    name: Federation v1 automated release verdict
    if: always()
    needs: [release-linux, release-windows, postgres-storage, suite-order-independence]
    runs-on: fcp-linux
    steps:
      - name: Require every automated release job
        shell: bash
        run: |
          test "${{ needs.release-linux.result }}" = "success"
          test "${{ needs.release-windows.result }}" = "success"
          test "${{ needs.postgres-storage.result }}" = "success"
          test "${{ needs.suite-order-independence.result }}" = "success"
