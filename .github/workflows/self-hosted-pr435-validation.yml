  postgres-storage:
    name: PostgreSQL storage release check
    runs-on: fcp-linux
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fcp
          POSTGRES_PASSWORD: fcp
          POSTGRES_DB: fcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fcp -d fcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FCP_TEST_POSTGRES_DSN: postgresql://fcp:fcp@127.0.0.1:5432/fcp_test
    steps:
      # actions/checkout deletes the workspace contents as the unprivileged
      # runner account. A containerised suite from an earlier run leaves
      # root-owned files behind, and checkout then fails outright with
      #   EACCES: permission denied, unlink '.../.pytest_cache/.gitignore'
      # (run 33956840831, PostgreSQL job; run 33958636444, Linux job). Returning
      # ownership before checkout makes the job recoverable no matter what the
      # previous run left. It changes ownership only, deletes nothing, and needs
      # no sudo.
      - name: Repair workspace ownership before checkout
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            python:3.12.13-bookworm \
            chown -R "$(id -u):$(id -g)" /workspace

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VALIDATED_SHA }}
      - name: Verify exact candidate SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${VALIDATED_SHA}"
      - name: Self-hosted Linux storage precondition
        shell: bash
        run: |
          set -euo pipefail
          df -h "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}"
          df -i "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}"
          python3 scripts/ci_release_disk_preflight.py "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}"
          # ci_release_disk_preflight.py asserts the host-resource admission
          # floor only. The storage fixtures are also bounded by the allocation
          # floor in catalog/federation/storage_allocation.py, which is derived
          # from the volume -- max(10 GiB, 5% of it), capped at 64 GiB -- and on
          # a large disk is far above the admission floor. A runner can pass the
          # preflight and still refuse every commit with allocation-exhausted,
          # so assert that bound too, with the product's own unchanged policy.
          # The modules are loaded from source by path, exactly as the preflight
          # does, because the bare runner has no product dependencies installed.
          python3 - "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}" <<'PY'
          import importlib.util
          import shutil
          import sys
          from pathlib import Path

          GIB = 1024 ** 3
          federation = Path("catalog/federation").resolve()

          def load(name, filename):
              spec = importlib.util.spec_from_file_location(name, federation / filename)
              module = importlib.util.module_from_spec(spec)
              sys.modules[name] = module
              spec.loader.exec_module(module)
              return module

          load("catalog.federation.errors", "errors.py")
          allocation = load("_fcp_storage_allocation", "storage_allocation.py")

          print("Product storage allocation floor (the product's own policy):")
          short = []
          for target in sys.argv[1:]:
              usage = shutil.disk_usage(target)
              floor = allocation.default_floor_bytes(target)
              print(f"  {target}")
              print(
                  f"    volume           : {usage.free / GIB:.2f} GiB free of "
                  f"{usage.total / GIB:.2f} GiB"
              )
              print(f"    allocation floor : {floor / GIB:.2f} GiB")
              print(f"    free minus floor : {(usage.free - floor) / GIB:+.2f} GiB")
              if usage.free <= floor:
                  short.append((target, usage.free, floor))

          if short:
              print(
                  "\nINFRASTRUCTURE PRECONDITION FAILED: this runner does not hold "
                  "the free space the product requires before it will commit a "
                  "storage batch.",
                  file=sys.stderr,
              )
              for target, free, floor in short:
                  print(
                      f"  - {target}: {free / GIB:.2f} GiB free, floor "
                      f"{floor / GIB:.2f} GiB, short by {(floor - free) / GIB:.2f} GiB",
                      file=sys.stderr,
                  )
              print(
                  "\nFree the space on the runner. Do not lower the product floor, "
                  "do not configure a CI-only floor, and do not add an admission "
                  "bypass.",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          print("\nRunner meets the product storage allocation precondition.")
          PY
      - name: PostgreSQL storage authority regression with Python 3.12.13
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e FCP_TEST_POSTGRES_DSN="${FCP_TEST_POSTGRES_DSN}" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -e PYTHONPYCACHEPREFIX=/tmp/pycache \
            -w /workspace \
            python:3.12.13-bookworm bash -lc '
              set -euo pipefail
              python --version
              python scripts/ci_release_disk_preflight.py /workspace /tmp
              python -m pip install --upgrade pip==26.2.1
              python -m pip install -r requirements.txt -c constraints-release.txt
              python -m pip install pytest==9.1.1 -c constraints-release.txt
              python -m pytest -o addopts= -o cache_dir=/tmp/pytest_cache -q catalog/federation/tests/test_phase_d2_postgres.py
            '

      # The suite above runs as root inside the container with the workspace
      # bind-mounted, so anything it writes there is root-owned on the host. The
      # unprivileged runner account then cannot clean those files, and the next
      # job's actions/checkout fails with
      #   EACCES: permission denied, unlink '.../.pytest_cache/.gitignore'
      # PYTHONPYCACHEPREFIX and cache_dir keep the common offenders out of the
      # mount; this returns anything else the container left behind. It needs no
      # sudo, deletes nothing, and runs even when the suite failed.
      - name: Return workspace ownership to the runner account
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            python:3.12.13-bookworm \
            chown -R "$(id -u):$(id -g)" /workspace

  suite-order-independence:
    name: Clean-checkout suite order independence
    runs-on: fcp-linux
    # Two full shuffled suites at Nitro's measured ~52 minutes each, plus the
    # dependency install. The previous 30-minute budget cancelled this job at
    # 49% of the first suite (run 33956840831).
