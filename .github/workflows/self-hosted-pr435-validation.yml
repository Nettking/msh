      - name: Validate Compose configuration
        shell: cmd
        run: docker compose config --quiet

      - name: Diff hygiene
        shell: cmd
        run: git diff --check HEAD^ HEAD

  postgres-storage:
    name: PostgreSQL storage release check
    runs-on: fcp-linux
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fcp
          POSTGRES_PASSWORD: fcp
          POSTGRES_DB: fcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fcp -d fcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FCP_TEST_POSTGRES_DSN: postgresql://fcp:fcp@127.0.0.1:5432/fcp_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VALIDATED_SHA }}
      - name: Verify exact candidate SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${VALIDATED_SHA}"
      - name: Self-hosted Linux storage precondition
        shell: bash
        run: |
          set -euo pipefail
          df -h "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}"
          df -i "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}"
          python3 scripts/ci_release_disk_preflight.py "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}"
      - name: PostgreSQL storage authority regression with Python 3.12.13
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -e FCP_TEST_POSTGRES_DSN="${FCP_TEST_POSTGRES_DSN}" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            python:3.12.13-bookworm bash -lc '
              set -euo pipefail
              python --version
              python scripts/ci_release_disk_preflight.py /workspace /tmp
              python -m pip install --upgrade pip==26.2.1
              python -m pip install -r requirements.txt -c constraints-release.txt
              python -m pip install pytest==9.1.1 -c constraints-release.txt
              python -m pytest -o addopts= -q catalog/federation/tests/test_phase_d2_postgres.py
            '

  suite-order-independence:
    name: Clean-checkout suite order independence
    runs-on: fcp-linux
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VALIDATED_SHA }}
      - name: Verify exact candidate SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${VALIDATED_SHA}"
      - name: Self-hosted Linux storage precondition
        shell: bash
        run: |
          set -euo pipefail
          df -h "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}"
          df -i "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}"
          python3 scripts/ci_release_disk_preflight.py "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}"
      - name: Full suite twice under Python 3.12.13
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            python:3.12.13-bookworm bash -lc '
              set -euo pipefail
              python --version
              python scripts/ci_release_disk_preflight.py /workspace /tmp
              python -m pip install --upgrade pip==26.2.1
              python -m pip install -r requirements.txt -c constraints-release.txt
              python -m pip install pytest==9.1.1 pytest-randomly==4.1.0 -c constraints-release.txt
              python -m pytest -o addopts= -q -p randomly --randomly-seed=20260813
              python -m pytest -o addopts= -q -p randomly --randomly-seed=${{ github.run_number }}
            '
      - name: Repository stays clean after the suite
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree modified by the test suite:"
            git status --porcelain
            exit 1
          fi

  release-verdict:
    name: Federation v1 automated release verdict
    if: always()
    needs: [release-linux, release-windows, postgres-storage, suite-order-independence]
    runs-on: fcp-linux
    steps:
      - name: Require every automated release job
        shell: bash
        run: |
          test "${{ needs.release-linux.result }}" = "success"
          test "${{ needs.release-windows.result }}" = "success"
          test "${{ needs.postgres-storage.result }}" = "success"
          test "${{ needs.suite-order-independence.result }}" = "success"
