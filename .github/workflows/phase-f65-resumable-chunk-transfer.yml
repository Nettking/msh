name: Phase F6.5 durable resumable chunk transfer

on:
  pull_request:
    paths:
      - "catalog/federation/resumable_chunk_transfer.py"
      - "catalog/node/tests/test_phase_f65_resumable_chunk_transfer.py"
      - "docs/implementation/phase_f65_resumable_chunk_transfer.md"
      - ".github/workflows/phase-f65-resumable-chunk-transfer.yml"
  push:
    branches: [main]
    paths:
      - "catalog/federation/resumable_chunk_transfer.py"
      - "catalog/node/tests/test_phase_f65_resumable_chunk_transfer.py"
      - "docs/implementation/phase_f65_resumable_chunk_transfer.md"
      - ".github/workflows/phase-f65-resumable-chunk-transfer.yml"

permissions:
  contents: read

concurrency:
  group: f65-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  durable-resume:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest ruff
      - name: Compile F6.5
        run: >-
          python -m compileall
          catalog/federation/object_transfer.py
          catalog/federation/object_transfer_staging.py
          catalog/federation/verified_chunk_transfer.py
          catalog/federation/resumable_chunk_transfer.py
          catalog/node/tests/test_phase_f65_resumable_chunk_transfer.py
      - name: F6.4 and F6.5 tests
        run: >-
          python -m pytest -o addopts= -q
          catalog/federation/tests/test_phase_f641_chunk_contract.py
          catalog/node/tests/test_phase_f642_verified_chunk_transfer.py
          catalog/node/tests/test_phase_f65_resumable_chunk_transfer.py
      - name: Ruff F6.5
        run: >-
          python -m ruff check
          catalog/federation/resumable_chunk_transfer.py
          catalog/node/tests/test_phase_f65_resumable_chunk_transfer.py
          --ignore I001,RUF022,B008,C408,PLC0206
