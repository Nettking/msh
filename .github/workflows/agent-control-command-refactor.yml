name: Temporary federation control-command refactor

on:
  push:
    branches:
      - agent/federation-control-command-primitives

permissions:
  contents: write

jobs:
  refactor-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply asserted source transformation
        run: python .github/scripts/apply_control_command_refactor.py
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest ruff
      - name: Format, compile, and lint touched Python
        run: |
          python -m ruff format catalog/federation/control_commands.py catalog/federation/tests/test_control_commands.py catalog/flask_app/services/federation_update_events.py catalog/flask_app/services/federation_capability_requests.py catalog/flask_app/tests/test_federation_control_command_compatibility.py
          python -m compileall -q catalog/federation/control_commands.py catalog/federation/tests/test_control_commands.py catalog/flask_app/services/federation_update_events.py catalog/flask_app/services/federation_capability_requests.py catalog/flask_app/tests/test_federation_control_command_compatibility.py
          python -m ruff check --ignore TRY004 catalog/federation/control_commands.py catalog/federation/tests/test_control_commands.py catalog/flask_app/services/federation_update_events.py catalog/flask_app/services/federation_capability_requests.py catalog/flask_app/tests/test_federation_control_command_compatibility.py
      - name: Run focused control-plane regressions
        run: python -m pytest -o addopts= -q catalog/federation/tests/test_control_commands.py catalog/flask_app/tests/test_federation_control_command_compatibility.py catalog/flask_app/tests/test_federation_capability_requests.py catalog/flask_app/tests/test_federation_update_runtime.py catalog/flask_app/tests/test_federation_update_orchestration.py catalog/flask_app/tests/test_federation_active_leader_runtime.py
      - name: Commit only validated product changes
        run: |
          git config user.name "OpenAI refactor agent"
          git config user.email "noreply@openai.com"
          git add catalog/federation/control_commands.py catalog/federation/tests/test_control_commands.py catalog/flask_app/services/federation_update_events.py catalog/flask_app/services/federation_capability_requests.py catalog/flask_app/tests/test_federation_control_command_compatibility.py
          git diff --cached --check
          git commit -m "Share Federation control-command primitives"
          git push origin HEAD:agent/federation-control-command-primitives
