name: CF3 onboarding discovery

on:
  push:
    branches: ['**']
    paths:
      - "catalog/federation/onboarding_discovery/**"
      - "catalog/federation/tests/test_onboarding_discovery_*.py"
      - ".github/workflows/cf3-onboarding-discovery.yml"
permissions:
  contents: read

concurrency:
  group: cf3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discovery:
    if: github.repository_id == '1033058161'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: [self-hosted, Linux, X64, fcp-linux-fast]
            shell: bash
          - os: Windows
            runner: [self-hosted, Windows, X64, fcp-windows]
            shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/self-hosted-python
        with:
          python-version: "3.12"
      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest==9.1.1 ruff==0.16.3
      - name: Compile CF3 boundary
        run: >-
          python -m compileall
          catalog/federation/onboarding_discovery
          catalog/federation/tests/test_onboarding_discovery_service.py
      - name: Ubuntu storage precondition
        if: runner.os == 'Linux'
        uses: ./.github/actions/ubuntu-storage-precondition
      - name: Run CF3 focused tests
        run: >-
          python -m pytest -o addopts= -q
          catalog/federation/tests/test_onboarding_discovery_service.py
      - name: Run affected authority regressions
        run: >-
          python -m pytest -o addopts= -q
          catalog/federation/tests/test_phase2_unit.py
      - name: Ruff CF3 boundary
        run: >-
          python -m ruff check
          catalog/federation/onboarding_discovery
          catalog/federation/tests/test_onboarding_discovery_service.py
          --ignore I001,RUF022,B008,C408,PLC0206
      - name: Diff hygiene
        shell: bash
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD
