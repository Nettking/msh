      - name: Go direct peer sidecar tests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace/cmd/fcp-peer-sidecar \
            golang:1.25.7 bash -c 'go version && go mod tidy && go test ./...'
      - name: Diff hygiene
        if: always()
        shell: bash
        run: git diff --check HEAD^ HEAD
      - name: Return workspace ownership to the runner account
        if: always()
        shell: bash
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/ws" "${IMAGE}" \
            chown -R "$(id -u):$(id -g)" /ws
      - name: Exact SHA and repository still clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${VALIDATED_SHA}"
          # `go mod tidy` above is the release gate's own command, and this
          # repository does not commit cmd/fcp-peer-sidecar/go.sum -- it has
          # never been tracked on any branch, while go.mod requires ~90 external
          # modules -- so the gate necessarily generates it. The authoritative
          # release job never observes this because it asserts cleanliness
          # BEFORE its Go step; this job asserts after. That one generated path
          # is therefore named explicitly and everything else still fails, and
          # the offending paths are printed rather than swallowed by test -z.
          dirty="$(git status --porcelain | grep -v '^?? cmd/fcp-peer-sidecar/go\.sum$' || true)"
          if [ -n "${dirty}" ]; then
            echo "Unexpected working tree changes after the static gates:"
            echo "${dirty}"
            exit 1
          fi
          # No tracked file may be modified, under any circumstances.
          if [ -n "$(git diff --name-only)" ]; then
            echo "Tracked files modified by the static gates:"
            git diff --name-only
            exit 1
          fi
          echo "CHECKOUT_AFTER_CLEAN (generated cmd/fcp-peer-sidecar/go.sum permitted)"

  linux-compose:
    name: "Leg E: Nettking-Linux real Docker Compose validation"
    runs-on: nettking-linux
