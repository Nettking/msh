          set -euo pipefail
          # The gate's own check. If the host ever gains the plugin, use it
          # directly; otherwise run the real Compose implementation from the
          # pinned official Docker CLI image, source read-only, no network and
          # no Docker socket. This is never a YAML parse.
          if docker compose version >/dev/null 2>&1; then
            echo "host Compose plugin present"
            docker compose version
            docker compose config --quiet
            echo "COMPOSE_CONFIG_PASS host-plugin"
            exit 0
          fi
          echo "host has no Compose plugin; using the pinned official Docker CLI image"
          docker image inspect "${COMPOSE_CLI_IMAGE}" >/dev/null 2>&1 || docker pull --quiet "${COMPOSE_CLI_IMAGE}"
          docker image inspect --format '{{.Id}} {{.RepoDigests}}' "${COMPOSE_CLI_IMAGE}"
          docker run --rm --network none "${COMPOSE_CLI_IMAGE}" docker compose version
          docker run --rm --network none \
            --mount type=bind,source=${GITHUB_WORKSPACE},target=/workspace,readonly \
            -w /workspace "${COMPOSE_CLI_IMAGE}" docker compose config --quiet
          echo "COMPOSE_CONFIG_PASS pinned-cli-image"
      - name: Exact SHA and repository still clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${VALIDATED_SHA}"
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree modified by the Compose validation:"
            git status --porcelain
            exit 1
          fi
          echo "CHECKOUT_AFTER_CLEAN"

  release-windows:
    name: Release matrix (Windows)
    runs-on: fcp-windows
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VALIDATED_SHA }}
          fetch-depth: 0

      - name: Use Nettking Python 3.12.10
        shell: cmd
        run: |
          if not exist "C:\actions-runner\toolchains\python-3.12.10\python.exe" exit /b 1
          echo C:\actions-runner\toolchains\python-3.12.10>>"%GITHUB_PATH%"
          echo C:\actions-runner\toolchains\python-3.12.10\Scripts>>"%GITHUB_PATH%"

      - name: Verify exact candidate SHA and Python
        shell: cmd
        run: |
          for /f "delims=" %%i in ('git rev-parse HEAD') do set ACTUAL=%%i
          if not "%ACTUAL%"=="%VALIDATED_SHA%" exit /b 1
          python --version
          python -c "import sys; assert sys.version_info[:3] == (3,12,10), sys.version"
          python -m pip --version

      - uses: actions/setup-go@v5
        with:
          go-version-file: "cmd/fcp-peer-sidecar/go.mod"
