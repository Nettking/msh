  linux-static:
    name: "Leg D: Nettking-Linux release and static gates"
    runs-on: nettking-linux
    needs: linux-shuffled-15
    timeout-minutes: 90
    steps:
      - name: Repair workspace ownership before checkout
        shell: bash
        run: |
          docker run --rm -v "${{ github.workspace }}:/ws" \
