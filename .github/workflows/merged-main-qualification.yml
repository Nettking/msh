name: Merged main qualification

# Authoritative post-merge software qualification of the exact merged-main
# identity 1004b274, the merge of PR437 into main. Its tree is byte-identical
# to the reviewed PR head 9281d581, and its first parent 3fe0d95f descends from
# the previously qualified merged main bcf5c9ab, but neither of those PASS
# verdicts transfers: a qualification is bound to the commit identity it names,
# so 1004b274 is validated here in its own right.
#
# GitHub-hosted checks on this SHA are all red under CI001 (account-level
# Actions billing), terminating in one to two seconds with no runner assigned
# and no steps executed. That is why the answer is produced on the self-hosted
# hosts below rather than on hosted runners.
#
# The Linux release answer runs on Nettking-Linux, sequentially, because the
# legs must not compete for the host. Windows reuses the exact gate that
# qualified the candidate on the Nettking Windows runner, and PostgreSQL reuses
# its proven service configuration. Nitro is not on the critical path and is not
# being characterised here.
#
# Every job checks out and asserts this one SHA, and verifies the worktree is
# clean before and after. No product code, test, timeout, threshold, skip or
# Federation state is changed by this workflow.

on:
  push:
    branches:
      - claude/pr-435-final-merge-k01mfi
    paths:
      - '.github/workflows/merged-main-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merged-main-qualification
  cancel-in-progress: false

env:
  VALIDATED_SHA: 1004b274c198018161658cd1379d6cb4a20dbc82
  IMAGE: python:3.12.13-bookworm
  # The exact official Docker CLI image Astra used for the candidate's real
  # Compose validation. Nettking-Linux has no Compose plugin installed, and
  # changing runner infrastructure is out of scope, so the gate's own check runs
  # inside this pinned image with the source read-only, no network and no socket.
  COMPOSE_CLI_IMAGE: docker@sha256:eccaacfeed644c7de222ff047483568cb988dde95476fbaaf10ea2d04921bb66

jobs:
  smoke-nettking-linux:
    name: "Nettking-Linux: host and container identity"
    runs-on: nettking-linux
    timeout-minutes: 20
    steps:
      - name: Runner and container identity
        shell: bash
        run: |
          set -euo pipefail
          echo "runner name : ${RUNNER_NAME:-unknown}"
          echo "host        : $(hostname)"
          echo "user        : $(id -un) ($(id -u))"
          echo "cpus        : $(nproc)"
          free -h | sed -n '1,2p'
          df -h / | tail -1
          lsblk -d -o NAME,ROTA,SIZE 2>/dev/null | sed 's/^/  /' || true
          docker version --format '  docker client {{.Client.Version}} server {{.Server.Version}}'
          docker run --rm "${IMAGE}" python -c "import sys; print('  container python', sys.version.split()[0])"

  linux-default-order:
    name: "Leg A: Nettking-Linux full suite, default order"
    runs-on: nettking-linux
    needs: smoke-nettking-linux
    timeout-minutes: 180
    steps:
      - name: Repair workspace ownership before checkout
        shell: bash
        run: |
          docker run --rm -v "${{ github.workspace }}:/ws" \
            python:3.12.13-bookworm chown -R "$(id -u):$(id -g)" /ws || true
      - uses: actions/checkout@v4
        with:
          ref: 1004b274c198018161658cd1379d6cb4a20dbc82
          fetch-depth: 0
      - name: Verify exact merged SHA and initial cleanliness
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${VALIDATED_SHA}"
          test -z "$(git status --porcelain)"
          echo "HEAD verified: ${VALIDATED_SHA}"
          echo "CHECKOUT_BEFORE_CLEAN"
      - name: Host state before the suite
        shell: bash
        run: |
          echo "cpus $(nproc)"; free -h | sed -n '2p'; df -h / | tail -1
      - name: Storage precondition
        shell: bash
        run: python3 scripts/ci_release_disk_preflight.py "${GITHUB_WORKSPACE}" /tmp
      - name: Full suite, default order
        shell: bash
        run: |
          set -euo pipefail
          # Read-only memory sampler. Run 34019865738 leg A was SIGKILLed
          # (exit 137) at 93% with 837 MiB available on a 15 GiB host, and the
          # runner service then went down, so a repeat needs evidence rather
          # than a guess. This only reads /proc via free(1): it changes no
          # product behaviour, no test and no host state, and the trap makes it
          # report on failure as well as success.
          ( while true; do
              echo "$(date -u +%H:%M:%S) $(free -m | awk '/^Mem:/{print $3, $7}')"
              sleep 10
            done ) > "${RUNNER_TEMP}/mem.log" 2>&1 &
          SAMPLER=$!
          trap 'kill ${SAMPLER} 2>/dev/null || true;
                echo "--- lowest available MiB during the suite ---";
                sort -k3 -n "${RUNNER_TEMP}/mem.log" | head -3;
                echo "--- final samples (time used_MiB available_MiB) ---";
                tail -4 "${RUNNER_TEMP}/mem.log"' EXIT
          docker run --rm --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -e PYTHONPYCACHEPREFIX=/tmp/pycache \
            -w /workspace "${IMAGE}" bash -lc '
              set -euo pipefail
              python --version
              python -m pip install --quiet --upgrade pip==26.2.1
              python -m pip install --quiet -r requirements.txt -c constraints-release.txt
              python -m pip install --quiet pytest==9.1.1 -c constraints-release.txt
              python -m pip freeze | sort | sha256sum | sed "s/^/dependency-set sha256 /"
              python -m pytest -o addopts= -o cache_dir=/tmp/pytest_cache -p no:randomly -v --durations=50
            '
      - name: Host state after the suite
        if: always()
        shell: bash
        run: |
          echo "cpus $(nproc)"; free -h | sed -n '2p'; df -h / | tail -1
      - name: Return workspace ownership to the runner account
        if: always()
        shell: bash
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/ws" "${IMAGE}" \
            chown -R "$(id -u):$(id -g)" /ws
      - name: Exact SHA and repository still clean after the suite
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${VALIDATED_SHA}"
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree modified by the test suite:"; git status --porcelain; exit 1
          fi
          echo "CHECKOUT_AFTER_CLEAN"

  linux-default-order-repeat:
    name: "Leg A2: Nettking-Linux full suite, default order repeat"
    # A second default-order pass on its own fresh checkout. Leg A alone
    # cannot distinguish a stable suite from one that happened to pass
    # once, and the previous candidate only got a de facto repeat because
    # its first run was retried. Repeating it here makes the default-order
    # answer reproducible by design rather than by accident.
    runs-on: nettking-linux
    needs: linux-default-order
