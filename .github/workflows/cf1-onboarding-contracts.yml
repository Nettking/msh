name: CF1 onboarding contracts

on:
  pull_request:
    paths:
      - "catalog/federation/onboarding_models.py"
      - "catalog/federation/onboarding_compat.py"
      - "catalog/federation/tests/test_onboarding_contracts.py"
      - ".github/workflows/cf1-onboarding-contracts.yml"
  push:
    branches: [main]
    paths:
      - "catalog/federation/onboarding_models.py"
      - "catalog/federation/onboarding_compat.py"
      - "catalog/federation/tests/test_onboarding_contracts.py"
      - ".github/workflows/cf1-onboarding-contracts.yml"

permissions:
  contents: read

concurrency:
  group: cf1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff
      - name: Compile CF1 boundary
        run: >-
          python -m compileall
          catalog/federation/onboarding_models.py
          catalog/federation/onboarding_compat.py
          catalog/federation/tests/test_onboarding_contracts.py
      - name: Run CF1 contracts and migration tests
        run: >-
          python -m pytest -o addopts= -q
          catalog/federation/tests/test_onboarding_contracts.py
      - name: Ruff CF1 boundary
        run: >-
          python -m ruff check
          catalog/federation/onboarding_models.py
          catalog/federation/onboarding_compat.py
          catalog/federation/tests/test_onboarding_contracts.py
          --ignore I001,RUF022,B008,C408,PLC0206
      - name: Diff hygiene
        shell: bash
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD
