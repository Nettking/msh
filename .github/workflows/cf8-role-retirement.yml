name: CF8 role retirement

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/workflows/cf8-role-retirement.yml"
      - "catalog/command_setup.py"
      - "catalog/orchestrator/capability_startup.py"
      - "catalog/flask_app/**"
      - "catalog/mtconnect_recorder/**"
      - "catalog/federation/onboarding_compat.py"
      - "setup_fcp.py"
  push:
    branches:
      - main
      - "agent/cf8-*"
    paths:
      - ".github/actions/**"
      - ".github/workflows/cf8-role-retirement.yml"
      - "catalog/command_setup.py"
      - "catalog/orchestrator/capability_startup.py"
      - "catalog/flask_app/**"
      - "catalog/mtconnect_recorder/**"
      - "catalog/federation/onboarding_compat.py"
      - "setup_fcp.py"

permissions:
  contents: read
  actions: read # Native job identity for evidence provenance only.

concurrency:
  group: cf8-role-retirement-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  role-retirement:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: fcp-linux-fast
            shell: bash
          - os: Windows
            runner: fcp-windows
            shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/self-hosted-python
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest ruff
      - name: Compile CF8 runtime and migration boundary
        run: >-
          python -m compileall -q
          catalog/command_setup.py
          catalog/orchestrator/capability_startup.py
          catalog/flask_app/app.py
          catalog/flask_app/ai_routes.py
          catalog/flask_app/server_setup_routes.py
          catalog/flask_app/capability_product_routes.py
          catalog/flask_app/capability_startup_transition_routes.py
          catalog/flask_app/services/capability_config_service.py
          catalog/flask_app/services/capability_ai_service.py
          catalog/flask_app/services/capability_config_migration_service.py
          catalog/flask_app/services/legacy_settings_migration.py
          catalog/flask_app/services/capability_startup_transition_service.py
          catalog/flask_app/services/capability_contribution_service.py
          catalog/flask_app/services/capability_inspection_service.py
          catalog/flask_app/services/capability_recovery_adapters.py
          catalog/flask_app/services/recorder_control_service.py
          catalog/flask_app/services/mtconnect_discovery_service.py
          catalog/flask_app/tests/test_cf8_role_retirement.py
      - name: Ubuntu storage precondition
        if: runner.os == 'Linux'
        uses: ./.github/actions/ubuntu-storage-precondition
      - name: Run CF8 anti-regression acceptance
        id: cf8_acceptance
        continue-on-error: true
        run: >-
          python -m pytest -o addopts= -q
          --junitxml=cf8-acceptance.xml
          catalog/flask_app/tests/test_cf8_role_retirement.py
      - name: Upload CF8 acceptance diagnostics
        id: cf8_artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf8-acceptance-${{ github.run_id }}-a${{ github.run_attempt }}-${{ github.job }}-${{ matrix.os }}
          path: cf8-acceptance.xml
          if-no-files-found: error
          retention-days: 90
          overwrite: false
      - name: Record CF8 artifact receipt
        if: always()
        env:
          ARTIFACT_NAME: cf8-acceptance-${{ github.run_id }}-a${{ github.run_attempt }}-${{ github.job }}-${{ matrix.os }}
          ARTIFACT_ID: ${{ steps.cf8_artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.cf8_artifact.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.cf8_artifact.outputs.artifact-url }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          JOB_KEY: ${{ github.job }}
          MATRIX_JSON: ${{ toJSON(matrix) }}
        run: >-
          python -c "import json,os; from pathlib import Path; receipt={'artifact_name':os.environ['ARTIFACT_NAME'],'artifact_id':os.environ.get('ARTIFACT_ID',''),'artifact_digest':os.environ.get('ARTIFACT_DIGEST',''),'artifact_url':os.environ.get('ARTIFACT_URL',''),'source_sha':os.environ['SOURCE_SHA'],'run_id':os.environ['RUN_ID'],'run_attempt':int(os.environ['RUN_ATTEMPT']),'job_key':os.environ['JOB_KEY'],'matrix':json.loads(os.environ['MATRIX_JSON'])}; Path(os.environ['GITHUB_STEP_SUMMARY']).open('a',encoding='utf-8').write('### CF8 acceptance artifact receipt\\n\\n'+json.dumps(receipt,indent=2,sort_keys=True)+'\\n\\n')"
      - name: Enforce CF8 acceptance
        if: steps.cf8_acceptance.outcome != 'success'
        shell: bash
        run: exit 1
      - name: Run affected capability-first tests
        run: >-
          python -m pytest -o addopts= -q
          catalog/flask_app/tests/test_capability_config_migration_service.py
          catalog/flask_app/tests/test_capability_startup_transition_route.py
          catalog/flask_app/tests/test_capability_contribution_route.py
          catalog/flask_app/tests/test_capability_inspection_route.py
          catalog/flask_app/tests/test_mtconnect_discovery_service.py
      - name: Ruff CF8 boundary
        run: >-
          python -m ruff check
          catalog/command_setup.py
          catalog/orchestrator/capability_startup.py
          catalog/flask_app/app.py
          catalog/flask_app/ai_routes.py
          catalog/flask_app/server_setup_routes.py
          catalog/flask_app/capability_product_routes.py
          catalog/flask_app/services/capability_config_service.py
          catalog/flask_app/services/capability_ai_service.py
          catalog/flask_app/services/capability_config_migration_service.py
          catalog/flask_app/services/legacy_settings_migration.py
          catalog/flask_app/services/capability_startup_transition_service.py
          catalog/flask_app/services/capability_contribution_service.py
          catalog/flask_app/services/capability_inspection_service.py
          catalog/flask_app/services/capability_recovery_adapters.py
          catalog/flask_app/services/recorder_control_service.py
          catalog/flask_app/services/mtconnect_discovery_service.py
          catalog/flask_app/tests/test_cf8_role_retirement.py
      - name: Diff hygiene
        shell: bash
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi
