name: Fix F4.1 catch-up store

on:
  push:
    branches:
      - agent/phase-f41-live-former-primary-catchup
    paths:
      - ".github/workflows/f41-fix-store.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-f41-live-former-primary-catchup
          fetch-depth: 0
      - name: Scope durable recovery by manifest
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('catalog/federation/live_catchup.py')
          text = path.read_text()
          start = text.index('                """CREATE TABLE IF NOT EXISTS storage_live_catchups (')
          end = text.index('            )\n\n    def _connect', start)
          replacement = '''                """CREATE TABLE IF NOT EXISTS storage_live_catchups (\n                    recovery_id TEXT PRIMARY KEY,\n                    session_id TEXT NOT NULL,\n                    group_id TEXT NOT NULL,\n                    returning_provider_id TEXT NOT NULL,\n                    manifest_hash TEXT NOT NULL,\n                    state TEXT NOT NULL,\n                    record_json TEXT NOT NULL CHECK(json_valid(record_json)),\n                    updated_at TEXT NOT NULL,\n                    UNIQUE(\n                        session_id, group_id, returning_provider_id, manifest_hash\n                    )\n                )"""\n'''
          text = text[:start] + replacement + text[end:]
          text = text.replace(
              '''                   (recovery_id, session_id, group_id, returning_provider_id,\n                    state, record_json, updated_at)\n                   VALUES (?, ?, ?, ?, ?, ?, ?)\n''',
              '''                   (recovery_id, session_id, group_id, returning_provider_id,\n                    manifest_hash, state, record_json, updated_at)\n                   VALUES (?, ?, ?, ?, ?, ?, ?, ?)\n''',
              1,
          )
          text = text.replace(
              '''                    record.returning_provider_id,\n                    record.state,\n''',
              '''                    record.returning_provider_id,\n                    record.manifest_hash,\n                    record.state,\n''',
              1,
          )
          path.write_text(text)
          PY
          python -m py_compile catalog/federation/live_catchup.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/federation/live_catchup.py
          git commit -m "Scope F4.1 recovery journal by manifest"
          git push origin HEAD:agent/phase-f41-live-former-primary-catchup
