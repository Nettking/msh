name: CF5 UI shell

on:
  push:
    branches: ['**']
    paths:
      - ".github/workflows/cf5-ui-shell.yml"
      - "catalog/flask_app/templates/base.html"
      - "catalog/flask_app/templates/onboarding.html"
      - "catalog/flask_app/templates/federation_overview.html"
      - "catalog/flask_app/templates/federation/**"
      - "catalog/flask_app/static/css/admin-shell.css"
      - "catalog/flask_app/static/css/federation.css"
      - "catalog/flask_app/static/js/admin-rail.js"
      - "catalog/flask_app/static/js/onboarding.js"
      - "catalog/flask_app/tests/test_cf5_ui_shell.py"
      - "catalog/flask_app/tests/test_mobile_layout_contract.py"
      - "catalog/flask_app/tests/test_navigation_information_architecture.py"
      - "catalog/flask_app/tests/fixtures/cf5_*_view_models.json"
permissions:
  contents: read

concurrency:
  group: cf5-ui-shell-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-shell:
    if: github.repository_id == '1033058161'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: [self-hosted, Linux, X64, fcp-linux-fast]
            shell: bash
          - os: Windows
            runner: [self-hosted, Windows, X64, fcp-windows]
            shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/self-hosted-python
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest==9.1.1 ruff==0.16.3
      - name: Compile CF5 UI tests
        run: >-
          python -m compileall
          catalog/flask_app/tests/test_cf5_ui_shell.py
          catalog/flask_app/tests/test_mobile_layout_contract.py
          catalog/flask_app/tests/test_navigation_information_architecture.py
      - name: Ubuntu storage precondition
        if: runner.os == 'Linux'
        uses: ./.github/actions/ubuntu-storage-precondition
      - name: Run CF5 UI shell tests
        run: >-
          python -m pytest -o addopts= -q
          catalog/flask_app/tests/test_cf5_ui_shell.py
          catalog/flask_app/tests/test_mobile_layout_contract.py
          catalog/flask_app/tests/test_navigation_information_architecture.py
      - name: Validate onboarding JavaScript
        run: node --check catalog/flask_app/static/js/onboarding.js
      - name: Parse CF5 fixtures
        run: >-
          python -c "import json, pathlib;
          paths = (
          'catalog/flask_app/tests/fixtures/cf5_onboarding_view_models.json',
          'catalog/flask_app/tests/fixtures/cf5_overview_view_models.json');
          [json.loads(pathlib.Path(path).read_text(encoding='utf-8')) for path in paths]"
      - name: Ruff CF5 UI tests
        run: >-
          python -m ruff check
          catalog/flask_app/tests/test_cf5_ui_shell.py
          catalog/flask_app/tests/test_mobile_layout_contract.py
          catalog/flask_app/tests/test_navigation_information_architecture.py
      - name: Diff hygiene
        shell: bash
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi
