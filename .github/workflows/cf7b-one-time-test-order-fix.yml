name: CF7-B one-time test order fix

on:
  push:
    branches:
      - agent/cf7b-product-physical-acceptance
    paths:
      - .github/workflows/cf7b-one-time-test-order-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cf7b-product-physical-acceptance
          fetch-depth: 0
      - name: Move candidate lookup before expiry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("catalog/federation/tests/cf7_acceptance/test_product_acceptance.py")
          text = path.read_text(encoding="utf-8")
          old = '''    current[0] = NOW + timedelta(minutes=16)
              with restarted.app.app_context():
                  reconciled = {
                      intent.candidate_id: intent
                      for intent in restarted.contributions.reconcile()
                  }
              restarted_ids = _candidate_ids(restarted)
          '''
          new = '''    restarted_ids = _candidate_ids(restarted)
              current[0] = NOW + timedelta(minutes=16)
              with restarted.app.app_context():
                  reconciled = {
                      intent.candidate_id: intent
                      for intent in restarted.contributions.reconcile()
                  }
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected one exact block, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")
          PY
          git rm .github/workflows/cf7b-one-time-test-order-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/federation/tests/cf7_acceptance/test_product_acceptance.py
          git commit -m "Fix CF7-B expiry assertion ordering"
          git push origin HEAD:agent/cf7b-product-physical-acceptance
