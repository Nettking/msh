name: One-shot original Beast bootstrap observation
on:
  push:
    branches: [codex/bootstrap-beast-reproduction]
    paths:
      - .github/workflows/nitro-artifact-smoke.yml
      - scripts/ci_bootstrap_beast_reproduction.py
permissions:
  contents: read
  actions: read
concurrency:
  group: bootstrap-beast-reproduction-11238-once
  cancel-in-progress: false
jobs:
  observe:
    name: Observe original Beast journal stage once
    if: >-
      github.repository == 'Nettking/msh' && github.actor == 'Nettking' &&
      github.triggering_actor == 'Nettking' && github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/bootstrap-beast-reproduction' && github.run_attempt == 1
    runs-on: [self-hosted, beast-windows, fcp-test-windows]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Guard one execution and prepare separate exact-C product checkout
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B scripts/ci_bootstrap_beast_reproduction.py prepare
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: ./.github/actions/self-hosted-python
        with:
          python-version: 3.12.10
      - uses: actions/setup-go@v5
        with:
          go-version-file: cmd/fcp-peer-sidecar/go.mod
          cache: false
      - name: Install release dependencies
        working-directory: ${{ env.FCP_BOOTSTRAP_PRODUCT }}
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements.txt -c constraints-release.txt
          python -m pip install pytest==9.1.1 ruff==0.16.3 -c constraints-release.txt
      - name: Original Windows journal stage with target-only external observation
        env:
          TEMP: C:/fcp-qtmp
          TMP: C:/fcp-qtmp
        run: |
          python -B scripts/ci_bootstrap_beast_reproduction.py run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect research result without qualification
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        run: |
          python -B scripts/ci_bootstrap_beast_reproduction.py collect
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve public research evidence on Nitro
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        uses: ./.github/actions/nitro-artifact
        with:
          operation: upload
          ssh-key: ${{ secrets.NITRO_ARTIFACT_SSH_KEY }}
          host: ${{ vars.NITRO_ARTIFACT_HOST }}
          known-hosts: ${{ vars.NITRO_ARTIFACT_KNOWN_HOSTS }}
          matrix: '{"suite":"journal-artifacts","purpose":"bootstrap-research"}'
          job-status: ${{ job.status }}
          name: diagnostic-bootstrap-beast-journal-artifacts
          path: ${{ env.FCP_BOOTSTRAP_RETAINED }}
