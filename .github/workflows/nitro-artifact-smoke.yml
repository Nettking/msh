name: Recover files from completed ICSE observation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: icse-same-execution-recovery-35749009563
  cancel-in-progress: false
jobs:
  read-original-execution:
    if: >-
      github.repository == 'Nettking/msh' && github.actor == 'Nettking' &&
      github.triggering_actor == 'Nettking' && github.event_name == 'workflow_dispatch' &&
      github.run_attempt == 1 && github.ref == 'refs/heads/codex/icse-read-retained-35749009563'
    runs-on: [self-hosted, Linux, beast-linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Read fixed original files only; never run the demo or observer
        run: timeout 45 /opt/fcp-ci/python/3.12.13/bin/python3.12 -I -B scripts/read_icse_diagnostic_evidence.py
      - name: Preserve sanitized same-execution recovery observation
        if: always()
        uses: ./.github/actions/nitro-artifact
        with:
          operation: upload
          ssh-key: ${{ secrets.NITRO_ARTIFACT_SSH_KEY }}
          host: ${{ vars.NITRO_ARTIFACT_HOST }}
          known-hosts: ${{ vars.NITRO_ARTIFACT_KNOWN_HOSTS }}
          matrix: 'null'
          job-status: ${{ job.status }}
          name: same-execution-recovery-35749009563
          path: ${{ runner.temp }}/icse-recovery-35749009563-${{ github.run_id }}/
