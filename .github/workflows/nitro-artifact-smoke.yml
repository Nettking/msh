name: Nitro post-auth transport diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  beast-windows-transport:
    if: github.repository == 'Nettking/msh' && github.actor == 'Nettking'
    runs-on: [self-hosted, beast-windows]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Observe one restricted archive probe, tiny upload and verified download
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        env:
          ARCHIVE_GITHUB_TOKEN: ${{ github.token }}
          FCP_ARCHIVE_SSH_KEY: ${{ secrets.NITRO_ARTIFACT_SSH_KEY }}
          FCP_ARCHIVE_HOST: ${{ vars.NITRO_ARTIFACT_HOST }}
          FCP_ARCHIVE_KNOWN_HOSTS: ${{ vars.NITRO_ARTIFACT_KNOWN_HOSTS }}
        run: |
          python -B -m scripts.diagnostics.nitro_transport_observer
          exit $LASTEXITCODE
