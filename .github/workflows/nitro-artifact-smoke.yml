name: Diagnose Phase2 catchup delivery
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: catchup-observer-3a908fd1
  cancel-in-progress: false
jobs:
  observe:
    if: github.repository == 'Nettking/msh' && github.actor == 'Nettking' && github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, beast-linux]
    timeout-minutes: 20
    env:
      FCP_CATCHUP_TRACE: ${{ runner.temp }}/catchup-observer-${{ github.run_id }}/trace.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/self-hosted-postgres
      - uses: ./.github/actions/self-hosted-python
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: cmd/fcp-peer-sidecar/go.mod
          cache: false
      - name: Original dependency constraints and diagnostic identity
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest==9.1.1 ruff==0.16.8
          mkdir -p "$(dirname "$FCP_CATCHUP_TRACE")"
          python -m pip freeze > "$(dirname "$FCP_CATCHUP_TRACE")/dependencies.txt"
          git diff 3a908fd1d9503057f3520d8f2dbbf62401a6e6d3 HEAD > "$(dirname "$FCP_CATCHUP_TRACE")/instrumentation.patch"
          sha256sum "$(dirname "$FCP_CATCHUP_TRACE")/instrumentation.patch"
      - name: Build direct peer sidecar
        working-directory: cmd/fcp-peer-sidecar
        run: |
          go mod tidy
          mkdir -p ../../build
          go build -trimpath -o ../../build/fcp-peer-sidecar .
      - uses: ./.github/actions/ubuntu-storage-precondition
      - name: Same failed stage with named first-failure observation
        run: >-
          python -m pytest -o addopts= -vv -x --tb=long -p scripts.ci_catchup_observer
          --junitxml=${{ runner.temp }}/catchup-observer-${{ github.run_id }}/junit.xml
          catalog/federation/tests/test_phase2_unit.py catalog/node/tests catalog/relay/tests
      - name: Preserve partial trace independently of JUnit
        if: always()
        uses: ./.github/actions/nitro-artifact
        with:
          operation: upload
          ssh-key: ${{ secrets.NITRO_ARTIFACT_SSH_KEY }}
          host: ${{ vars.NITRO_ARTIFACT_HOST }}
          known-hosts: ${{ vars.NITRO_ARTIFACT_KNOWN_HOSTS }}
          job-status: ${{ job.status }}
          name: catchup-observer
          path: ${{ runner.temp }}/catchup-observer-${{ github.run_id }}
      - uses: ./.github/actions/self-hosted-postgres
        if: always()
        with:
          operation: stop
