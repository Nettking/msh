name: Inspect original release shard 2 evidence
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: original-release-shard2-106760397484
  cancel-in-progress: false
jobs:
  inspect-original:
    if: github.repository == 'Nettking/msh' && github.actor == 'Nettking' && github.triggering_actor == 'Nettking' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && github.ref == 'refs/heads/codex/release-shard2-original-inspection-106760397484'
    runs-on: [self-hosted, Linux, X64, aqg7ncc-linux-admission]
    timeout-minutes: 5
    steps:
      - name: Inspect original pending inputs before checkout
        env:
          OBSERVATION_GITHUB_TOKEN: ${{ github.token }}
        run: |
          timeout 90 /opt/fcp-ci/python/3.12.13/bin/python3.12 -I -B - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          assert os.environ['RUNNER_NAME'] == 'AQG7NCC-Linux'
          assert os.environ['RUNNER_OS'] == 'Linux'
          assert os.environ['GITHUB_RUN_ATTEMPT'] == '1'
          assert os.environ['GITHUB_REPOSITORY'] == 'Nettking/msh'
          assert os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch'
          base = pathlib.Path('/home/fcp-ci-aqg7ncc/actions-runner/_work')
          control = base / ('fcp-shard2-observer-control-' + os.environ['GITHUB_RUN_ID'])
          control.mkdir(mode=0o700, exist_ok=False)
          def get(path):
              request = urllib.request.Request('https://api.github.com/repos/Nettking/msh' + path, headers={'Authorization':'Bearer ' + os.environ['OBSERVATION_GITHUB_TOKEN'], 'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)
          content = get('/contents/scripts/inspect_original_release_package.py?ref=' + os.environ['GITHUB_SHA'])
          raw = base64.b64decode(content['content'], validate=False)
          assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == content['sha']
          assert len(raw) < 65536
          helper = control / 'inspect_original_release_package.py'
          helper.write_bytes(raw)
          native = control / 'original-job.json'
          native.write_text(json.dumps(get('/actions/jobs/106760397484'), sort_keys=True) + '\n')
          output = base / ('fcp-shard2-audit-' + os.environ['GITHUB_RUN_ID'])
          result = subprocess.run(['/opt/fcp-ci/python/3.12.13/bin/python3.12','-I','-B',str(helper),'--native-job-json',str(native),'--output',str(output)],timeout=45)
          print('A_RESULT=' + json.dumps({'inspection_exit':result.returncode,'audit_output':str(output),'diagnostic_source':os.environ['GITHUB_SHA'],'test_execution':False}))
          raise SystemExit(result.returncode)
          PY
      - name: Check out only the isolated evidence workflow
        if: always()
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preserve original input copies and separate inspection report
        if: always()
        uses: ./.github/actions/nitro-artifact
        with:
          operation: upload
          ssh-key: ${{ secrets.NITRO_ARTIFACT_SSH_KEY }}
          host: ${{ vars.NITRO_ARTIFACT_HOST }}
          known-hosts: ${{ vars.NITRO_ARTIFACT_KNOWN_HOSTS }}
          job-status: ${{ job.status }}
          name: original-shard2-inspection-106760397484
          path: /home/fcp-ci-aqg7ncc/actions-runner/_work/fcp-shard2-audit-${{ github.run_id }}/
