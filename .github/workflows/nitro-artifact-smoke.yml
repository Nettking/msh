name: Preserve original Phase2 catchup failure
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: original-catchup-106491443153
  cancel-in-progress: false
jobs:
  retain-original:
    if: github.repository == 'Nettking/msh' && github.actor == 'Nettking' && github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, beast-linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read the exact failed synthetic test record
        run: /opt/fcp-ci/python/3.12.13/bin/python3.12 -B scripts/ci_retain_catchup_failure.py
      - name: Preserve diagnostic evidence on Nitro
        if: always()
        uses: ./.github/actions/nitro-artifact
        with:
          operation: upload
          ssh-key: ${{ secrets.NITRO_ARTIFACT_SSH_KEY }}
          host: ${{ vars.NITRO_ARTIFACT_HOST }}
          known-hosts: ${{ vars.NITRO_ARTIFACT_KNOWN_HOSTS }}
          job-status: ${{ job.status }}
          name: original-catchup-failure-106491443153
          path: ${{ runner.temp }}/catchup-original-106491443153-${{ github.run_id }}
