name: Read original ICSE worker traceback
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read # Existing archive native job provenance only.
concurrency:
  group: original-icse-stderr-106760391543
  cancel-in-progress: false
jobs:
  read-original:
    if: github.repository == 'Nettking/msh' && github.actor == 'Nettking' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/icse-original-stderr-106760391543'
    runs-on: [self-hosted, Linux, beast-linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Read only the original failed worker log and redact traceback
        run: timeout 20 /opt/fcp-ci/python/3.12.13/bin/python3.12 -I -B scripts/read_original_icse_stderr.py
      - name: Retain sanitized observation on Nitro
        if: always()
        uses: ./.github/actions/nitro-artifact
        with:
          operation: upload
          ssh-key: ${{ secrets.NITRO_ARTIFACT_SSH_KEY }}
          host: ${{ vars.NITRO_ARTIFACT_HOST }}
          known-hosts: ${{ vars.NITRO_ARTIFACT_KNOWN_HOSTS }}
          job-status: ${{ job.status }}
          name: original-icse-stderr-106760391543
          path: ${{ runner.temp }}/icse-original-stderr-106760391543-${{ github.run_id }}
