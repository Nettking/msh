name: Recorder Federation publication

on:
  pull_request:
    paths:
      - ".github/workflows/recorder-federation-publication.yml"
      - "catalog/federation/recorder_delivery.py"
      - "catalog/federation/recorder_publication.py"
      - "catalog/federation/tests/test_recorder_publication.py"
      - "catalog/flask_app/services/federation_pairing_install.py"
      - "catalog/flask_app/services/recorder_federation_publication_install.py"
      - "catalog/flask_app/tests/test_recorder_config_bootstrap.py"
      - "catalog/flask_app/tests/test_recorder_federation_publication_install.py"
      - "catalog/mtconnect_recorder/**"
      - "catalog/standalone-recorder_v2/standalone-recorder_v2.py"
      - "catalog/standalone-recorder_v2/tests/test_lossless_recorder.py"
      - "requirements.txt"
      - "constraints-phase2.txt"
  push:
    branches: [main]
    paths:
      - ".github/workflows/recorder-federation-publication.yml"
      - "catalog/federation/recorder_delivery.py"
      - "catalog/federation/recorder_publication.py"
      - "catalog/federation/tests/test_recorder_publication.py"
      - "catalog/flask_app/services/federation_pairing_install.py"
      - "catalog/flask_app/services/recorder_federation_publication_install.py"
      - "catalog/flask_app/tests/test_recorder_config_bootstrap.py"
      - "catalog/flask_app/tests/test_recorder_federation_publication_install.py"
      - "catalog/mtconnect_recorder/**"
      - "catalog/standalone-recorder_v2/standalone-recorder_v2.py"
      - "catalog/standalone-recorder_v2/tests/test_lossless_recorder.py"
      - "requirements.txt"
      - "constraints-phase2.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recorder-federation-publication-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recorder-publication:
    name: Recorder publication (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest ruff

      - name: Compile recorder publication boundary
        run: >-
          python -m compileall -q
          catalog/mtconnect_recorder
          catalog/standalone-recorder_v2/standalone-recorder_v2.py
          catalog/federation/recorder_delivery.py
          catalog/federation/recorder_publication.py
          catalog/flask_app/services/federation_pairing_install.py
          catalog/flask_app/services/recorder_federation_publication_install.py
          catalog/flask_app/tests/test_recorder_config_bootstrap.py

      - name: Recorder capture and Federation publication regressions
        run: >-
          python -m pytest -o addopts= -q
          catalog/flask_app/tests/test_recorder_config_bootstrap.py
          catalog/standalone-recorder_v2/tests/test_lossless_recorder.py
          catalog/federation/tests/test_recorder_publication.py
          catalog/flask_app/tests/test_recorder_federation_publication_install.py

      - name: Ruff recorder publication boundary
        run: >-
          python -m ruff check
          catalog/mtconnect_recorder/config_bootstrap.py
          catalog/standalone-recorder_v2/standalone-recorder_v2.py
          catalog/flask_app/tests/test_recorder_config_bootstrap.py
          catalog/federation/recorder_delivery.py
          catalog/federation/recorder_publication.py
          catalog/federation/tests/test_recorder_publication.py
          catalog/flask_app/services/federation_pairing_install.py
          catalog/flask_app/services/recorder_federation_publication_install.py
          catalog/flask_app/tests/test_recorder_federation_publication_install.py
          --ignore I001,RUF022,B008,C408,PLC0206

      - name: Diff hygiene
        shell: bash
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi
