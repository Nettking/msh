name: Federation v1 release gate

on:
  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"
      - ".env.example"
      - "CHANGELOG.md"
      - "Dockerfile"
      - "Dockerfile.cli"
      - "README.md"
      - "catalog/**"
      - "cmd/fcp-peer-sidecar/**"
      - "constraints-phase2.txt"
      - "constraints-release.txt"
      - "docker-compose.yml"
      - "docs/**"
      - "migrate.cmd"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "scripts/**"
      - "setup_fcp.py"
      - "start.cmd"
      - "start.sh"
      - "start-tailscale.cmd"
      - "start-tailscale.sh"
      - "start_recorder.py"
      - "termux/**"
      - "update.cmd"
  push:
    branches: [main]
    paths:
      - ".github/actions/**"
      - ".github/workflows/**"
      - ".env.example"
      - "CHANGELOG.md"
      - "Dockerfile"
      - "Dockerfile.cli"
      - "README.md"
      - "catalog/**"
      - "cmd/fcp-peer-sidecar/**"
      - "constraints-phase2.txt"
      - "constraints-release.txt"
      - "docker-compose.yml"
      - "docs/**"
      - "migrate.cmd"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "scripts/**"
      - "setup_fcp.py"
      - "start.cmd"
      - "start.sh"
      - "start-tailscale.cmd"
      - "start-tailscale.sh"
      - "start_recorder.py"
      - "termux/**"
      - "update.cmd"
  workflow_dispatch:

permissions:
  contents: read
  actions: read # Native job identity for evidence provenance only.

concurrency:
  group: federation-v1-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-checks:
    name: Release checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: fcp-test-linux
            shell: bash
            python: "3.12.13"
          - os: Windows
            runner: fcp-test-windows
            shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
            python: "3.12.10"
    runs-on: [self-hosted, "${{ matrix.os }}", X64, "${{ matrix.runner }}"]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/self-hosted-python
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: "cmd/fcp-peer-sidecar/go.mod"
          cache: false

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements.txt -c constraints-release.txt
          python -m pip install pytest==9.1.1 ruff==0.16.3 -c constraints-release.txt

      - name: Ubuntu storage precondition
        if: runner.os == 'Linux'
        uses: ./.github/actions/ubuntu-storage-precondition

      - name: Compile maintained product packages
        run: python -m compileall -q catalog

      - name: POSIX readiness redirect regressions
        run: >-
          python -m pytest -o addopts= -q
          catalog/flask_app/tests/test_posix_start_readiness.py

      - name: Validate acceptance manifest shape
        run: >-
          python -c "import json, pathlib;
          manifest = json.loads(pathlib.Path('catalog/federation/tests/cf7_acceptance/scenarios.json').read_text(encoding='utf-8'));
          required = {
            'federation_v1_end_to_end_accepted',
            'capability_first_onboarding_end_to_end_accepted',
            'automated_product_acceptance_executable',
            'physical_evidence_accepted',
            'executable_now',
            'blocked_by_cfi',
            'manual_physical_verification',
          };
          assert required <= manifest.keys();
          assert all(isinstance(manifest[key], bool) for key in (
            'federation_v1_end_to_end_accepted',
            'capability_first_onboarding_end_to_end_accepted',
            'automated_product_acceptance_executable',
            'physical_evidence_accepted',
          ));
          assert manifest['automated_product_acceptance_executable'] is True;
          assert manifest['executable_now'];
          assert manifest['manual_physical_verification']"

      - name: Go direct peer sidecar tests
        working-directory: cmd/fcp-peer-sidecar
        run: |
          go mod tidy
          go test ./...

      - name: Ruff maintained release boundaries
        run: >-
          python -m ruff check
          scripts/ci_pytest_shards.py
          catalog/common/tests/test_ci_pytest_shards.py
          catalog/capabilities
          catalog/ai/remote_provider.py
          catalog/common/data_loading.py
          catalog/flask_app/app.py
          catalog/flask_app/capability_startup_transition_routes.py
          catalog/flask_app/data_upload_routes.py
          catalog/flask_app/docs_routes.py
          catalog/flask_app/provider_federation_routes.py
          catalog/flask_app/services/capability_contribution_components.py
          catalog/flask_app/services/data_upload_service.py
          catalog/flask_app/services/device_state_reset.py
          catalog/flask_app/services/existing_setup_resume.py
          catalog/flask_app/services/federation_pairing_install.py
          catalog/flask_app/services/local_capability_candidates.py
          catalog/flask_app/services/resilient_pairing_runtime.py
          catalog/flask_app/services/run_once_capability_evidence.py
          catalog/flask_app/services/upload_analysis_job_service.py
          catalog/flask_app/tests/test_legacy_startup_retired.py
          catalog/flask_app/tests/test_ai_explainer_candidate_visibility.py
          catalog/flask_app/tests/test_capability_runtime_startup.py
          catalog/flask_app/tests/test_capability_startup_transition_route.py
          catalog/flask_app/tests/test_data_upload.py
          catalog/flask_app/tests/test_device_state_reset.py
          catalog/flask_app/tests/test_docs_viewer.py
          catalog/flask_app/tests/test_existing_setup_resume.py
          catalog/flask_app/tests/test_federation_auto_reconnect.py
          catalog/flask_app/tests/test_local_capability_candidates.py
          catalog/flask_app/tests/test_provider_federation_surface.py
          catalog/flask_app/tests/test_release_reproducibility.py
          catalog/flask_app/tests/test_run_once_capability_evidence.py
          catalog/flask_app/tests/test_upload_analysis_jobs.py
          catalog/flask_app/tests/test_windows_start_script.py
          catalog/flask_app/tests/test_windows_update_script.py
          catalog/flask_app/tests/test_windows_volume_name_selection.py
          catalog/federation/projections/benchmark_adapter.py
          catalog/federation/projections/onboarding_adapter.py
          catalog/federation/projections/storage_job_adapters.py
          catalog/federation/tests/cf7_acceptance/physical_evidence.py
          catalog/federation/tests/cf7_acceptance/test_physical_evidence.py
          catalog/federation/tests/cf7_acceptance/test_product_acceptance.py
          catalog/federation/tests/test_benchmark_latest_projection.py
          catalog/federation/tests/test_onboarding_projection_policy.py
          catalog/federation/tests/test_release_documentation_links.py
          catalog/relay/tests/test_phase_f83_remote_ai_binding.py
          catalog/relay/tests/test_phase_f84_compute_worker_activation.py
          --ignore I001,RUF022,B008,C408,PLC0206,UP035

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Discovery authority and bounded startup regressions
        run: >-
          python -m pytest -o addopts= -q
          catalog/federation/tests/test_tailscale_discovery_budget.py
          catalog/federation/tests/test_tailscale_host_discovery.py
          catalog/federation/tests/test_tailscale_discovery_snapshot_roundtrip.py
          catalog/federation/tests/test_tailnet_join_responder.py
          catalog/federation/tests/test_tailnet_join_responder_exit.py
          catalog/federation/tests/test_tailnet_join_client.py
          catalog/federation/tests/test_tailscale_peer_identity.py
          catalog/flask_app/tests/test_discovery_read_only_metadata.py
          catalog/flask_app/tests/test_tailscale_discovery_onboarding.py
          catalog/flask_app/tests/test_tailnet_join_grant_route.py
          catalog/flask_app/tests/test_tailnet_join_auto_redeem.py
          catalog/flask_app/tests/test_tailnet_join_launcher.py
          catalog/mtconnect_recorder/tests/test_tailscale_recorder_launcher.py

      - name: Lint discovery boundary
        run: >-
          python -m ruff check
          catalog/federation/tailscale_host_discovery.py
          catalog/federation/tests/test_tailscale_discovery_budget.py
          catalog/flask_app/tests/test_discovery_read_only_metadata.py

      - name: Diff hygiene
        shell: bash
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi

  linux-regressions:
    name: Linux regression shard (${{ matrix.shard }})
    runs-on: [self-hosted, Linux, X64, fcp-test-linux]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/self-hosted-python
        with:
          python-version: 3.12.13

      - uses: actions/setup-go@v5
        with:
          go-version-file: "cmd/fcp-peer-sidecar/go.mod"
          cache: false

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements.txt -c constraints-release.txt
          python -m pip install pytest==9.1.1 ruff==0.16.3 -c constraints-release.txt

      - name: Ubuntu storage precondition
        uses: ./.github/actions/ubuntu-storage-precondition

      - name: Run one file-preserving regression shard
        run: >-
          python -m scripts.ci_pytest_shards run
          --index ${{ matrix.shard }} --count 4
          --manifest "${{ runner.temp }}/release-shards/shard-${{ matrix.shard }}.json"
          -- -o addopts= -q --durations=20
          --junitxml="${{ runner.temp }}/release-shards/junit-${{ matrix.shard }}.xml"
      - name: Preserve shard coverage and timings
        if: always()
        uses: ./.github/actions/nitro-artifact
        with:
          operation: upload
          ssh-key: ${{ secrets.NITRO_ARTIFACT_SSH_KEY }}
          host: ${{ vars.NITRO_ARTIFACT_HOST }}
          known-hosts: ${{ vars.NITRO_ARTIFACT_KNOWN_HOSTS }}
          matrix: ${{ toJSON(matrix) }}
          job-status: ${{ job.status }}
          name: linux-regression-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/release-shards/shard-${{ matrix.shard }}.json
            ${{ runner.temp }}/release-shards/junit-${{ matrix.shard }}.xml
      - name: Repository stays clean after the suite
        shell: bash
        run: |
          # Tests must not write into the tracked tree. A dirty worktree here
          # means shared state escaped a tmp_path fixture, which is the same
          # class of leak that makes suites order-dependent.
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree modified by the test suite:"
            git status --porcelain
            exit 1
          fi

        if: ${{ always() }}
  windows-regressions:
    name: Windows regressions (${{ matrix.suite }})
    runs-on: [self-hosted, Windows, X64, fcp-test-windows]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
    strategy:
      fail-fast: false
      matrix:
        suite: [capability-product, transport-storage, journal-artifacts]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/self-hosted-python
        with:
          python-version: 3.12.10

      - uses: actions/setup-go@v5
        with:
          go-version-file: "cmd/fcp-peer-sidecar/go.mod"
          cache: false

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements.txt -c constraints-release.txt
          python -m pip install pytest==9.1.1 ruff==0.16.3 -c constraints-release.txt

      - name: Windows capability and product release regressions
        if: matrix.suite == 'capability-product'
        env:
          TEMP: '\\?\C:\fcp-qtmp'
          TMP: '\\?\C:\fcp-qtmp'
        run: >-
          python -m pytest -o addopts= -q --durations=20 --junitxml="${{ runner.temp }}/windows-${{ matrix.suite }}.xml" catalog/capabilities/tests catalog/ai/tests/test_remote_provider.py catalog/relay/tests/test_phase_f83_remote_ai_binding.py catalog/relay/tests/test_phase_f84_compute_worker_activation.py catalog/federation/tests/cf7_acceptance/test_product_acceptance.py catalog/federation/tests/cf7_acceptance/test_physical_evidence.py catalog/federation/tests/cf7_acceptance/test_foundation.py catalog/flask_app/tests/test_capability_onboarding_route.py catalog/flask_app/tests/test_capability_inspection_route.py catalog/flask_app/tests/test_capability_benchmark_route.py catalog/flask_app/tests/test_capability_contribution_route.py catalog/flask_app/tests/test_capability_startup_transition_route.py catalog/flask_app/tests/test_federation_overview_route.py catalog/flask_app/test_navigation_smoke.py catalog/flask_app/tests/test_mobile_layout_contract.py catalog/flask_app/tests/test_responsive_routes.py catalog/flask_app/tests/test_post_setup_handoff.py catalog/flask_app/tests/test_provider_federation_surface.py catalog/flask_app/tests/test_recorder_control_service.py catalog/flask_app/tests/test_ai_runtime_integration.py catalog/flask_app/tests/test_device_state_reset.py catalog/flask_app/tests/test_local_capability_candidates.py catalog/flask_app/tests/test_ai_explainer_candidate_visibility.py catalog/flask_app/tests/test_capability_runtime_startup.py catalog/flask_app/tests/test_data_upload.py catalog/flask_app/tests/test_upload_analysis_jobs.py catalog/flask_app/tests/test_federation_auto_reconnect.py catalog/flask_app/tests/test_existing_setup_resume.py catalog/flask_app/tests/test_run_once_capability_evidence.py catalog/flask_app/tests/test_release_reproducibility.py catalog/flask_app/tests/test_windows_start_script.py catalog/flask_app/tests/test_windows_update_script.py catalog/flask_app/tests/test_windows_volume_name_selection.py catalog/federation/tests/test_federation_projections.py catalog/federation/tests/test_benchmark_latest_projection.py catalog/federation/tests/test_onboarding_contracts.py catalog/federation/tests/test_onboarding_discovery_service.py catalog/federation/tests/test_onboarding_projection_policy.py catalog/federation/tests/test_release_documentation_links.py catalog/federation/tests/test_phase0.py catalog/federation/tests/test_phase1.py catalog/federation/tests/test_phase2_unit.py

      - name: Windows transport, storage, and failover regressions
        if: matrix.suite == 'transport-storage'
        env:
          TEMP: '\\?\C:\fcp-qtmp'
          TMP: '\\?\C:\fcp-qtmp'
        run: >-
          python -m pytest -o addopts= -q --durations=20 --junitxml="${{ runner.temp }}/windows-${{ matrix.suite }}.xml" catalog/node/tests/test_identity.py catalog/node/tests/test_state.py catalog/node/tests/test_client.py catalog/mtconnect_recorder/tests/test_multi_recorder_capability_identity.py catalog/node/tests/test_storage_agent.py catalog/node/tests/test_three_machine_deployment.py catalog/node/tests/test_physical_storage_failover.py catalog/node/tests/test_physical_storage_recovery.py catalog/node/tests/test_phase_f61_transport.py catalog/node/tests/test_phase_f62_direct_peer.py catalog/node/tests/test_phase_f63_relay_loss_continuity.py catalog/node/tests/test_live_storage_replication.py catalog/node/tests/test_live_storage_failover.py catalog/node/tests/test_live_storage_catchup.py catalog/node/tests/test_live_storage_reinstatement.py catalog/node/tests/test_verified_live_failover.py catalog/relay/tests/test_service.py catalog/federation/tests/test_storage_protocol.py catalog/federation/tests/test_local_storage.py catalog/federation/tests/test_phase_d3_control_plane.py catalog/federation/tests/test_phase_d4_write_authority.py catalog/federation/tests/test_phase_d5_logical_storage.py catalog/federation/tests/test_phase_d6_replication.py catalog/federation/tests/test_phase_d7_d8_ack_handover.py catalog/federation/tests/test_phase_e0_contracts.py catalog/federation/tests/test_phase_e1_manifest_store.py catalog/federation/tests/test_phase_e1_service_manifest.py catalog/federation/tests/test_phase_e2_watermarks.py catalog/federation/tests/test_phase_e3_reports.py catalog/federation/tests/test_phase_e4_selection.py catalog/federation/tests/test_phase_e5_degraded_state.py catalog/federation/tests/test_phase_e6_promotion_transaction.py catalog/federation/tests/test_phase_e63_provider_fencing.py catalog/federation/tests/test_phase_e64_authority_grant.py catalog/federation/tests/test_phase_e65_finalization.py catalog/federation/tests/test_phase_e66_recovery.py catalog/federation/tests/test_phase_e67_coordinator_publication.py catalog/federation/tests/test_phase_e71_former_primary_recovery.py catalog/federation/tests/test_phase_e72_former_primary_transfer.py catalog/federation/tests/test_phase_e78_former_primary_completion.py

      - name: Windows replicated journal and reviewer artifact regressions
        if: matrix.suite == 'journal-artifacts'
        env:
          TEMP: C:/fcp-qtmp
          TMP: C:/fcp-qtmp
        run: >-
          python -m pytest -o addopts= -q --durations=20 --junitxml="${{ runner.temp }}/windows-${{ matrix.suite }}.xml" catalog/federation/tests/test_control_plane_bootstrap_proposal.py catalog/federation/tests/test_control_plane_journal_private.py catalog/federation/tests/test_control_plane_journal_projection.py catalog/federation/tests/test_control_plane_journal_runtime.py catalog/federation/tests/test_control_plane_journal_store.py catalog/federation/tests/test_control_plane_product_journal.py catalog/federation/tests/test_control_plane_product_transactions.py catalog/federation/tests/test_control_plane_public_journal.py catalog/federation/tests/test_control_plane_public_journal_acquisition.py catalog/federation/tests/test_control_plane_port_probe_ownership.py catalog/federation/tests/test_control_plane_release_bootstrap_recovery.py catalog/federation/tests/test_control_plane_witnessed_chunk_recovery.py catalog/federation/tests/test_control_plane_session_authority.py catalog/federation/tests/test_control_plane_health_leadership_race.py catalog/flask_app/tests/test_c03_pairing_onboarding.py catalog/flask_app/tests/test_c03_provider_operator.py catalog/flask_app/tests/test_c03_session_authority.py catalog/federation/tests/test_c03_offline_creator_migration.py catalog/federation/tests/test_control_plane_runtime_retry.py catalog/federation/tests/test_icse_network_provenance.py catalog/federation/tests/test_icse_artifact_bundle.py

      - name: Preserve Windows regression timings
        if: always()
        uses: ./.github/actions/nitro-artifact
        with:
          operation: upload
          ssh-key: ${{ secrets.NITRO_ARTIFACT_SSH_KEY }}
          host: ${{ vars.NITRO_ARTIFACT_HOST }}
          known-hosts: ${{ vars.NITRO_ARTIFACT_KNOWN_HOSTS }}
          matrix: ${{ toJSON(matrix) }}
          job-status: ${{ job.status }}
          name: windows-regression-${{ matrix.suite }}
          path: ${{ runner.temp }}/windows-${{ matrix.suite }}.xml
  postgres-storage:
    name: PostgreSQL storage release check
    runs-on: [self-hosted, Linux, X64, fcp-docker-linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable PostgreSQL 16
        uses: ./.github/actions/self-hosted-postgres
      - uses: ./.github/actions/self-hosted-python
        with:
          python-version: "3.12.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements.txt -c constraints-release.txt
          python -m pip install pytest==9.1.1 -c constraints-release.txt
      - name: Ubuntu storage precondition
        uses: ./.github/actions/ubuntu-storage-precondition

      - name: PostgreSQL storage authority regression
        run: >-
          python -m pytest -o addopts= -q
          catalog/federation/tests/test_phase_d2_postgres.py

      - name: Remove disposable PostgreSQL 16
        if: always()
        uses: ./.github/actions/self-hosted-postgres
        with:
          operation: stop

  suite-order-runs:
    name: Full-suite order (${{ matrix.order }})
    runs-on:
      - self-hosted
      - Linux
      - X64
      - fcp-test-linux
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/self-hosted-python
        with:
          python-version: "3.12.13"

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements.txt -c constraints-release.txt
          python -m pip install pytest==9.1.1 pytest-randomly==4.1.0 -c constraints-release.txt

      - name: Ubuntu storage precondition
        uses: ./.github/actions/ubuntu-storage-precondition

      - name: Entire suite in the selected shuffled order
        run: python -m pytest -o addopts= -q -p randomly --randomly-seed=${{ matrix.seed }} --durations=20 --junitxml="${{ runner.temp }}/order-${{ matrix.order }}.xml"

      - name: Repository stays clean after the suite
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree modified by the test suite:"
            git status --porcelain
            exit 1
          fi

        if: ${{ always() }}
      - name: Preserve full-suite order timings
        if: always()
        uses: ./.github/actions/nitro-artifact
        with:
          operation: upload
          ssh-key: ${{ secrets.NITRO_ARTIFACT_SSH_KEY }}
          host: ${{ vars.NITRO_ARTIFACT_HOST }}
          known-hosts: ${{ vars.NITRO_ARTIFACT_KNOWN_HOSTS }}
          matrix: ${{ toJSON(matrix) }}
          job-status: ${{ job.status }}
          name: full-suite-order-${{ matrix.order }}
          path: ${{ runner.temp }}/order-${{ matrix.order }}.xml
    strategy:
      fail-fast: false
      matrix:
        include:
          - order: fixed
            seed: 20260813
          - order: rotating
            seed: ${{ github.run_number }}
  release-matrix:
    name: Release matrix (${{ matrix.os }})
    if: always()
    needs: [release-checks, linux-regressions, windows-regressions]
    strategy:
      fail-fast: false
      matrix:
        os: [Linux, Windows]
    runs-on: [self-hosted, Linux, X64, fcp-test-linux]
    timeout-minutes: 5
    steps:
      - name: Require release checks and every regression shard
        env:
          CHECKS: ${{ needs.release-checks.result }}
          LINUX: ${{ needs.linux-regressions.result }}
          WINDOWS: ${{ needs.windows-regressions.result }}
        run: |
          test "$CHECKS" = success
          test "$LINUX" = success
          test "$WINDOWS" = success
      - uses: actions/checkout@v4
      - uses: ./.github/actions/nitro-artifact
        with:
          operation: download
          ssh-key: ${{ secrets.NITRO_ARTIFACT_SSH_KEY }}
          host: ${{ vars.NITRO_ARTIFACT_HOST }}
          known-hosts: ${{ vars.NITRO_ARTIFACT_KNOWN_HOSTS }}
          matrix: ${{ toJSON(matrix) }}
          job-status: ${{ job.status }}
          pattern: linux-regression-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/verify-release-shards-${{ matrix.os }}
      - name: Require exact complete Linux test coverage
        run: >-
          /opt/fcp-ci/python/3.12.13/bin/python3.12 -m scripts.ci_pytest_shards verify
          --directory "${{ runner.temp }}/verify-release-shards-${{ matrix.os }}"
          --count 4 --source-sha "${{ github.sha }}"
  suite-order-independence:
    name: Clean-checkout suite order independence
    if: always()
    needs: [suite-order-runs]
    runs-on: [self-hosted, Linux, X64, fcp-test-linux]
    timeout-minutes: 5
    steps:
      - name: Require both complete-suite order checks
        env:
          RESULT: ${{ needs.suite-order-runs.result }}
        run: test "$RESULT" = success
  release-verdict:
    name: Federation v1 automated release verdict
    if: always()
    needs: [release-matrix, postgres-storage, suite-order-independence]
    runs-on:
      - self-hosted
      - Linux
      - X64
      - fcp-test-linux
    steps:
      - name: Require every automated release job
        shell: bash
        run: |
          test "${{ needs.release-matrix.result }}" = "success"
          test "${{ needs.postgres-storage.result }}" = "success"
          test "${{ needs.suite-order-independence.result }}" = "success"
    timeout-minutes: 5
