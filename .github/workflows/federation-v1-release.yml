name: Federation v1 release gate

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "README.md"
      - "catalog/**"
      - "constraints-phase2.txt"
      - "docker-compose.yml"
      - "docs/**"
      - "requirements.txt"
      - "scripts/**"
      - "start.cmd"
      - "update.cmd"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "README.md"
      - "catalog/**"
      - "constraints-phase2.txt"
      - "docker-compose.yml"
      - "docs/**"
      - "requirements.txt"
      - "scripts/**"
      - "start.cmd"
      - "update.cmd"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: federation-v1-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-matrix:
    name: Release matrix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest ruff

      - name: Compile maintained product packages
        run: >-
          python -m compileall -q
          catalog

      - name: Validate acceptance manifest shape
        run: >-
          python -c "import json, pathlib;
          manifest = json.loads(pathlib.Path('catalog/federation/tests/cf7_acceptance/scenarios.json').read_text(encoding='utf-8'));
          required = {
            'federation_v1_end_to_end_accepted',
            'capability_first_onboarding_end_to_end_accepted',
            'automated_product_acceptance_executable',
            'physical_evidence_accepted',
            'executable_now',
            'blocked_by_cfi',
            'manual_physical_verification',
          };
          assert required <= manifest.keys();
          assert all(isinstance(manifest[key], bool) for key in (
            'federation_v1_end_to_end_accepted',
            'capability_first_onboarding_end_to_end_accepted',
            'automated_product_acceptance_executable',
            'physical_evidence_accepted',
          ));
          assert manifest['automated_product_acceptance_executable'] is True;
          assert manifest['executable_now'];
          assert manifest['manual_physical_verification']"

      - name: Run complete automated catalog test suite
        run: python -m pytest -o addopts= -q

      - name: Ruff maintained release boundaries
        run: >-
          python -m ruff check
          catalog/capabilities
          catalog/ai/remote_provider.py
          catalog/common/data_loading.py
          catalog/flask_app/app.py
          catalog/flask_app/capability_startup_transition_routes.py
          catalog/flask_app/data_upload_routes.py
          catalog/flask_app/docs_routes.py
          catalog/flask_app/provider_federation_routes.py
          catalog/flask_app/services/capability_contribution_components.py
          catalog/flask_app/services/data_upload_service.py
          catalog/flask_app/services/device_state_reset.py
          catalog/flask_app/services/existing_setup_resume.py
          catalog/flask_app/services/federation_pairing_install.py
          catalog/flask_app/services/local_capability_candidates.py
          catalog/flask_app/services/resilient_pairing_runtime.py
          catalog/flask_app/services/run_once_capability_evidence.py
          catalog/flask_app/services/upload_analysis_job_service.py
          catalog/flask_app/test_startup_ai_benchmark.py
          catalog/flask_app/test_startup_saved_landing.py
          catalog/flask_app/tests/test_ai_explainer_candidate_visibility.py
          catalog/flask_app/tests/test_capability_runtime_startup.py
          catalog/flask_app/tests/test_capability_startup_transition_route.py
          catalog/flask_app/tests/test_data_upload.py
          catalog/flask_app/tests/test_device_state_reset.py
          catalog/flask_app/tests/test_docs_viewer.py
          catalog/flask_app/tests/test_existing_setup_resume.py
          catalog/flask_app/tests/test_federation_auto_reconnect.py
          catalog/flask_app/tests/test_local_capability_candidates.py
          catalog/flask_app/tests/test_provider_federation_surface.py
          catalog/flask_app/tests/test_run_once_capability_evidence.py
          catalog/flask_app/tests/test_upload_analysis_jobs.py
          catalog/flask_app/tests/test_windows_start_script.py
          catalog/flask_app/tests/test_windows_update_script.py
          catalog/flask_app/tests/test_windows_volume_name_selection.py
          catalog/federation/projections/benchmark_adapter.py
          catalog/federation/projections/onboarding_adapter.py
          catalog/federation/projections/storage_job_adapters.py
          catalog/federation/tests/cf7_acceptance/physical_evidence.py
          catalog/federation/tests/cf7_acceptance/test_physical_evidence.py
          catalog/federation/tests/cf7_acceptance/test_product_acceptance.py
          catalog/federation/tests/test_benchmark_latest_projection.py
          catalog/federation/tests/test_onboarding_projection_policy.py
          catalog/federation/tests/test_release_documentation_links.py
          catalog/relay/tests/test_phase_f83_remote_ai_binding.py
          catalog/relay/tests/test_phase_f84_compute_worker_activation.py
          --ignore I001,RUF022,B008,C408,PLC0206,UP035

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Diff hygiene
        shell: bash
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi
