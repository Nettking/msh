name: Fix F4.2 degraded binding

on:
  pull_request:
    paths:
      - ".github/workflows/f42-fix-degraded-binding.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Allow matching degraded state to evolve until final proof
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('catalog/federation/live_reinstatement.py')
          text = path.read_text()

          old = '''            self.catchup_report_revision,\n            self.catchup_report_hash,\n            self.degraded_state_hash,\n            self.created_at,\n'''
          new = '''            self.catchup_report_revision,\n            self.catchup_report_hash,\n            self.created_at,\n'''
          if old not in text:
              raise SystemExit('immutable binding anchor missing')
          text = text.replace(old, new, 1)

          old = '''            record = self.store.save(\n                replace(\n                    record,\n                    state=_STATE_REPORT_ACCEPTED,\n                    final_report_revision=assessment.report_revision,\n                    final_report_hash=assessment.report_hash,\n                    latest_error_code=None,\n                    latest_error_reason=None,\n                    updated_at=self.clock(),\n                )\n            )\n'''
          new = '''            degraded = self.control_plane.storage_degraded_state(\n                record.session_id, record.group_id\n            )\n            if not self._matching_degraded_record(degraded, record, failover):\n                raise FederationValidationError(\n                    "reinstatement-degraded-state-mismatch",\n                    "storage_degraded_state",\n                    "degraded state is missing or unrelated to this failover",\n                )\n            record = self.store.save(\n                replace(\n                    record,\n                    state=_STATE_REPORT_ACCEPTED,\n                    final_report_revision=assessment.report_revision,\n                    final_report_hash=assessment.report_hash,\n                    degraded_state_hash=_degraded_hash(degraded),\n                    latest_error_code=None,\n                    latest_error_reason=None,\n                    updated_at=self.clock(),\n                )\n            )\n'''
          if old not in text:
              raise SystemExit('report acceptance anchor missing')
          text = text.replace(old, new, 1)

          old = '''        degraded = self.control_plane.storage_degraded_state(\n            record.session_id, record.group_id\n        )\n        if degraded is None or _degraded_hash(degraded) != record.degraded_state_hash:\n            raise FederationValidationError(\n                "reinstatement-degraded-state-changed",\n                "storage_degraded_state",\n                "degraded state is missing, newer, or unrelated",\n            )\n'''
          new = '''        degraded = self.control_plane.storage_degraded_state(\n            record.session_id, record.group_id\n        )\n        if not self._matching_degraded_record(degraded, record, failover):\n            raise FederationValidationError(\n                "reinstatement-degraded-state-changed",\n                "storage_degraded_state",\n                "degraded state is missing or unrelated to this failover",\n            )\n'''
          if old not in text:
              raise SystemExit('current degraded validation anchor missing')
          text = text.replace(old, new, 1)

          anchor = '''    @staticmethod\n    def _matching_degraded(\n        degraded: dict[str, Any] | None,\n        catchup: LiveCatchupRecord,\n        failover: LiveFailoverRecord,\n    ) -> bool:\n'''
          helper = '''    @staticmethod\n    def _matching_degraded_record(\n        degraded: dict[str, Any] | None,\n        record: LiveReinstatementRecord,\n        failover: LiveFailoverRecord,\n    ) -> bool:\n        if degraded is None:\n            return False\n        obligations = degraded.get("obligations")\n        revision = degraded.get("manifest_revision")\n        return (\n            degraded.get("session_id") == record.session_id\n            and degraded.get("group_id") == record.group_id\n            and isinstance(revision, int)\n            and not isinstance(revision, bool)\n            and revision >= record.manifest_revision\n            and degraded.get("reason_code")\n            == "automatic-failover-redundancy-lost"\n            and isinstance(obligations, dict)\n            and obligations.get("action")\n            == "restore-replication-and-acknowledgement-policy"\n            and obligations.get("failed_provider_id")\n            == record.returning_provider_id\n            and obligations.get("previous_acknowledgement_mode")\n            == failover.previous_acknowledgement_mode.value\n        )\n\n'''
          if anchor not in text:
              raise SystemExit('matching degraded helper anchor missing')
          path.write_text(text.replace(anchor, helper + anchor, 1))

          test = Path('catalog/node/tests/test_live_storage_reinstatement.py')
          text = test.read_text()
          old = '''                    assert committed.committed\n                    assert committed.required_replica_acks == 0\n'''
          new = '''                    assert committed.committed\n                    assert committed.result is not None\n                    assert committed.result.required_replica_acks == 0\n'''
          if old not in text:
              raise SystemExit('admission acknowledgement anchor missing')
          text = text.replace(old, new, 1)
          old = '''            assert final_write.committed\n            assert final_write.required_replica_acks == 1\n            assert final_write.acknowledged_replica_ids == (\n'''
          new = '''            assert final_write.committed\n            assert final_write.result is not None\n            assert final_write.result.required_replica_acks == 1\n            assert final_write.result.acknowledged_replica_ids == (\n'''
          if old not in text:
              raise SystemExit('final acknowledgement anchor missing')
          test.write_text(text.replace(old, new, 1))
          PY
          python -m py_compile catalog/federation/live_reinstatement.py catalog/node/tests/test_live_storage_reinstatement.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/federation/live_reinstatement.py catalog/node/tests/test_live_storage_reinstatement.py
          git commit -m 'Bind F4.2 to latest matching degraded state'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
