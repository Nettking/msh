name: CF8 bounded source rewrite PR

on:
  pull_request:
    paths:
      - .github/workflows/cf8-pr-rewrite.yml

permissions:
  contents: write

jobs:
  rewrite:
    if: github.head_ref == 'agent/cf8-retire-legacy-role-runtime'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cf8-retire-legacy-role-runtime
          fetch-depth: 0
      - name: Apply bounded rewrites
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          runtime_path = Path("catalog/mtconnect_recorder/runtime.py")
          runtime = runtime_path.read_text(encoding="utf-8")
          runtime = runtime.replace(
              "* Legacy compatibility is limited to the four recorder technical fields in\n  ``server_settings.json``. Deployment role, AI settings, and setup authority are ignored.\n",
              "",
          )
          runtime = replace_once(
              runtime,
              'CAPABILITY_CONFIG_FILE = Path("data") / "capabilities" / "config.json"\nLEGACY_SETTINGS_FILE = Path("data") / "server_setup" / "server_settings.json"\nDEFAULT_CONFIG_FILE = LEGACY_SETTINGS_FILE\nCAPABILITY_CONFIG_SCHEMA = "fcp.capability_config.v1"\nLEGACY_SETTINGS_SCHEMAS = {"fcp.server_setup.v1", "fcp.server_setup.v2", "fcp.server_setup.v3"}\n',
              'CAPABILITY_CONFIG_FILE = Path("data") / "capabilities" / "config.json"\nDEFAULT_CONFIG_FILE = CAPABILITY_CONFIG_FILE\nCAPABILITY_CONFIG_SCHEMA = "fcp.capability_config.v1"\n',
              "recorder config constants",
          )
          runtime, count = re.subn(
              r"def _managed_configuration\(config_file: Path\) -> dict\[str, Any\]:\n.*?\n\ndef _sources_from_config",
              '''def _managed_configuration(config_file: Path) -> dict[str, Any]:
    """Load recorder technical parameters from CapabilityConfig only."""

    if not config_file.exists():
        return {}
    payload = _read_json(config_file)
    if not payload or payload.get("schema") != CAPABILITY_CONFIG_SCHEMA:
        return {}
    return {
        "sources": _parse_sources_text(str(payload.get("recorder_sources") or "")),
        "poll_interval": payload.get("recorder_poll_interval"),
        "include_condition": payload.get("recorder_include_condition"),
    }


def _sources_from_config''',
              runtime,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"recorder managed config: expected one match, found {count}")
          runtime_path.write_text(runtime, encoding="utf-8")

          routes_path = Path("catalog/flask_app/routes.py")
          routes = routes_path.read_text(encoding="utf-8")
          routes = replace_once(
              routes,
              '# Import-only compatibility seam for transition tests/integrations that still\n# monkeypatch this historical symbol. No product route uses legacy settings.\nfrom .services.server_setup_service import load_settings  # noqa: F401\n',
              "",
              "routes legacy monkeypatch import",
          )
          routes, count = re.subn(
              r'\n@web\.post\("/startup/choose"\)\ndef choose_startup_mode\(\):\n.*?(?=\n@web\.get\("/get-started"\))',
              "",
              routes,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"startup choose route: expected one match, found {count}")
          routes_path.write_text(routes, encoding="utf-8")

          pipeline_path = Path("catalog/orchestrator/pipeline.py")
          pipeline = pipeline_path.read_text(encoding="utf-8")
          pipeline = replace_once(
              pipeline,
              'STARTUP_MODE_PENDING = "pending_choice"\nSTARTUP_MODE_CONTINUE = "continue_existing"\nSTARTUP_MODE_CLEAN = "start_clean"\n',
              'STARTUP_MODE_PENDING = "pending_choice"\nSTARTUP_MODE_CAPABILITY = "capability"\nSTARTUP_MODE_CONTINUE = "continue_existing"\nSTARTUP_MODE_CLEAN = "start_clean"\n',
              "runtime startup constants",
          )
          marker = "    def startup_decision_snapshot(self) -> dict[str, Any]:\n"
          method = '''    def prepare_capability_startup(self) -> None:
        """Resolve pending namespace state from capability authority, not a role choice."""

        with self._lock:
            if self._state.startup_mode != STARTUP_MODE_PENDING:
                return
            app_started_at = self._state.app_started_at
            runtime_started_at = self._state.runtime_started_at
            loaded = self._load_state()
            loaded.startup_mode = STARTUP_MODE_CAPABILITY
            loaded.startup_decision_source = "capability"
            loaded.active_runtime_namespace = loaded.active_runtime_namespace or "default"
            loaded.app_started_at = app_started_at or loaded.app_started_at
            loaded.runtime_started_at = runtime_started_at or loaded.runtime_started_at
            self._state = loaded
            self._persist_state()

'''
          if method not in pipeline:
              pipeline = replace_once(pipeline, marker, method + marker, "capability runtime method insertion")
          pipeline_path.write_text(pipeline, encoding="utf-8")

          Path("catalog/orchestrator/capability_startup.py").write_text(
              '''"""Capability-first adapter for the existing workflow runtime."""

from __future__ import annotations

from .pipeline import RuntimeOrchestrator, get_runtime_manager, start_runtime_background


def prepare_capability_runtime(
    manager: RuntimeOrchestrator | None = None,
) -> RuntimeOrchestrator:
    """Prepare the runtime from capability authority without a compatibility choice."""

    manager = manager or get_runtime_manager()
    manager.prepare_capability_startup()
    return manager


def start_capability_runtime_background() -> None:
    prepare_capability_runtime()
    start_runtime_background()


__all__ = [
    "prepare_capability_runtime",
    "start_capability_runtime_background",
]
''',
              encoding="utf-8",
          )

          app_path = Path("catalog/flask_app/app.py")
          app = app_path.read_text(encoding="utf-8")
          app, count = re.subn(
              r"    @app\.before_request\n    def prepare_completed_capability_runtime\(\):\n.*?(?=\n    app\.register_blueprint\(docs_web\))",
              '''    @app.before_request
    def prepare_completed_capability_runtime():
        """Prepare workflow runtime only after capability intent enables it."""

        try:
            flags = get_capability_startup_transition_service().capability_flags()
        except Exception as exc:  # noqa: BLE001 - startup remains fail-closed
            app.logger.info(
                "Capability runtime preparation unavailable (%s)",
                type(exc).__name__,
            )
            return
        if not bool(flags.get("completed")) or not bool(flags.get("runtime")):
            return
        try:
            prepare_capability_runtime(get_runtime_manager())
        except Exception as exc:  # noqa: BLE001 - runtime startup remains isolated
            app.logger.warning(
                "Capability runtime preparation failed (%s)",
                type(exc).__name__,
            )
''',
              app,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"app capability runtime hook: expected one match, found {count}")
          app_path.write_text(app, encoding="utf-8")

          gate_path = Path("catalog/flask_app/tests/test_cf8_role_retirement.py")
          gate = gate_path.read_text(encoding="utf-8")
          gate = replace_once(
              gate,
              '        if "tests" in path.parts or path in MIGRATION_ROLE_FILES:\n            continue\n',
              '        if "tests" in path.parts or path.name.startswith("test_") or path in MIGRATION_ROLE_FILES:\n            continue\n',
              "CF8 source scan test exclusion",
          )
          gate_path.write_text(gate, encoding="utf-8")
          PY
      - name: Commit bounded rewrites
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source rewrites required."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/mtconnect_recorder/runtime.py catalog/flask_app/routes.py catalog/orchestrator/pipeline.py catalog/orchestrator/capability_startup.py catalog/flask_app/app.py catalog/flask_app/tests/test_cf8_role_retirement.py
          git commit -m "Retire remaining CF8 runtime compatibility seams"
          git push origin HEAD:agent/cf8-retire-legacy-role-runtime
