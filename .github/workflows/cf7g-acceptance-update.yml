name: Apply CF7-G acceptance update

on:
  pull_request:
    branches:
      - agent/cf7f-onboarding-recovery

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cf7g-fast-federation-onboarding
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply acceptance update
        run: python tools/apply_cf7g_acceptance_update.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest ruff
      - name: Run acceptance suites
        run: |
          python -m pytest -o addopts= -q \
            catalog/federation/tests/cf7_acceptance \
            catalog/flask_app/tests/test_capability_startup_transition_route.py \
            catalog/flask_app/tests/test_fast_federation_onboarding.py
      - name: Ruff updated acceptance file
        run: |
          ruff check \
            catalog/federation/tests/cf7_acceptance/test_product_acceptance.py \
            catalog/flask_app/tests/test_capability_startup_transition_route.py \
            catalog/flask_app/tests/test_fast_federation_onboarding.py
      - name: Commit validated update
        run: |
          rm tools/apply_cf7g_acceptance_update.py
          rm .github/workflows/cf7g-acceptance-update.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Update acceptance for Federation handoff"
          git push origin HEAD:agent/cf7g-fast-federation-onboarding
