name: Fast Windows validation

# Independent Windows confirmation of the frozen candidate on Beast-Windows.
# Its own branch, so it cannot cancel the Linux run in flight.
#
# Every step uses cmd rather than PowerShell. Beast-Windows has no pwsh, and its
# Windows PowerShell refuses to run script files at all -- "running scripts is
# disabled on this system". Relaxing that is a change to host security policy,
# which is out of scope here, and cmd is what the existing Windows release gate
# already uses, so the confirmation matches the gate rather than working around
# the machine.
#
# Nothing here changes product code, tests, timeouts, thresholds, Python
# versions, the runner or its configuration.

on:
  push:
    branches:
      - ci/fast-windows-validation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fast-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ba8a3b0b828f59c36c5aaaf6130480a2432a5578

jobs:
  smoke-beast-windows:
    name: "Smoke: Beast-Windows"
    runs-on: [self-hosted, beast-windows]
    timeout-minutes: 30
    steps:
      - name: Runner identity
        shell: cmd
        run: |
          echo runner name : %RUNNER_NAME%
          echo host        : %COMPUTERNAME%
          echo user        : %USERNAME%
          echo cpus        : %NUMBER_OF_PROCESSORS%
          echo arch        : %PROCESSOR_ARCHITECTURE%
      - name: Available toolchains
        if: always()
        shell: cmd
        run: |
          where python || echo python NOT FOUND
          where py || echo py NOT FOUND
          where go || echo go NOT FOUND
          where git || echo git NOT FOUND
          where docker || echo docker NOT FOUND
      - name: Python version if present
        if: always()
        shell: cmd
        run: |
          python --version
          if errorlevel 1 echo no python on PATH; this is a probe, not a verdict
          exit /b 0
      - name: Free disk on C
        if: always()
        shell: cmd
        run: |
          dir C:\ | find "bytes free"
          exit /b 0

  windows-release-subsets:
    name: "Beast-Windows: capability, transport and storage subsets"
    runs-on: [self-hosted, beast-windows]
    needs: smoke-beast-windows
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ba8a3b0b828f59c36c5aaaf6130480a2432a5578
      - name: Verify exact candidate SHA
        shell: cmd
        run: |
          git rev-parse HEAD > "%RUNNER_TEMP%\head.txt"
          set /p HEAD=< "%RUNNER_TEMP%\head.txt"
          echo HEAD is %HEAD%
          if /I not "%HEAD%"=="%CANDIDATE_SHA%" exit /b 1
          echo HEAD verified
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python identity and release dependencies
        shell: cmd
        run: |
          python --version
          python -m pip install --quiet --upgrade pip==26.2.1
          python -m pip install --quiet -r requirements.txt -c constraints-release.txt
          python -m pip install --quiet pytest==9.1.1 -c constraints-release.txt
      - name: Storage allocation and host-resource preconditions
        shell: cmd
        run: python scripts/ci_release_disk_preflight.py "%GITHUB_WORKSPACE%" "%TEMP%"
      - name: Windows capability and product release regressions
        if: always()
        shell: cmd
        run: >-
          python -m pytest -o addopts= -q
          catalog/capabilities/tests
          catalog/ai/tests/test_remote_provider.py
          catalog/relay/tests/test_phase_f83_remote_ai_binding.py
          catalog/relay/tests/test_phase_f84_compute_worker_activation.py
          catalog/federation/tests/cf7_acceptance/test_product_acceptance.py
          catalog/federation/tests/cf7_acceptance/test_physical_evidence.py
          catalog/federation/tests/cf7_acceptance/test_foundation.py
          catalog/flask_app/tests/test_federation_overview_route.py
      - name: Windows transport, storage and failover regressions
        if: always()
        shell: cmd
        run: >-
          python -m pytest -o addopts= -q
          catalog/node/tests/test_identity.py
          catalog/node/tests/test_state.py
          catalog/node/tests/test_client.py
          catalog/mtconnect_recorder/tests/test_multi_recorder_capability_identity.py
          catalog/node/tests/test_storage_agent.py
          catalog/node/tests/test_three_machine_deployment.py
          catalog/node/tests/test_physical_storage_failover.py
          catalog/node/tests/test_physical_storage_recovery.py
          catalog/relay/tests/test_service.py
          catalog/federation/tests/test_phase_d3_control_plane.py
          catalog/federation/tests/test_phase_d4_write_authority.py
      - name: The five tests that failed on Nitro, 10 repeats
        if: always()
        shell: cmd
        run: |
          setlocal enabledelayedexpansion
          set FAILS=0
          for /L %%i in (1,1,10) do (
            python -m pytest -o addopts= -q catalog/mtconnect_recorder/tests/test_source_availability_retry.py catalog/relay/tests/test_phase2_integration.py::test_f2_006_revocation_rejects_traffic_and_reconnect_but_peer_survives catalog/flask_app/tests/test_federation_pairing_relay.py catalog/node/tests/test_live_storage_catchup.py
            if errorlevel 1 set /a FAILS+=1
            echo repeat %%i done, failures so far !FAILS!
          )
          echo TARGETED_REPEATS: !FAILS! of 10 failed
          if !FAILS! NEQ 0 exit /b 1
