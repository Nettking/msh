name: Correct Phase E Ruff findings

on:
  push:
    branches:
      - agent/complete-phase-e-recovery
    paths:
      - ".github/workflows/phase-e-fix-ruff.yml"

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply focused Ruff corrections
        shell: python
        run: |
          from pathlib import Path

          completion = Path("catalog/federation/former_primary_completion.py")
          text = completion.read_text(encoding="utf-8")
          old = "from typing import Any, Callable"
          new = "from collections.abc import Callable\nfrom typing import Any"
          if text.count(old) != 1:
              raise SystemExit("completion Callable import was not found exactly once")
          completion.write_text(text.replace(old, new, 1), encoding="utf-8")

          repair = Path("catalog/federation/former_primary_repair.py")
          text = repair.read_text(encoding="utf-8")
          old_import = "from typing import Any, Callable"
          new_import = "from collections.abc import Callable\nfrom typing import ClassVar"
          if text.count(old_import) != 1:
              raise SystemExit("repair typing import was not found exactly once")
          text = text.replace(old_import, new_import, 1)
          old_codes = "    _FATAL_CODES = {"
          new_codes = "    _FATAL_CODES: ClassVar[set[str]] = {"
          if text.count(old_codes) != 1:
              raise SystemExit("fatal code class attribute was not found exactly once")
          repair.write_text(text.replace(old_codes, new_codes, 1), encoding="utf-8")

          tests = Path("catalog/federation/tests/test_phase_e78_former_primary_completion.py")
          text = tests.read_text(encoding="utf-8")
          unused = "    selected_control = control or runtime.control\n"
          if text.count(unused) != 1:
              raise SystemExit("unused selected_control assignment was not found exactly once")
          tests.write_text(text.replace(unused, "", 1), encoding="utf-8")
      - name: Verify corrected files with Ruff
        run: |
          python -m pip install ruff
          python -m ruff check \
            catalog/federation/former_primary_completion.py \
            catalog/federation/former_primary_repair.py \
            catalog/federation/tests/test_phase_e78_former_primary_completion.py \
            --ignore I001,RUF022,B008,C408,PLC0206
      - name: Commit verified corrections and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/phase-e-fix-ruff.yml
          git add \
            catalog/federation/former_primary_completion.py \
            catalog/federation/former_primary_repair.py \
            catalog/federation/tests/test_phase_e78_former_primary_completion.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix Phase E Ruff findings"
          git push origin HEAD:agent/complete-phase-e-recovery
