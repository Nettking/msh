name: Apply exact Phase E protocol-test fix

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - ".phase-e-test-fix.py"
      - ".github/workflows/phase-e-test-fix.yml"

permissions:
  contents: write

concurrency:
  group: phase-e-test-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply verified replacement
        run: python .phase-e-test-fix.py
      - name: Commit test correction
        shell: bash
        run: |
          set -euo pipefail
          git rm .phase-e-test-fix.py
          git add catalog/federation/tests/test_phase_e72_former_primary_transfer.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Align Phase E forged response test with protocol"
          git push origin HEAD:agent/complete-phase-e-recovery
