name: CF7-A acceptance harness

on:
  pull_request:
    paths:
      - ".github/workflows/cf7-acceptance-harness.yml"
      - "catalog/federation/tests/cf7_acceptance/**"
      - "docs/implementation/cf7_acceptance_harness.md"
      - "catalog/federation/onboarding_models.py"
      - "catalog/federation/onboarding_compat.py"
      - "catalog/federation/onboarding_discovery/**"
      - "catalog/capabilities/benchmarking/**"
      - "catalog/capabilities/contributions/**"
      - "catalog/federation/projections/**"
      - "catalog/flask_app/app.py"
      - "catalog/flask_app/federation_routes.py"
      - "catalog/flask_app/services/federation_projection_service.py"
      - "catalog/flask_app/templates/federation_overview.html"
      - "catalog/flask_app/tests/test_federation_overview_route.py"
  push:
    branches:
      - main
      - "agent/cf7a-*"
    paths:
      - ".github/workflows/cf7-acceptance-harness.yml"
      - "catalog/federation/tests/cf7_acceptance/**"
      - "docs/implementation/cf7_acceptance_harness.md"
      - "catalog/federation/onboarding_models.py"
      - "catalog/federation/onboarding_compat.py"
      - "catalog/federation/onboarding_discovery/**"
      - "catalog/capabilities/benchmarking/**"
      - "catalog/capabilities/contributions/**"
      - "catalog/federation/projections/**"
      - "catalog/flask_app/app.py"
      - "catalog/flask_app/federation_routes.py"
      - "catalog/flask_app/services/federation_projection_service.py"
      - "catalog/flask_app/templates/federation_overview.html"
      - "catalog/flask_app/tests/test_federation_overview_route.py"

permissions:
  contents: read

concurrency:
  group: cf7a-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest ruff
      - name: Compile CF7-A harness
        run: >-
          python -m compileall -q
          catalog/federation/tests/cf7_acceptance
      - name: Parse scenario manifest
        run: >-
          python -c "import json, pathlib;
          path = pathlib.Path('catalog/federation/tests/cf7_acceptance/scenarios.json');
          manifest = json.loads(path.read_text(encoding='utf-8'));
          executable = {item['id'] for item in manifest['executable_now']};
          blocked = {item['id'] for item in manifest['blocked_by_cfi']};
          manual = {item['id'] for item in manifest['manual_physical_verification']};
          assert manifest['acceptance_claim'] == 'foundation-only';
          assert manifest['federation_v1_end_to_end_accepted'] is False;
          assert manifest['capability_first_onboarding_end_to_end_accepted'] is False;
          assert 'cfi1.read-only-federation-overview-route' in executable;
          assert 'cf2b.isolated-concrete-benchmark-adapters' in executable;
          assert 'product.benchmark-run-skip-rerun-through-flask-onboarding' in blocked;
          assert 'physical.mobile-and-desktop-browser-review' in manual"
      - name: Run CF7-A harness scenarios
        run: >-
          python -m pytest -o addopts= -q
          catalog/federation/tests/cf7_acceptance
      - name: Run CF1 contract regressions
        run: >-
          python -m pytest -o addopts= -q
          catalog/federation/tests/test_onboarding_contracts.py
      - name: Run CF2-A isolated benchmark-engine regressions
        run: >-
          python -m pytest -o addopts= -q
          catalog/capabilities/tests
          -k "benchmarking and not adapters"
      - name: Run CF2-B isolated concrete-adapter regressions
        run: >-
          python -m pytest -o addopts= -q
          catalog/capabilities/tests/test_benchmarking_adapters.py
      - name: Run CF3 discovery and join regressions
        run: >-
          python -m pytest -o addopts= -q
          catalog/federation/tests/test_onboarding_discovery_service.py
      - name: Run CF4 contribution service regressions
        run: >-
          python -m pytest -o addopts= -q
          catalog/capabilities/contributions/tests
      - name: Run CF5 UI shell regressions
        run: >-
          python -m pytest -o addopts= -q
          catalog/flask_app/tests/test_cf5_ui_shell.py
      - name: Run CFI-1 read-only Federation overview regressions
        run: >-
          python -m pytest -o addopts= -q
          catalog/flask_app/tests/test_federation_overview_route.py
      - name: Run CF6 projection regressions
        run: >-
          python -m pytest -o addopts= -q
          catalog/federation/tests/test_federation_projections.py
      - name: Run focused Federation authority regressions
        run: >-
          python -m pytest -o addopts= -q
          catalog/federation/tests/test_phase2_unit.py
      - name: Ruff CF7-A harness
        run: >-
          python -m ruff check
          catalog/federation/tests/cf7_acceptance
      - name: Diff hygiene
        shell: bash
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi
