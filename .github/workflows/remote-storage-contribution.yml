name: Remote storage contribution

on:
  push:
    branches: ['**']
    paths:
      - "catalog/flask_app/services/local_capability_candidates.py"
      - "catalog/flask_app/tests/test_remote_storage_contribution.py"
      - ".github/workflows/remote-storage-contribution.yml"
permissions:
  contents: read

jobs:
  remote-storage-contribution:
    if: github.repository_id == '1033058161'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: [self-hosted, Linux, X64, fcp-linux-fast]
            shell: bash
          - os: Windows
            runner: [self-hosted, Windows, X64, fcp-windows]
            shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/self-hosted-python
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest==9.1.1 ruff==0.16.3
      - name: Compile
        run: >-
          python -m compileall
          catalog/flask_app/services/local_capability_candidates.py
          catalog/flask_app/tests/test_remote_storage_contribution.py
      - name: Ubuntu storage precondition
        if: runner.os == 'Linux'
        uses: ./.github/actions/ubuntu-storage-precondition
      - name: Test joined-device storage intent
        run: >-
          python -m pytest -o addopts= -q
          catalog/flask_app/tests/test_remote_storage_contribution.py
          catalog/flask_app/tests/test_local_capability_candidates.py
      - name: Ruff
        run: >-
          python -m ruff check
          catalog/flask_app/services/local_capability_candidates.py
          catalog/flask_app/tests/test_remote_storage_contribution.py
          --ignore I001,RUF022,B008,C408,PLC0206,UP035
