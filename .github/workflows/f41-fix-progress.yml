name: Fix F4.1 progress semantics

on:
  push:
    branches:
      - agent/phase-f41-live-former-primary-catchup
    paths:
      - ".github/workflows/f41-fix-progress.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-f41-live-former-primary-catchup
          fetch-depth: 0
      - name: Preserve attempts and exact report evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('catalog/federation/live_catchup.py')
          text = path.read_text()
          if 'from collections import Counter\n' not in text:
              text = text.replace(
                  'import sqlite3\nimport uuid\n',
                  'import sqlite3\nimport uuid\nfrom collections import Counter\n',
                  1,
              )
          text = text.replace(
              '''                record = self.catchup_store.save(\n                    replace(record, updated_at=self.clock())\n                )\n                try:\n''',
              '''                record = self.catchup_store.save(\n                    replace(record, updated_at=self.clock())\n                )\n                current = self._item(record, current.item_id)\n                try:\n''',
              1,
          )
          text = text.replace(
              '''            or set(report.committed_item_hashes)\n            != {item.content_hash for item in verifying.items}\n''',
              '''            or Counter(report.committed_item_hashes)\n            != Counter(item.content_hash for item in verifying.items)\n''',
              1,
          )
          text = text.replace(
              '''                        StorageErrorCode.STALE_FENCING_TOKEN.value,\n                    }\n''',
              '''                        StorageErrorCode.STALE_FENCING_TOKEN.value,\n                        StorageErrorCode.INVALID_REQUEST.value,\n                    }\n''',
              1,
          )
          path.write_text(text)

          agent = Path('catalog/node/live_storage_agent.py')
          text = agent.read_text().replace(
              '        self.storage.service.recovery_authority_node_id = (control_authority_node_id)\n',
              '        self.storage.service.recovery_authority_node_id = control_authority_node_id\n',
              1,
          )
          agent.write_text(text)

          workflow = Path('.github/workflows/phase2-federation.yml')
          text = workflow.read_text()
          anchor = '          catalog/node/tests/test_live_storage_failover.py\n'
          addition = anchor + '          catalog/node/tests/test_live_storage_catchup.py\n'
          if addition not in text:
              text = text.replace(anchor, addition, 1)
          workflow.write_text(text)
          PY
          python -m py_compile catalog/federation/live_catchup.py catalog/node/live_storage_agent.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/federation/live_catchup.py catalog/node/live_storage_agent.py .github/workflows/phase2-federation.yml
          git commit -m "Preserve F4.1 progress and exact evidence"
          git push origin HEAD:agent/phase-f41-live-former-primary-catchup
