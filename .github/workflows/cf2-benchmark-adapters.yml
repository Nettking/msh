name: CF2 benchmark adapters

on:
  pull_request:
    paths:
      - ".github/workflows/cf2-benchmark-adapters.yml"
      - "catalog/capabilities/benchmarking/**"
      - "catalog/capabilities/tests/test_benchmarking_*.py"
      - "catalog/federation/tests/test_onboarding_contracts.py"
  push:
    branches:
      - main
      - "agent/cf2-*"
    paths:
      - ".github/workflows/cf2-benchmark-adapters.yml"
      - "catalog/capabilities/benchmarking/**"
      - "catalog/capabilities/tests/test_benchmarking_*.py"
      - "catalog/federation/tests/test_onboarding_contracts.py"

permissions:
  contents: read

concurrency:
  group: cf2-benchmark-adapters-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapters:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest ruff
      - name: Compile CF2 adapters
        run: >-
          python -m compileall -q
          catalog/capabilities/benchmarking
          catalog/capabilities/tests/test_benchmarking_adapters.py
      - name: Run CF1 and CF2 regression tests
        run: >-
          python -m pytest -o addopts= -q
          catalog/federation/tests/test_onboarding_contracts.py
          catalog/capabilities/tests/test_benchmarking_registry.py
          catalog/capabilities/tests/test_benchmarking_inspection.py
          catalog/capabilities/tests/test_benchmarking_runner.py
          catalog/capabilities/tests/test_benchmarking_store_and_validity.py
          catalog/capabilities/tests/test_benchmarking_adapters.py
      - name: Ruff CF2 adapters
        run: >-
          python -m ruff check
          catalog/capabilities/benchmarking
          catalog/capabilities/tests/test_benchmarking_adapters.py
      - name: Diff hygiene
        shell: bash
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi
