name: B01 Federated JSONL admission

on:
  pull_request:
    paths:
      - ".github/workflows/b01-federated-jsonl-admission.yml"
      - "catalog/federation/host_resources.py"
      - "catalog/federation/process_resource_admission.py"
      - "catalog/federation/resource_override.py"
      - "catalog/federation/stable_filesystem.py"
      - "catalog/federation/_stable_filesystem_impl.py"
      - "catalog/federation/tests/test_host_resource_admission_serialization.py"
      - "catalog/federation/tests/test_process_resource_admission_serialization.py"
      - "catalog/federation/tests/test_stable_filesystem.py"
      - "catalog/flask_app/services/federated_jsonl_product_bridge.py"
      - "catalog/flask_app/services/_federated_jsonl_product_bridge_impl.py"
      - "catalog/flask_app/tests/test_federated_jsonl_resource_admission.py"
      - "catalog/flask_app/tests/test_federated_jsonl_staged_boundary.py"
      - "catalog/federation/tests/test_resource_overrides.py"
      - "catalog/flask_app/auth/policy.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b01-federated-jsonl-admission-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admission:
    name: Admission boundary (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest ruff

      - name: Compile admission boundary
        run: >-
          python -m compileall -q
          catalog/federation/host_resources.py
          catalog/federation/process_resource_admission.py
          catalog/federation/resource_override.py
          catalog/federation/stable_filesystem.py
          catalog/federation/_stable_filesystem_impl.py
          catalog/flask_app/services/federated_jsonl_product_bridge.py
          catalog/flask_app/services/_federated_jsonl_product_bridge_impl.py

      - name: Adversarial admission regressions
        run: >-
          python -m pytest -o addopts= -q
          catalog/federation/tests/test_host_resource_admission_serialization.py
          catalog/federation/tests/test_process_resource_admission_serialization.py
          catalog/federation/tests/test_stable_filesystem.py
          catalog/flask_app/tests/test_federated_jsonl_resource_admission.py
          catalog/flask_app/tests/test_federated_jsonl_staged_boundary.py
          catalog/federation/tests/test_resource_overrides.py

      - name: Ruff admission boundary
        run: >-
          python -m ruff check
          catalog/federation/host_resources.py
          catalog/federation/process_resource_admission.py
          catalog/federation/resource_override.py
          catalog/federation/stable_filesystem.py
          catalog/federation/_stable_filesystem_impl.py
          catalog/federation/tests/test_host_resource_admission_serialization.py
          catalog/federation/tests/test_process_resource_admission_serialization.py
          catalog/federation/tests/test_stable_filesystem.py
          catalog/flask_app/services/federated_jsonl_product_bridge.py
          catalog/flask_app/services/_federated_jsonl_product_bridge_impl.py
          catalog/flask_app/tests/test_federated_jsonl_resource_admission.py
          catalog/flask_app/tests/test_federated_jsonl_staged_boundary.py
          catalog/federation/tests/test_resource_overrides.py
          catalog/flask_app/auth/policy.py
          --ignore I001,RUF022,B008,C408,PLC0206

      - name: Diff hygiene
        shell: bash
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
