name: PR 215 snapshot fix

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  fix-and-test:
    if: github.event.pull_request.number == 215
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-production-readiness-issues-in-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest ruff
      - name: Apply snapshot consistency fix
        run: python tools/pr215_job_snapshot_fix.py
      - name: Lint changed boundaries
        run: >-
          python -m ruff check
          catalog/capabilities/job_store.py
          catalog/flask_app/services/upload_analysis_job_service.py
          catalog/flask_app/tests/test_upload_analysis_jobs.py
          --ignore I001,RUF022,B008,C408,PLC0206,UP035
      - name: Run upload job regressions
        run: >-
          python -m pytest -o addopts= -q
          catalog/flask_app/tests/test_upload_analysis_jobs.py
          catalog/capabilities/tests
      - name: Commit and push fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/capabilities/job_store.py catalog/flask_app/tests/test_upload_analysis_jobs.py
          git diff --cached --check
          git commit -m "Make durable job snapshots transactionally consistent"
          git push origin HEAD:fix-production-readiness-issues-in-pipeline
