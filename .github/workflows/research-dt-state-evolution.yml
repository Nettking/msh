name: Research DT state semantics evolution

on:
  workflow_dispatch:
  push:
    branches:
      - research/state-semantics-evolution-2026
    paths:
      - research/state_semantics_evolution_2026/**
      - .github/workflows/research-dt-state-evolution.yml

permissions:
  contents: read

concurrency:
  group: research-dt-state-evolution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-semantic-regression:
    if: github.repository_id == '1033058161'
    runs-on: [self-hosted, Linux, X64, fcp-linux-fast]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/self-hosted-python
        with:
          python-version: "3.12"
      - name: Install focused research dependencies
        run: python -m pip install -c constraints-release.txt numpy pandas pytest
      - name: Compile research harness
        run: python -m compileall -q research/state_semantics_evolution_2026
      - name: Run synthetic tests against the production classifier
        run: python -m pytest -o addopts= -q research/state_semantics_evolution_2026/test_evolution.py
