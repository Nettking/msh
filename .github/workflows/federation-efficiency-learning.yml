name: Federation execution efficiency learning

on:
  push:
    branches: ['**']
    paths:
      - "catalog/capabilities/**"
      - "catalog/orchestrator/analysis_runtime.py"
      - "catalog/orchestrator/tests/test_analysis_runtime_integration.py"
      - "catalog/orchestrator/tests/test_federated_discovery.py"
      - "catalog/flask_app/federation_routes.py"
      - "catalog/flask_app/tests/test_federation_efficiency_route.py"
      - "docs/implementation/federation_execution_efficiency_learning.md"
      - ".github/workflows/federation-efficiency-learning.yml"
permissions:
  contents: read

concurrency:
  group: efficiency-learning-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  efficiency-learning:
    if: github.repository_id == '1033058161'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: [self-hosted, Linux, X64, fcp-linux-fast]
            shell: bash
          - os: Windows
            runner: [self-hosted, Windows, X64, fcp-windows]
            shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/self-hosted-python
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install -c constraints-release.txt pytest ruff
      - name: Compile the capability domain
        run: >-
          python -m compileall
          catalog/capabilities
          catalog/orchestrator/analysis_runtime.py
      - name: Ubuntu storage precondition
        if: runner.os == 'Linux'
        uses: ./.github/actions/ubuntu-storage-precondition
      - name: Efficiency learning contracts, store, ranking and simulation
        run: >-
          python -m pytest -o addopts= -q
          catalog/capabilities/tests/test_efficiency_contracts.py
          catalog/capabilities/tests/test_efficiency_store.py
          catalog/capabilities/tests/test_efficiency_ranking.py
          catalog/capabilities/tests/test_efficiency_recorder.py
          catalog/capabilities/tests/test_efficiency_regressions.py
          catalog/capabilities/tests/test_efficiency_runtime.py
          catalog/capabilities/tests/test_efficiency_learning_simulation.py
          catalog/flask_app/tests/test_federation_efficiency_route.py
      - name: Production analysis integration
        run: >-
          python -m pytest -o addopts= -q
          catalog/orchestrator/tests/test_analysis_runtime_integration.py
          catalog/orchestrator/tests/test_federated_discovery.py
      - name: Existing scheduling behaviour is unchanged
        run: >-
          python -m pytest -o addopts= -q
          catalog/capabilities/tests
          catalog/ai
          catalog/federation/tests/test_phase_e4_selection.py
      - name: Ruff efficiency learning and production integration
        run: >-
          python -m ruff check
          catalog/capabilities/efficiency
          catalog/capabilities/provider_selection.py
          catalog/capabilities/analysis/scheduler.py
          catalog/capabilities/tests/efficiency_harness.py
          catalog/capabilities/tests/test_efficiency_contracts.py
          catalog/capabilities/tests/test_efficiency_store.py
          catalog/capabilities/tests/test_efficiency_ranking.py
          catalog/capabilities/tests/test_efficiency_recorder.py
          catalog/capabilities/tests/test_efficiency_regressions.py
          catalog/capabilities/tests/test_efficiency_runtime.py
          catalog/capabilities/tests/test_efficiency_learning_simulation.py
          catalog/orchestrator/analysis_runtime.py
          catalog/flask_app/federation_routes.py
          catalog/flask_app/tests/test_federation_efficiency_route.py
          --ignore I001,RUF022,B008,C408,PLC0206,UP037,S110
          --output-format=github

  repository-hygiene:
    if: github.repository_id == '1033058161'
    runs-on: [self-hosted, Linux, X64, fcp-linux-fast]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Validate diff hygiene
        run: git diff --check HEAD^ HEAD
