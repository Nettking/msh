name: Phase F6.6.1 circuit relay foundation

on:
  push:
    branches: ['**']
    paths:
      - "cmd/fcp-peer-sidecar/**"
      - "docs/implementation/phase_f661_circuit_relay_foundation.md"
      - ".github/workflows/phase-f661-circuit-relay-foundation.yml"
permissions:
  contents: read

concurrency:
  group: f661-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  circuit-relay-foundation:
    if: github.repository_id == '1033058161'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: [self-hosted, Linux, X64, fcp-linux-fast]
            shell: bash
          - os: Windows
            runner: [self-hosted, Windows, X64, fcp-windows]
            shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: "cmd/fcp-peer-sidecar/go.mod"
          cache: false
      - name: Verify module lock
        working-directory: cmd/fcp-peer-sidecar
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Circuit relay tests
        working-directory: cmd/fcp-peer-sidecar
        run: go test ./... -count=1
      - name: Build sidecar
        working-directory: cmd/fcp-peer-sidecar
        run: go build -trimpath .
      - name: Diff hygiene
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD
