name: Phase F8 trusted provider closeout

on:
  push:
    branches: ['**']
    paths:
      - ".github/actions/**"
      - "catalog/capabilities/**"
      - "catalog/ai/**"
      - "catalog/relay/provider_service.py"
      - "catalog/relay/tests/test_provider_authority_relay.py"
      - "catalog/relay/tests/test_phase_f74_capability_dispatch.py"
      - "catalog/relay/tests/test_phase_f75_retry_cancellation.py"
      - "catalog/relay/tests/test_phase_f83_remote_ai_binding.py"
      - "catalog/relay/tests/test_phase_f84_compute_worker_activation.py"
      - "catalog/relay/tests/test_phase_f86_reconciliation.py"
      - "catalog/relay/tests/test_phase_f87_trusted_provider_closeout.py"
      - "catalog/flask_app/services/federation_contribution_publication.py"
      - "catalog/flask_app/provider_federation_routes.py"
      - "catalog/flask_app/tests/test_federation_contribution_publication.py"
      - "catalog/flask_app/tests/test_provider_federation_surface.py"
      - "catalog/flask_app/tests/test_ai_runtime_integration.py"
      - "catalog/flask_app/tests/test_connected_ai_provider.py"
      - "docs/implementation/phase_f8_plan.md"
      - "docs/implementation/phase_f87_plan.md"
      - "docs/implementation/phase_f8_closeout.md"
      - ".github/workflows/phase-f8-closeout.yml"
      - ".github/workflows/phase-f7-closeout.yml"
      - ".github/workflows/phase2-federation.yml"
permissions:
  contents: read

concurrency:
  group: f8-closeout-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trusted-provider-closeout:
    if: github.repository_id == '1033058161'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: [self-hosted, Linux, X64, fcp-linux-fast]
            shell: bash
          - os: Windows
            runner: [self-hosted, Windows, X64, fcp-windows]
            shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/self-hosted-python
        if: runner.os == 'Linux'
        with:
          python-version: "3.12.13"
      - uses: ./.github/actions/self-hosted-python
        if: runner.os == 'Windows'
        with:
          python-version: "3.12"
      - name: Verify SQLite JSON operator runtime
        run: >-
          python -c "import json, sqlite3, sys;
          db = sqlite3.connect(':memory:');
          assert db.execute('SELECT ? ->> ?', (json.dumps(dict(value=1)), 'value')).fetchone() == (1,);
          print(json.dumps(dict(python=sys.version.split()[0], sqlite=sqlite3.sqlite_version)))"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest ruff==0.16.10
      - name: Ubuntu storage precondition
        if: runner.os == 'Linux'
        uses: ./.github/actions/ubuntu-storage-precondition

      - name: Compile complete F8 boundary
        run: >-
          python -m compileall
          catalog/capabilities
          catalog/ai
          catalog/relay/provider_service.py
          catalog/relay/tests/test_provider_authority_relay.py
          catalog/flask_app/services/federation_contribution_publication.py
          catalog/flask_app/tests/test_federation_contribution_publication.py
          catalog/flask_app/provider_federation_routes.py
          catalog/flask_app/tests/test_provider_federation_surface.py
          catalog/flask_app/tests/test_ai_runtime_integration.py
          catalog/flask_app/tests/test_connected_ai_provider.py
          catalog/relay/tests/test_phase_f74_capability_dispatch.py
          catalog/relay/tests/test_phase_f75_retry_cancellation.py
          catalog/relay/tests/test_phase_f83_remote_ai_binding.py
          catalog/relay/tests/test_phase_f84_compute_worker_activation.py
          catalog/relay/tests/test_phase_f86_reconciliation.py
          catalog/relay/tests/test_phase_f87_trusted_provider_closeout.py
      - name: Complete F8 and affected F7 acceptance matrix
        env:
          TEMP: ${{ runner.os == 'Windows' && format('\\?\{0}', env.FCP_CI_TEST_TEMP) || runner.temp }}
          TMP: ${{ runner.os == 'Windows' && format('\\?\{0}', env.FCP_CI_TEST_TEMP) || runner.temp }}
        run: >-
          python -m pytest -o addopts= -q
          catalog/capabilities/tests
          catalog/ai/tests
          catalog/relay/tests/test_provider_authority_relay.py
          catalog/flask_app/tests/test_federation_contribution_publication.py
          catalog/relay/tests/test_phase_f74_capability_dispatch.py
          catalog/relay/tests/test_phase_f75_retry_cancellation.py
          catalog/relay/tests/test_phase_f83_remote_ai_binding.py
          catalog/relay/tests/test_phase_f84_compute_worker_activation.py
          catalog/relay/tests/test_phase_f86_reconciliation.py
          catalog/relay/tests/test_phase_f87_trusted_provider_closeout.py
          catalog/flask_app/tests/test_provider_federation_surface.py
          catalog/flask_app/tests/test_ai_runtime_integration.py
          catalog/flask_app/tests/test_connected_ai_provider.py
          catalog/federation/tests/test_phase0.py
          catalog/federation/tests/test_phase1.py
          catalog/federation/tests/test_phase2_unit.py
      - name: Ruff complete F8 boundary
        run: >-
          python -m ruff check
          catalog/capabilities
          catalog/ai
          catalog/relay/provider_service.py
          catalog/relay/tests/test_provider_authority_relay.py
          catalog/flask_app/services/federation_contribution_publication.py
          catalog/flask_app/tests/test_federation_contribution_publication.py
          catalog/flask_app/provider_federation_routes.py
          catalog/flask_app/tests/test_provider_federation_surface.py
          catalog/relay/tests/test_phase_f87_trusted_provider_closeout.py
          --ignore I001,RUF022,B008,C408,PLC0206,UP035
      - name: Compose validation
        run: docker compose config --quiet
      - name: Diff hygiene
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD
