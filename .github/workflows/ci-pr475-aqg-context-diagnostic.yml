name: PR475 bounded original-AQG context diagnostic

# Coordination only; never merge into candidate, admission or release contracts.
on:
  push:
    branches: [codex/federation-v1-diagnostic-sweep-20260911]
    paths:
      - ".github/workflows/ci-pr475-aqg-context-diagnostic.yml"

permissions:
  contents: read

concurrency:
  group: pr475-original-aqg-diagnostic
  cancel-in-progress: false

jobs:
  original-aqg:
    runs-on: [self-hosted, Linux, X64, aqg7ncc-linux-admission, fcp-test-linux]
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Read-only original-host identity and timing preflight
        run: |
          set -euo pipefail
          evidence=$(mktemp -d "${RUNNER_TEMP}/pr475-aqg-evidence.XXXXXX")
          echo "PR475_EVIDENCE=$evidence" >> "$GITHUB_ENV"
          export PR475_EVIDENCE="$evidence"
          /opt/fcp-ci/python/3.12.13/bin/python3.12 -B - <<'PY'
          import datetime, json, os, pathlib, platform, pwd, time
          output = pathlib.Path(os.environ['PR475_EVIDENCE'])
          receipt = {'recorded_at': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                     'host': platform.node(), 'runner': os.environ['RUNNER_NAME'],
                     'uid': os.getuid(), 'user': pwd.getpwuid(os.getuid()).pw_name,
                     'kernel': platform.release(), 'python': platform.python_version(),
                     'control_sha': os.environ['GITHUB_SHA'], 'protected_recorder_data': 'UNTOUCHED',
                     'diagnostic_only': True, 'host_configuration_changed': False,
                     'temporary_evidence_directory_created': True}
          try:
              assert os.environ['GITHUB_REPOSITORY'] == 'Nettking/msh'
              assert os.environ['GITHUB_REF'] == 'refs/heads/codex/federation-v1-diagnostic-sweep-20260911'
              assert receipt['runner'] == 'AQG7NCC-Linux' and receipt['host'].lower() == 'aqg7ncc'
              assert receipt['user'] == 'fcp-ci-aqg7ncc' and receipt['python'] == '3.12.13'
              workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
              assert workspace.resolve() == pathlib.Path('/home/fcp-ci-aqg7ncc/actions-runner/_work/msh/msh')
              registration = json.loads(pathlib.Path('/home/fcp-ci-aqg7ncc/actions-runner/.runner').read_text())
              assert registration['agentId'] == 31 and registration['agentName'] == 'AQG7NCC-Linux'
              assert registration['workFolder'] == '_work'
              receipt['runner_id'] = registration['agentId']
              receipt['cpu_count'] = os.cpu_count()
              receipt['memory'] = [line for line in pathlib.Path('/proc/meminfo').read_text().splitlines()
                                   if line.split(':')[0] in {'MemTotal', 'MemAvailable', 'SwapTotal', 'SwapFree'}]
              receipt['pressure'] = {name: pathlib.Path('/proc/pressure', name).read_text()
                                     for name in ('cpu', 'memory', 'io') if pathlib.Path('/proc/pressure', name).exists()}
              receipt['clock_samples'] = []
              for _ in range(40):
                  receipt['clock_samples'].append({'wall_ns': time.time_ns(), 'monotonic_ns': time.monotonic_ns()})
                  time.sleep(0.05)
              receipt['status'] = 'PREFLIGHT_VERIFIED'
          except Exception as error:
              receipt['status'] = 'FAILED_CLOSED'
              receipt['error_type'] = type(error).__name__
              raise
          finally:
              (output/'host.json').write_text(json.dumps(receipt, indent=2)+'\n', encoding='utf-8')
          PY

      - uses: actions/checkout@v4
        with:
          ref: 5e6f184311019b9982e8544a18f3dc02c1b16e98
          set-safe-directory: false

      - uses: ./.github/actions/self-hosted-python
        with:
          python-version: 3.12.13

      - name: Install unchanged constrained diagnostic dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements.txt -c constraints-release.txt
          python -m pip install pytest==9.1.1 pytest-randomly==4.1.0 -c constraints-release.txt

      - name: Extract exact reviewed observer and original order receipt
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          python -B - <<'PY'
          import os, pathlib, subprocess
          root = pathlib.Path(os.environ['PR475_EVIDENCE'])
          for name in ('pr475_context_observer.py', 'run_pr475_seeded_context.py', 'D14-D15-native-order-context.json'):
              data = subprocess.check_output(['git', 'show', os.environ['GITHUB_SHA']+':handoff/diagnostics/'+name], timeout=30)
              (root/name).write_bytes(data)
          PY

      - name: Run D14 once then independent D15 only if D14 passes
        env:
          PR475_CONTEXT_MODE: aqg-ci
        run: |
          set -euo pipefail
          python -B "$PR475_EVIDENCE/run_pr475_seeded_context.py" D14
          python -B "$PR475_EVIDENCE/run_pr475_seeded_context.py" D15

      - name: Preserve original-host evidence on every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr475-aqg-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PR475_EVIDENCE }}
          if-no-files-found: error
          retention-days: 30
