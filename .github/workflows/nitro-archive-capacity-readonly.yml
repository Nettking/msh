name: Observe second Beast test failure state read-only
on:
  push:
    branches: [codex/bootstrap-second-failure-state]
    paths:
      - .github/workflows/nitro-archive-capacity-readonly.yml
      - scripts/inspect_second_failure_state.py
permissions:
  contents: read
  actions: read
concurrency:
  group: bootstrap-second-failure-state-35779391870-once
  cancel-in-progress: false
jobs:
  observe:
    name: Observe new failed fixture state once
    if: >-
      github.repository == 'Nettking/msh' && github.actor == 'Nettking' &&
      github.triggering_actor == 'Nettking' && github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/bootstrap-second-failure-state' && github.run_attempt == 1
    runs-on: [self-hosted, beast-windows, fcp-test-windows]
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read exact new failed-fixture consensus files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B scripts/inspect_second_failure_state.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain separate read-only observation on Nitro
        if: ${{ always() && env.FCP_SECOND_FAILURE_PUBLIC != '' }}
        uses: ./.github/actions/nitro-artifact
        with:
          operation: upload
          ssh-key: ${{ secrets.NITRO_ARTIFACT_SSH_KEY }}
          host: ${{ vars.NITRO_ARTIFACT_HOST }}
          known-hosts: ${{ vars.NITRO_ARTIFACT_KNOWN_HOSTS }}
          matrix: '{"purpose":"second-failure-state","original_run":"35779391870"}'
          job-status: ${{ job.status }}
          name: readonly-second-failure-state-35779391870
          path: ${{ env.FCP_SECOND_FAILURE_PUBLIC }}
