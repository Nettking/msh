name: Recover existing Beast bootstrap research evidence
on:
  push:
    branches: [codex/bootstrap-repro-evidence-recovery]
    paths:
      - .github/workflows/nitro-archive-capacity-readonly.yml
      - scripts/recover_bootstrap_reproduction_evidence.py
permissions:
  contents: read
  actions: read
concurrency:
  group: bootstrap-repro-evidence-recovery-35779391870-once
  cancel-in-progress: false
jobs:
  recover:
    name: Recover existing bootstrap observation once
    if: >-
      github.repository == 'Nettking/msh' && github.actor == 'Nettking' &&
      github.triggering_actor == 'Nettking' && github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/bootstrap-repro-evidence-recovery' && github.run_attempt == 1
    runs-on: [self-hosted, beast-windows, fcp-test-windows]
    timeout-minutes: 5
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify and preserve exactly ten existing public files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B scripts/recover_bootstrap_reproduction_evidence.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Archive separate recovery namespace on Nitro
        if: ${{ always() && env.FCP_BOOTSTRAP_RECOVERY_OUT != '' }}
        uses: ./.github/actions/nitro-artifact
        with:
          operation: upload
          ssh-key: ${{ secrets.NITRO_ARTIFACT_SSH_KEY }}
          host: ${{ vars.NITRO_ARTIFACT_HOST }}
          known-hosts: ${{ vars.NITRO_ARTIFACT_KNOWN_HOSTS }}
          matrix: '{"purpose":"readonly-recovery","original_run":"35779391870"}'
          job-status: ${{ job.status }}
          name: readonly-bootstrap-reproduction-recovery-35779391870
          path: ${{ env.FCP_BOOTSTRAP_RECOVERY_OUT }}
