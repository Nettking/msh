name: Temporary SQLite schema refactor

on:
  push:
    branches:
      - agent/sqlite-schema-migrations-pr

permissions:
  contents: write

jobs:
  refactor-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply asserted source transformation
        run: python .github/scripts/apply_sqlite_schema_refactor.py
      - name: Install focused test dependencies
        run: python -m pip install pytest ruff
      - name: Format, compile, and lint touched Python
        run: |
          python -m ruff format \
            catalog/federation/sqlite_schema.py \
            catalog/federation/local_storage.py \
            catalog/federation/commit_tracking.py \
            catalog/federation/tests/test_sqlite_schema.py \
            catalog/federation/tests/test_sqlite_schema_adoption.py
          python -m compileall \
            catalog/federation/sqlite_schema.py \
            catalog/federation/local_storage.py \
            catalog/federation/commit_tracking.py \
            catalog/federation/tests/test_sqlite_schema.py \
            catalog/federation/tests/test_sqlite_schema_adoption.py
          python -m ruff check \
            catalog/federation/sqlite_schema.py \
            catalog/federation/local_storage.py \
            catalog/federation/commit_tracking.py \
            catalog/federation/tests/test_sqlite_schema.py \
            catalog/federation/tests/test_sqlite_schema_adoption.py
          git diff --check
      - name: Run focused SQLite and storage regressions
        run: |
          python -m pytest -o addopts= -q \
            catalog/federation/tests/test_sqlite_schema.py \
            catalog/federation/tests/test_sqlite_schema_adoption.py \
            catalog/federation/tests/test_local_storage.py \
            catalog/federation/tests/test_outbox_compaction.py \
            catalog/federation/tests/test_phase_d7_d8_ack_handover.py \
            catalog/federation/tests/test_phase_e1_service_manifest.py
      - name: Commit only validated product changes
        run: |
          git add \
            catalog/federation/sqlite_schema.py \
            catalog/federation/local_storage.py \
            catalog/federation/commit_tracking.py \
            catalog/federation/tests/test_sqlite_schema.py \
            catalog/federation/tests/test_sqlite_schema_adoption.py
          if git diff --cached --quiet; then
            echo "No validated product changes were produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Version Federation SQLite schemas"
          git push origin "HEAD:${GITHUB_REF_NAME}"
