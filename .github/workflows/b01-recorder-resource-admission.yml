name: B01 recorder resource admission

on:
  pull_request:
    paths:
      - "catalog/mtconnect_recorder/**"
      - "catalog/federation/process_resource_admission.py"
      - ".github/workflows/b01-recorder-resource-admission.yml"
  workflow_dispatch:

jobs:
  recorder-resource-admission:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest ruff
      - name: Recorder admission regressions
        run: >-
          python -m pytest -q
          catalog/mtconnect_recorder/tests/test_resource_pressure_process_wide.py
          catalog/mtconnect_recorder/tests/test_recorder_resource_pressure.py
          catalog/mtconnect_recorder/tests/test_recorder_storage_exhaustion_pause.py
      - name: Ruff
        run: >-
          python -m ruff check
          catalog/mtconnect_recorder/resource_pressure.py
          catalog/mtconnect_recorder/tests/test_resource_pressure_process_wide.py
          catalog/mtconnect_recorder/tests/test_recorder_storage_exhaustion_pause.py
      - name: Diff hygiene
        shell: bash
        run: git diff --check origin/main...HEAD
