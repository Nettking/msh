name: B01 recorder resource admission

on:
  push:
    branches: ['**']
    paths:
      - "catalog/mtconnect_recorder/**"
      - "catalog/federation/process_resource_admission.py"
      - ".github/workflows/b01-recorder-resource-admission.yml"
  workflow_dispatch:

jobs:
  recorder-resource-admission:
    if: github.repository_id == '1033058161'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: [self-hosted, Linux, X64, fcp-linux-fast]
            shell: bash
          - os: Windows
            runner: [self-hosted, Windows, X64, fcp-windows]
            shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/self-hosted-python
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest==9.1.1 ruff==0.16.3
      - name: Ubuntu storage precondition
        if: runner.os == 'Linux'
        uses: ./.github/actions/ubuntu-storage-precondition
      - name: Recorder admission regressions
        run: >-
          python -m pytest -q
          catalog/mtconnect_recorder/tests/test_resource_pressure_process_wide.py
          catalog/mtconnect_recorder/tests/test_recorder_resource_pressure.py
          catalog/mtconnect_recorder/tests/test_recorder_storage_exhaustion_pause.py
      - name: Ruff
        run: >-
          python -m ruff check
          catalog/mtconnect_recorder/resource_pressure.py
          catalog/mtconnect_recorder/tests/test_resource_pressure_process_wide.py
          catalog/mtconnect_recorder/tests/test_recorder_storage_exhaustion_pause.py
      - name: Diff hygiene
        shell: bash
        run: git diff --check origin/main...HEAD
