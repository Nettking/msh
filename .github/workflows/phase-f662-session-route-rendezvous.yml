name: Phase F6.6.2 session route rendezvous

on:
  push:
    branches: ['**']
    paths:
      - "catalog/federation/session_route_rendezvous.py"
      - "catalog/node/route_rendezvous.py"
      - "catalog/relay/route_rendezvous.py"
      - "catalog/relay/tests/test_phase_f662_route_rendezvous.py"
      - "docs/implementation/phase_f662_session_route_rendezvous.md"
      - ".github/workflows/phase-f662-session-route-rendezvous.yml"
permissions:
  contents: read

concurrency:
  group: f662-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  session-route-rendezvous:
    if: github.repository_id == '1033058161'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: [self-hosted, Linux, X64, fcp-linux-fast]
            shell: bash
          - os: Windows
            runner: [self-hosted, Windows, X64, fcp-windows]
            shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/self-hosted-python
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest ruff
      - name: Compile F6.6.2 boundary
        run: |
          python -m compileall catalog/federation/session_route_rendezvous.py catalog/node/route_rendezvous.py catalog/relay/route_rendezvous.py catalog/relay/tests/test_phase_f662_route_rendezvous.py
      - name: Ubuntu storage precondition
        if: runner.os == 'Linux'
        uses: ./.github/actions/ubuntu-storage-precondition
      - name: Session route rendezvous tests
        run: python -m pytest -o addopts= -q catalog/relay/tests/test_phase_f662_route_rendezvous.py
      - name: Ruff F6.6.2 boundary
        run: python -m ruff check catalog/federation/session_route_rendezvous.py catalog/node/route_rendezvous.py catalog/relay/route_rendezvous.py catalog/relay/tests/test_phase_f662_route_rendezvous.py --ignore I001,RUF022,B008,C408,PLC0206
      - name: Diff hygiene
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD
