name: Bind F5.1 report to live relay evidence

on:
  pull_request:
    paths:
      - ".github/workflows/f51-bind-relay-evidence.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Require connected ready storage nodes
        run: |
          python - <<'PY'
          from pathlib import Path

          deployment_path = Path("catalog/node/storage_deployment.py")
          text = deployment_path.read_text(encoding="utf-8")
          old = '''    check(\n        "not-degraded",\n        control.get("degraded_state") is None,\n        "F5.1 ends in normal redundant operation",\n    )\n\n    def validate_storage(\n'''
          new = '''    check(\n        "not-degraded",\n        control.get("degraded_state") is None,\n        "F5.1 ends in normal redundant operation",\n    )\n    relay = authority.get("relay") if isinstance(authority.get("relay"), dict) else {}\n    relay_nodes = {\n        item.get("node_id"): item\n        for item in relay.get("nodes", [])\n        if isinstance(item, dict)\n    }\n    relay_capabilities = [\n        item\n        for item in relay.get("capabilities", [])\n        if isinstance(item, dict)\n    ]\n    storage_nodes = (deployment.primary, deployment.replica)\n    check(\n        "relay-connections",\n        all(\n            isinstance(relay_nodes.get(node.node_id), dict)\n            and relay_nodes[node.node_id].get("connection_state") == "connected"\n            and relay_nodes[node.node_id].get("revoked") is not True\n            for node in storage_nodes\n        ),\n        "primary and replica have active non-revoked relay connections",\n    )\n    check(\n        "relay-storage-capabilities",\n        all(\n            any(\n                capability.get("node_id") == node.node_id\n                and capability.get("type") == "storage-provider"\n                and capability.get("status") == "ready"\n                and isinstance(capability.get("properties"), dict)\n                and capability["properties"].get("provider_id")\n                == node.provider_id\n                for capability in relay_capabilities\n            )\n            for node in storage_nodes\n        ),\n        "primary and replica advertise ready storage capabilities",\n    )\n\n    def validate_storage(\n'''
          assert text.count(old) == 1
          deployment_path.write_text(text.replace(old, new), encoding="utf-8")

          test_path = Path("catalog/node/tests/test_three_machine_deployment.py")
          test = test_path.read_text(encoding="utf-8")
          old = '''def _authority_evidence(\n    deployment: ThreeMachineDeployment,\n    control: PhaseDControlPlane,\n) -> dict[str, object]:\n'''
          new = '''def _authority_evidence(\n    deployment: ThreeMachineDeployment,\n    control: PhaseDControlPlane,\n    relay_status: dict[str, object],\n) -> dict[str, object]:\n'''
          assert test.count(old) == 1
          test = test.replace(old, new)
          old = '''        "relay": {"nodes": [], "capabilities": []},\n'''
          new = '''        "relay": {\n            "nodes": relay_status.get("nodes", []),\n            "capabilities": relay_status.get("capabilities", []),\n        },\n'''
          assert test.count(old) == 1
          test = test.replace(old, new)
          old = '''                authority=_authority_evidence(deployment, control),\n'''
          new = '''                authority=_authority_evidence(\n                    deployment,\n                    control,\n                    await authority.coordinator_status(),\n                ),\n'''
          assert test.count(old) == 1
          test_path.write_text(test.replace(old, new), encoding="utf-8")

          docs_path = Path("docs/implementation/phase_f51_three_machine_deployment.md")
          docs = docs_path.read_text(encoding="utf-8")
          old = '''- both providers remain registered and assignable;\n- neither storage node exposes an inbound application port;\n'''
          new = '''- both providers remain registered and assignable;\n- both storage nodes are connected and advertise a `ready` storage capability;\n- neither storage node exposes an inbound application port;\n'''
          assert docs.count(old) == 1
          docs_path.write_text(docs.replace(old, new), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/node/storage_deployment.py catalog/node/tests/test_three_machine_deployment.py docs/implementation/phase_f51_three_machine_deployment.md
          git commit -m "Require live relay evidence for F5.1"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
