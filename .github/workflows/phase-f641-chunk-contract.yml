name: Phase F6.4.1 chunk contract

on:
  push:
    branches: ['**']
    paths:
      - "catalog/federation/object_transfer.py"
      - "catalog/federation/tests/test_phase_f641_chunk_contract.py"
      - ".github/workflows/phase-f641-chunk-contract.yml"
permissions:
  contents: read

concurrency:
  group: f641-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.repository_id == '1033058161'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: [self-hosted, Linux, X64, fcp-linux-fast]
            shell: bash
          - os: Windows
            runner: [self-hosted, Windows, X64, fcp-windows]
            shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/self-hosted-python
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest
      - name: Compile contract
        run: >-
          python -m compileall
          catalog/federation/object_transfer.py
          catalog/federation/tests/test_phase_f641_chunk_contract.py
      - name: Ubuntu storage precondition
        if: runner.os == 'Linux'
        uses: ./.github/actions/ubuntu-storage-precondition
      - name: F6.4.1 contract tests
        run: >-
          python -m pytest -o addopts= -q
          catalog/federation/tests/test_phase_f641_chunk_contract.py
