name: Phase F6.4.1 chunk contract

on:
  pull_request:
    paths:
      - "catalog/federation/object_transfer.py"
      - "catalog/federation/tests/test_phase_f641_chunk_contract.py"
      - ".github/workflows/phase-f641-chunk-contract.yml"
  push:
    branches: [main]
    paths:
      - "catalog/federation/object_transfer.py"
      - "catalog/federation/tests/test_phase_f641_chunk_contract.py"
      - ".github/workflows/phase-f641-chunk-contract.yml"

permissions:
  contents: read

concurrency:
  group: f641-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest
      - name: Compile contract
        run: >-
          python -m compileall
          catalog/federation/object_transfer.py
          catalog/federation/tests/test_phase_f641_chunk_contract.py
      - name: F6.4.1 contract tests
        run: >-
          python -m pytest -o addopts= -q
          catalog/federation/tests/test_phase_f641_chunk_contract.py
