name: Phase 2 federation

on:
  pull_request:
    paths:
      - "catalog/federation/**"
      - "catalog/node/**"
      - ".github/workflows/phase2-federation.yml"

permissions:
  contents: write

jobs:
  apply-f41-report-semantics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-f41-live-former-primary-catchup
          fetch-depth: 0
      - name: Bind F4.1 evidence to the expected unassigned assessment
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('catalog/federation/live_catchup.py')
          text = path.read_text()
          old = '''        if not assessment.accepted:\n            raise FederationValidationError(\n                "live-catchup-final-report-rejected",\n                "report",\n                assessment.eligibility_reason,\n            )\n'''
          if old not in text:
              raise SystemExit('final assessment anchor missing')
          text = text.replace(old, '', 1)
          old = '''        assessment = self.control_plane.submit_storage_replica_report(\n            report,\n            actor_node_id=binding["returning"].node_id,\n        )\n        return report, assessment\n'''
          new = '''        assessment = self.control_plane.submit_storage_replica_report(\n            report,\n            actor_node_id=binding["returning"].node_id,\n        )\n        if (\n            assessment.accepted\n            or assessment.eligibility\n            or assessment.eligibility_reason != "provider-not-assigned"\n        ):\n            raise FederationValidationError(\n                "live-catchup-report-assignment-changed",\n                "assessment",\n                (\n                    "F4.1 requires a registered provider that remains "\n                    "unassigned throughout catch-up"\n                ),\n            )\n        if (\n            assessment.report is None\n            or assessment.report_hash != report.report_hash()\n            or assessment.report.to_dict() != report.to_dict()\n        ):\n            raise FederationValidationError(\n                "live-catchup-report-persistence-mismatch",\n                "assessment",\n                "persisted assessment is not bound to the authenticated report",\n            )\n        return report, assessment\n'''
          if old not in text:
              raise SystemExit('report persistence anchor missing')
          path.write_text(text.replace(old, new, 1))

          test = Path('catalog/node/tests/test_live_storage_catchup.py')
          test_text = test.read_text()
          old = '''            assert assessment is not None\n            assert assessment.accepted\n            assert assessment.report is not None\n'''
          new = '''            assert assessment is not None\n            assert not assessment.accepted\n            assert not assessment.eligibility\n            assert assessment.eligibility_reason == "provider-not-assigned"\n            assert assessment.report is not None\n'''
          if old not in test_text:
              raise SystemExit('acceptance assessment anchor missing')
          test.write_text(test_text.replace(old, new, 1))
          PY
          python -m py_compile catalog/federation/live_catchup.py catalog/node/tests/test_live_storage_catchup.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/federation/live_catchup.py catalog/node/tests/test_live_storage_catchup.py
          git commit -m "Accept F4.1 evidence only while provider remains unassigned"
          git push origin HEAD:agent/phase-f41-live-former-primary-catchup
