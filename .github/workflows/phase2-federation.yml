name: Phase 2 federation

on:
  pull_request:
    paths:
      - "catalog/federation/**"
      - "catalog/node/**"
      - ".github/workflows/phase2-federation.yml"

permissions:
  contents: write

jobs:
  persist-f41-final-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-f41-live-former-primary-catchup
          fetch-depth: 0
      - name: Store the full authenticated catch-up report
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('catalog/federation/live_catchup.py')
          text = path.read_text()
          old = '''    final_report_revision: int | None\n    final_report_hash: str | None\n    latest_error_code: str | None\n'''
          new = '''    final_report_revision: int | None\n    final_report_hash: str | None\n    final_report: StorageReplicaReport | None\n    latest_error_code: str | None\n'''
          if old not in text:
              raise SystemExit('record field anchor missing')
          text = text.replace(old, new, 1)

          old = '''        if (self.final_report_revision is None) != (self.final_report_hash is None):\n            raise FederationValidationError(\n                "invalid-live-catchup-final-report",\n                "final_report_revision",\n                "final report revision and hash must appear together",\n            )\n        if self.final_report_revision is not None:\n            object.__setattr__(\n                self,\n                "final_report_revision",\n                _uint(self.final_report_revision, "final_report_revision"),\n            )\n            object.__setattr__(\n                self,\n                "final_report_hash",\n                _text(self.final_report_hash, "final_report_hash"),\n            )\n'''
          new = '''        final_values = (\n            self.final_report_revision,\n            self.final_report_hash,\n            self.final_report,\n        )\n        if any(value is None for value in final_values) and not all(\n            value is None for value in final_values\n        ):\n            raise FederationValidationError(\n                "invalid-live-catchup-final-report",\n                "final_report",\n                "final report, revision, and hash must appear together",\n            )\n        if self.final_report is not None:\n            object.__setattr__(\n                self,\n                "final_report_revision",\n                _uint(self.final_report_revision, "final_report_revision"),\n            )\n            object.__setattr__(\n                self,\n                "final_report_hash",\n                _text(self.final_report_hash, "final_report_hash"),\n            )\n            report = self.final_report\n            if (\n                report.report_revision != self.final_report_revision\n                or report.report_hash() != self.final_report_hash\n                or report.session_id != self.session_id\n                or report.group_id != self.group_id\n                or report.provider_id != self.returning_provider_id\n                or report.manifest_revision != self.manifest_revision\n                or report.manifest_hash != self.manifest_hash\n                or not report.integrity_verified\n                or report.synchronization_state != "synchronized"\n            ):\n                raise FederationValidationError(\n                    "invalid-live-catchup-final-report",\n                    "final_report",\n                    "stored report is not complete and bound to this recovery",\n                )\n'''
          if old not in text:
              raise SystemExit('record validation anchor missing')
          text = text.replace(old, new, 1)

          old = '''            "final_report_revision": self.final_report_revision,\n            "final_report_hash": self.final_report_hash,\n            "latest_error_code": self.latest_error_code,\n'''
          new = '''            "final_report_revision": self.final_report_revision,\n            "final_report_hash": self.final_report_hash,\n            "final_report": (\n                None if self.final_report is None else self.final_report.to_dict()\n            ),\n            "latest_error_code": self.latest_error_code,\n'''
          if old not in text:
              raise SystemExit('record serialization anchor missing')
          text = text.replace(old, new, 1)

          old = '''        restored["items"] = tuple(\n            LiveCatchupItem.from_dict(item) for item in value.get("items", ())\n        )\n        return cls(**restored)\n'''
          new = '''        restored["items"] = tuple(\n            LiveCatchupItem.from_dict(item) for item in value.get("items", ())\n        )\n        final_report = value.get("final_report")\n        restored["final_report"] = (\n            None\n            if final_report is None\n            else StorageReplicaReport.from_dict(final_report)\n        )\n        return cls(**restored)\n'''
          if old not in text:
              raise SystemExit('record restore anchor missing')
          text = text.replace(old, new, 1)

          old = '''            final_report_revision=None,\n            final_report_hash=None,\n            latest_error_code=None if conflict is None else conflict.code,\n'''
          new = '''            final_report_revision=None,\n            final_report_hash=None,\n            final_report=None,\n            latest_error_code=None if conflict is None else conflict.code,\n'''
          if old not in text:
              raise SystemExit('record construction anchor missing')
          text = text.replace(old, new, 1)

          old = '''                final_report_revision=assessment.report_revision,\n                final_report_hash=assessment.report_hash,\n                updated_at=self.clock(),\n'''
          new = '''                final_report_revision=assessment.report_revision,\n                final_report_hash=assessment.report_hash,\n                final_report=report,\n                updated_at=self.clock(),\n'''
          if old not in text:
              raise SystemExit('final record anchor missing')
          path.write_text(text.replace(old, new, 1))

          test = Path('catalog/node/tests/test_live_storage_catchup.py')
          test_text = test.read_text()
          old = '''            assessment = control.latest_storage_replica_assessment(\n                session_id,\n                "storage-main",\n                "provider-primary",\n            )\n            assert assessment is not None\n            assert not assessment.accepted\n            assert not assessment.eligibility\n            assert assessment.eligibility_reason == "provider-not-assigned"\n            assert assessment.report is not None\n            assert assessment.report.integrity_verified\n            assert assessment.report.synchronization_state == "synchronized"\n'''
          new = '''            assert completed.record.final_report is not None\n            assert completed.record.final_report.provider_id == "provider-primary"\n            assert completed.record.final_report.integrity_verified\n            assert (\n                completed.record.final_report.synchronization_state\n                == "synchronized"\n            )\n            assert (\n                completed.record.final_report.report_hash()\n                == completed.record.final_report_hash\n            )\n            assert control.latest_storage_replica_assessment(\n                session_id,\n                "storage-main",\n                "provider-primary",\n            ) is None\n'''
          if old not in test_text:
              raise SystemExit('acceptance evidence anchor missing')
          test.write_text(test_text.replace(old, new, 1))
          PY
          python -m py_compile catalog/federation/live_catchup.py catalog/node/tests/test_live_storage_catchup.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/federation/live_catchup.py catalog/node/tests/test_live_storage_catchup.py
          git commit -m "Persist complete F4.1 final evidence"
          git push origin HEAD:agent/phase-f41-live-former-primary-catchup
