name: Phase 2 federation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/actions/**"
      - "catalog/federation/**"
      - "catalog/node/**"
      - "catalog/relay/**"
      - "cmd/fcp-peer-sidecar/**"
      - "docker-compose.yml"
      - "requirements.txt"
      - "constraints-phase2.txt"
      - ".ruff.toml"
      - ".github/workflows/phase2-federation.yml"
      - ".github/workflows/phase-f6-closeout.yml"
      - ".github/workflows/phase-f7-closeout.yml"
      - "docs/implementation/phase_f6_closeout.md"
      - "docs/implementation/phase_f7_closeout.md"
      - "docs/connected_capabilities.md"
      - "docs/architecture.md"
  push:
    branches: [main]
    paths:
      - ".github/actions/**"
      - "catalog/federation/**"
      - "catalog/node/**"
      - "catalog/relay/**"
      - "cmd/fcp-peer-sidecar/**"
      - "docker-compose.yml"
      - "requirements.txt"
      - "constraints-phase2.txt"
      - ".ruff.toml"
      - ".github/workflows/phase2-federation.yml"
      - ".github/workflows/phase-f6-closeout.yml"
      - ".github/workflows/phase-f7-closeout.yml"
      - "docs/implementation/phase_f6_closeout.md"
      - "docs/implementation/phase_f7_closeout.md"
      - "docs/connected_capabilities.md"
      - "docs/architecture.md"

permissions:
  contents: read
  actions: read # Native job identity for evidence provenance only.

concurrency:
  group: phase2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: [self-hosted, fcp-linux-fast]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Start disposable PostgreSQL 16
        uses: ./.github/actions/self-hosted-postgres
      - uses: ./.github/actions/self-hosted-python
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: "cmd/fcp-peer-sidecar/go.mod"
          cache: false
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest ruff==0.16.10
      - name: Go direct peer sidecar
        working-directory: cmd/fcp-peer-sidecar
        run: |
          go mod tidy
          echo BEGIN_GO_MOD
          cat go.mod
          echo END_GO_MOD
          echo BEGIN_GO_SUM
          cat go.sum
          echo END_GO_SUM
          go test ./...
          mkdir -p ../../build
          go build -trimpath -o ../../build/fcp-peer-sidecar .
      - name: Stage Go module lock evidence
        if: always()
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/f62-go-module-lock-${{ github.run_id }}-a${{ github.run_attempt }}-linux
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          JOB_KEY: ${{ github.job }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          JOB_STATUS: ${{ job.status }}
          MATRIX_JSON: '{}'
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path(os.environ["EVIDENCE_DIR"])
          root.mkdir(parents=True, exist_ok=False)
          sources = {
              "go.mod": Path("cmd/fcp-peer-sidecar/go.mod"),
              "go.sum": Path("cmd/fcp-peer-sidecar/go.sum"),
          }
          checkout_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if checkout_sha != os.environ["SOURCE_SHA"]:
              raise SystemExit("checked-out source SHA does not match the workflow event SHA")
          for name, source in sources.items():
              if not source.is_file():
                  raise SystemExit(f"required evidence is missing: {source}")
              shutil.copy2(source, root / name)
          files = []
          for name, source in sources.items():
              data = (root / name).read_bytes()
              files.append({
                  "path": name,
                  "source_path": source.as_posix(),
                  "size": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              })
          manifest = {
              "schema": "fcp.ci-evidence-manifest.v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_sha": os.environ["SOURCE_SHA"],
              "checkout_sha": checkout_sha,
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "workflow_ref": os.environ["WORKFLOW_REF"],
              "workflow_sha": os.environ["WORKFLOW_SHA"],
              "run_id": os.environ["RUN_ID"],
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "job_key": os.environ["JOB_KEY"],
              "matrix": json.loads(os.environ["MATRIX_JSON"]),
              "runner_name": os.environ["RUNNER_NAME"],
              "runner_os": os.environ["RUNNER_OS"],
              "job_status_at_capture": os.environ["JOB_STATUS"],
              "captured_at_utc": datetime.now(timezone.utc).isoformat(),
              "files": files,
          }
          (root / "archive-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - name: Upload Go module lock evidence
        id: lock_artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f62-go-module-lock-${{ github.run_id }}-a${{ github.run_attempt }}-linux
          path: ${{ runner.temp }}/f62-go-module-lock-${{ github.run_id }}-a${{ github.run_attempt }}-linux/
          if-no-files-found: error
          retention-days: 90
          overwrite: false
      - name: Record Go module lock artifact receipt
        if: always()
        env:
          ARTIFACT_NAME: f62-go-module-lock-${{ github.run_id }}-a${{ github.run_attempt }}-linux
          ARTIFACT_ID: ${{ steps.lock_artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.lock_artifact.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.lock_artifact.outputs.artifact-url }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          JOB_KEY: ${{ github.job }}
          MATRIX_JSON: '{}'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = {
              "artifact_name": os.environ["ARTIFACT_NAME"],
              "artifact_id": os.environ.get("ARTIFACT_ID", ""),
              "artifact_digest": os.environ.get("ARTIFACT_DIGEST", ""),
              "artifact_url": os.environ.get("ARTIFACT_URL", ""),
              "source_sha": os.environ["SOURCE_SHA"],
              "run_id": os.environ["RUN_ID"],
              "run_attempt": int(os.environ["RUN_ATTEMPT"]),
              "job_key": os.environ["JOB_KEY"],
              "matrix": json.loads(os.environ["MATRIX_JSON"]),
          }
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              stream.write("### Go module lock evidence artifact\n\n")
              stream.write("```json\n" + json.dumps(receipt, indent=2, sort_keys=True) + "\n```\n")
          PY
      - name: Ubuntu storage precondition
        uses: ./.github/actions/ubuntu-storage-precondition

      - name: Compile
        run: python -m compileall catalog setup_fcp.py
      - name: Phase 0 and 1 regressions
        run: python -m pytest -o addopts= -q catalog/federation/tests/test_phase0.py catalog/federation/tests/test_phase1.py
      - name: Phase D and E storage tests
        run: >-
          python -m pytest -o addopts= -q
          catalog/federation/tests/test_storage_protocol.py
          catalog/federation/tests/test_local_storage.py
          catalog/federation/tests/test_phase_d2_postgres.py
          catalog/federation/tests/test_phase_d3_control_plane.py
          catalog/federation/tests/test_phase_d4_write_authority.py
          catalog/federation/tests/test_phase_d5_logical_storage.py
          catalog/federation/tests/test_phase_d6_replication.py
          catalog/federation/tests/test_phase_d7_d8_ack_handover.py
          catalog/federation/tests/test_phase_e0_contracts.py
          catalog/federation/tests/test_phase_e1_manifest_store.py
          catalog/federation/tests/test_phase_e1_service_manifest.py
          catalog/federation/tests/test_phase_e2_watermarks.py
          catalog/federation/tests/test_phase_e3_reports.py
          catalog/federation/tests/test_phase_e4_selection.py
          catalog/federation/tests/test_phase_e5_degraded_state.py
          catalog/federation/tests/test_phase_e6_promotion_transaction.py
          catalog/federation/tests/test_phase_e63_provider_fencing.py
          catalog/federation/tests/test_phase_e64_authority_grant.py
          catalog/federation/tests/test_phase_e65_finalization.py
          catalog/federation/tests/test_phase_e66_recovery.py
          catalog/federation/tests/test_phase_e67_coordinator_publication.py
          catalog/federation/tests/test_phase_e71_former_primary_recovery.py
          catalog/federation/tests/test_phase_e72_former_primary_transfer.py
          catalog/federation/tests/test_phase_e78_former_primary_completion.py
      - name: Phase 2 unit and integration tests
        run: python -m pytest -o addopts= -q catalog/federation/tests/test_phase2_unit.py catalog/node/tests catalog/relay/tests
      - name: Ruff federation code
        run: >-
          python -m ruff check catalog/federation catalog/node catalog/relay
          --ignore I001,RUF022,B008,C408,PLC0206
      - name: Compose validation
        run: |
          docker compose config --quiet
          docker compose --profile relay-dev config --quiet
      - name: Diff hygiene
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD

      - name: Remove disposable PostgreSQL 16
        if: always()
        uses: ./.github/actions/self-hosted-postgres
        with:
          operation: stop

  windows:
    runs-on: [self-hosted, fcp-windows]
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/self-hosted-python
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: "cmd/fcp-peer-sidecar/go.mod"
          cache: false
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest
      - name: Go direct peer sidecar
        working-directory: cmd/fcp-peer-sidecar
        run: |
          go mod tidy
          go test ./...
          New-Item -ItemType Directory -Force -Path ../../build
          go build -trimpath -o ../../build/fcp-peer-sidecar.exe .
      - name: Identity, state, protocol, relay, and Phase F tests
        run: >-
          python -m pytest -o addopts= -q
          catalog/node/tests/test_identity.py
          catalog/node/tests/test_state.py
          catalog/node/tests/test_client.py
          catalog/node/tests/test_storage_agent.py
          catalog/node/tests/test_three_machine_deployment.py
          catalog/node/tests/test_physical_storage_failover.py
          catalog/node/tests/test_physical_storage_recovery.py
          catalog/node/tests/test_phase_f61_transport.py
          catalog/node/tests/test_phase_f62_direct_peer.py
          catalog/node/tests/test_phase_f63_relay_loss_continuity.py
          catalog/node/tests/test_live_storage_replication.py
          catalog/node/tests/test_live_storage_failover.py
          catalog/node/tests/test_live_storage_catchup.py
          catalog/node/tests/test_live_storage_reinstatement.py
          catalog/node/tests/test_verified_live_failover.py
          catalog/relay/tests/test_service.py
          catalog/relay/tests/test_leadership_transfer.py
          catalog/federation/tests/test_phase2_unit.py
          catalog/federation/tests/test_storage_protocol.py
          catalog/federation/tests/test_local_storage.py
          catalog/federation/tests/test_phase_d3_control_plane.py
          catalog/federation/tests/test_phase_d4_write_authority.py
          catalog/federation/tests/test_phase_d5_logical_storage.py
          catalog/federation/tests/test_phase_d6_replication.py
          catalog/federation/tests/test_phase_d7_d8_ack_handover.py
          catalog/federation/tests/test_phase_e0_contracts.py
          catalog/federation/tests/test_phase_e1_manifest_store.py
          catalog/federation/tests/test_phase_e1_service_manifest.py
          catalog/federation/tests/test_phase_e2_watermarks.py
          catalog/federation/tests/test_phase_e3_reports.py
          catalog/federation/tests/test_phase_e4_selection.py
          catalog/federation/tests/test_phase_e5_degraded_state.py
          catalog/federation/tests/test_phase_e6_promotion_transaction.py
          catalog/federation/tests/test_phase_e63_provider_fencing.py
          catalog/federation/tests/test_phase_e64_authority_grant.py
          catalog/federation/tests/test_phase_e65_finalization.py
          catalog/federation/tests/test_phase_e66_recovery.py
          catalog/federation/tests/test_phase_e67_coordinator_publication.py
          catalog/federation/tests/test_phase_e71_former_primary_recovery.py
          catalog/federation/tests/test_phase_e72_former_primary_transfer.py
          catalog/federation/tests/test_phase_e78_former_primary_completion.py
