name: B07 bounded growth

# B07 requires FCP-generated histories to bound both retained storage and the
# work one ordinary write may do to maintain them. These are the rings that
# carry that rule.

on:
  push:
    branches: ['**']
    paths:
      - "catalog/federation/persistence.py"
      - "catalog/federation/tests/test_coordinator_audit_ring_bound.py"
      - "catalog/capabilities/provider_health.py"
      - "catalog/capabilities/provider_enrollment.py"
      - "catalog/capabilities/artifact_authority.py"
      - "catalog/capabilities/contributions/store.py"
      - "catalog/capabilities/contributions/tests/test_intent_history_bound.py"
      - "catalog/federation/agent_log.py"
      - "catalog/federation/image_retirement.py"
      - ".github/workflows/b07-bounded-growth.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b07-bounded-growth-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-growth:
    if: github.repository_id == '1033058161'
    name: Bounded growth (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: [self-hosted, Linux, X64, fcp-linux-fast]
            shell: bash
          - os: Windows
            runner: [self-hosted, Windows, X64, fcp-windows]
            shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/self-hosted-python
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest==9.1.1 ruff==0.16.3

      - name: Compile growth boundary
        run: >-
          python -m compileall -q
          catalog/federation/persistence.py
          catalog/capabilities/artifact_authority.py
          catalog/capabilities/contributions/store.py

      - name: Ubuntu storage precondition
        if: runner.os == 'Linux'
        uses: ./.github/actions/ubuntu-storage-precondition

      - name: Bounded growth regressions
        run: >-
          python -m pytest -o addopts= -q
          catalog/federation/tests/test_coordinator_audit_ring_bound.py
          catalog/capabilities/contributions/tests/test_intent_history_bound.py
          catalog/capabilities/contributions/tests/test_contribution_store.py
          catalog/federation/tests/test_agent_log.py
          catalog/federation/tests/test_image_retirement.py

      - name: Ruff growth boundary
        run: >-
          python -m ruff check
          catalog/federation/persistence.py
          catalog/federation/tests/test_coordinator_audit_ring_bound.py
          catalog/capabilities/contributions/store.py
          catalog/capabilities/contributions/tests/test_intent_history_bound.py

      - name: Diff hygiene
        shell: bash
        run: git diff --check "origin/${{ github.base_ref || 'main' }}...HEAD"
