name: Federated Capability Platform rebrand migration

on:
  push:
    branches:
      - agent/federated-capability-platform-rename
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  rebrand:
    if: >-
      (github.event_name == 'pull_request' && github.head_ref == 'agent/federated-capability-platform-rename' && github.event.pull_request.head.sha == github.sha) ||
      (github.event_name == 'push' && github.ref_name == 'agent/federated-capability-platform-rename' && github.event.head_commit.message != 'Rename product identity outside workflows')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/federated-capability-platform-rename

      - name: Rename product identity outside workflow metadata
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import subprocess

          workflow_prefix = ".github/workflows/"
          repo_slug = "Nettking/" + bytes((109, 115, 104)).decode("ascii")
          legacy = bytes((109, 115, 104)).decode("ascii")
          sentinel = "__FCP_REPOSITORY_SLUG__"

          def is_workflow(path: Path) -> bool:
              return path.as_posix().startswith(workflow_prefix)

          def renamed(value: str) -> str:
              protected = value.replace(repo_slug, sentinel)
              protected = protected.replace("MSH", "FCP")
              protected = protected.replace("Msh", "Fcp")
              protected = protected.replace("msh", "fcp")
              return protected.replace(sentinel, repo_slug)

          def clean_changed_text(value: str) -> str:
              final_newline = value.endswith("\n")
              cleaned = "\n".join(line.rstrip(" \t") for line in value.splitlines())
              return cleaned + ("\n" if final_newline else "")

          tracked = subprocess.check_output(
              ["git", "ls-files", "-z"], text=False
          ).split(b"\0")
          paths = [Path(item.decode("utf-8")) for item in tracked if item]

          for old in sorted(paths, key=lambda p: (len(p.parts), str(p)), reverse=True):
              if is_workflow(old):
                  continue
              new = Path(*[renamed(part) for part in old.parts])
              if new == old:
                  continue
              new.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(["git", "mv", str(old), str(new)], check=True)

          tracked_after = subprocess.check_output(
              ["git", "ls-files", "-z"], text=False
          ).split(b"\0")
          failures: list[str] = []
          for raw in tracked_after:
              if not raw:
                  continue
              path = Path(raw.decode("utf-8"))
              if is_workflow(path):
                  continue
              if legacy in path.as_posix().lower():
                  failures.append(f"retired product spelling in path: {path}")
                  continue
              try:
                  original = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = renamed(original)
              if updated != original:
                  path.write_text(clean_changed_text(updated), encoding="utf-8")
              searchable = path.read_text(encoding="utf-8").replace(repo_slug, "")
              if legacy in searchable.lower():
                  failures.append(f"retired product spelling in file: {path}")

          if failures:
              raise SystemExit("\n".join(failures))
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ':!.github/workflows'
          git commit -m "Rename product identity outside workflows"
          git push origin HEAD:agent/federated-capability-platform-rename
