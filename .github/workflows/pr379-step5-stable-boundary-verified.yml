name: PR379 Step5 stable boundary verified

on:
  push:
    branches:
      - chatgpt/b01-federated-jsonl-resource-admission

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'Nettking/msh' && github.ref_name == 'chatgpt/b01-federated-jsonl-resource-admission'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard parent
        run: test "$(git rev-parse HEAD^)" = "950f07f60af42a2084d6bd68d777faed421df5ba"
      - name: Fetch proven transforms
        run: |
          git fetch --depth=1 origin bced820dfc18c1638c58fff79eb0b9b4c6f8bbf9
          git fetch --depth=1 origin a364e3ece5bf3c182938dd3d4be7ab049c7551ce
      - name: Apply tested Step 5 and lint cleanup
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          historical = subprocess.check_output(
              ["git", "show", "bced820dfc18c1638c58fff79eb0b9b4c6f8bbf9:.github/workflows/pr379-step5-stable-boundary-final.yml"],
              text=True,
          )
          marker = '      - name: Apply corrected Step 5\n        shell: python\n        run: |\n'
          body = historical.split(marker, 1)[1].split('      - name: Install test dependencies\n', 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          exec(compile(script, 'tested-step5-integration', 'exec'), {})

          bridge_path = Path('catalog/flask_app/services/federated_jsonl_product_bridge.py')
          bridge = bridge_path.read_text()
          method_start = bridge.index('    def _prepare_local_file(\n')
          row_anchor = bridge.index('        row = self._local_row(relative_path)\n', method_start)
          header_start = bridge.index('        with self._reserve(\n', method_start)
          inner = '            with self._stable_directory(self.cache_root) as cache_directory:\n'
          inner_at = bridge.index(inner, header_start, row_anchor)
          header_end = inner_at + len(inner)
          reserve_header = bridge[header_start:inner_at]
          combined = reserve_header[:-2] + ', self._stable_directory(\n            self.cache_root\n        ) as cache_directory:\n'
          body_segment = bridge[header_end:row_anchor]
          dedented = ''.join(line[4:] if line.startswith('                ') else line for line in body_segment.splitlines(keepends=True))
          bridge_path.write_text(bridge[:header_start] + combined + dedented + bridge[row_anchor:])

          stable_test = Path('catalog/federation/tests/test_stable_filesystem.py')
          tests = stable_test.read_text()
          nested = '''    with pytest.raises((OSError, StableFilesystemError)):\n        with stable_directory(root, Path("redirect")):\n            pass\n'''
          flat = '''    with pytest.raises((OSError, StableFilesystemError)), stable_directory(\n        root, Path("redirect")\n    ):\n        pass\n'''
          assert tests.count(nested) == 1
          stable_test.write_text(tests.replace(nested, flat, 1))
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Apply safe Ruff fixes
        run: python -m ruff check --fix catalog/federation/stable_filesystem.py catalog/flask_app/services/federated_jsonl_product_bridge.py catalog/federation/tests/test_stable_filesystem.py catalog/flask_app/tests/test_federated_jsonl_resource_admission.py
      - name: Verify focused tests
        run: python -m pytest catalog/federation/tests/test_stable_filesystem.py catalog/flask_app/tests/test_federated_jsonl_resource_admission.py catalog/federation/tests/test_host_resources.py -q
      - name: Verify lint and diff
        run: |
          python -m ruff check catalog/federation/stable_filesystem.py catalog/flask_app/services/federated_jsonl_product_bridge.py catalog/federation/tests/test_stable_filesystem.py catalog/flask_app/tests/test_federated_jsonl_resource_admission.py
          git diff --check
      - name: Commit verified Step 5
        run: |
          rm .github/workflows/pr379-step5-stable-boundary-verified.yml
          git add catalog/federation/stable_filesystem.py catalog/federation/tests/test_stable_filesystem.py catalog/flask_app/services/federated_jsonl_product_bridge.py catalog/flask_app/tests/test_federated_jsonl_resource_admission.py .github/workflows/pr379-step5-stable-boundary-verified.yml
          git diff --cached --check
          git config user.name "Nettking"
          git config user.email "m@nettking.no"
          git commit -m "close federated jsonl filesystem boundary"
          git push origin HEAD:chatgpt/b01-federated-jsonl-resource-admission
