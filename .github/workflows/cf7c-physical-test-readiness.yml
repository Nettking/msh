name: CF7-C physical test readiness

on:
  pull_request:
    paths:
      - ".github/actions/**"
      - ".github/workflows/cf7c-physical-test-readiness.yml"
      - ".gitignore"
      - "start.cmd"
      - "scripts/acceptance/cf7_physical_readiness.py"
      - "scripts/acceptance/cf7_physical_topology.template.json"
      - "scripts/acceptance/cf7_prepare_windows.ps1"
      - "scripts/acceptance/cf7_prepare_linux.sh"
      - "scripts/windows/stop_fcp_for_fresh_reset.ps1"
      - "scripts/windows/tests/stop_fcp_for_fresh_reset_smoke.ps1"
      - "catalog/flask_app/services/device_state_reset.py"
      - "catalog/flask_app/services/headless_federation_cli.py"
      - "catalog/flask_app/auth/routes.py"
      - "catalog/flask_app/tests/test_device_state_reset.py"
      - "catalog/flask_app/tests/test_first_user_bootstrap.py"
      - "catalog/flask_app/tests/test_headless_federation_cli.py"
      - "catalog/flask_app/tests/test_fresh_start_contract.py"
      - "catalog/flask_app/tests/test_windows_start_script.py"
      - "catalog/federation/tests/cf7_acceptance/test_physical_readiness.py"
      - "catalog/federation/tests/cf7_acceptance/physical_evidence.py"
      - "catalog/federation/tests/cf7_acceptance/test_physical_evidence.py"
      - "docs/implementation/cf7c_physical_test_readiness.md"
      - "docs/implementation/federation/acceptance/cf7c_physical_test_readiness.md"
  push:
    branches:
      - main
      - agent/cf7c-physical-test-readiness
      - fix/v1-physical-acceptance-blockers
    paths:
      - ".github/actions/**"
      - ".github/workflows/cf7c-physical-test-readiness.yml"
      - ".gitignore"
      - "start.cmd"
      - "scripts/acceptance/cf7_physical_readiness.py"
      - "scripts/acceptance/cf7_physical_topology.template.json"
      - "scripts/acceptance/cf7_prepare_windows.ps1"
      - "scripts/acceptance/cf7_prepare_linux.sh"
      - "scripts/windows/stop_fcp_for_fresh_reset.ps1"
      - "scripts/windows/tests/stop_fcp_for_fresh_reset_smoke.ps1"
      - "catalog/flask_app/services/device_state_reset.py"
      - "catalog/flask_app/services/headless_federation_cli.py"
      - "catalog/flask_app/auth/routes.py"
      - "catalog/flask_app/tests/test_device_state_reset.py"
      - "catalog/flask_app/tests/test_first_user_bootstrap.py"
      - "catalog/flask_app/tests/test_headless_federation_cli.py"
      - "catalog/flask_app/tests/test_fresh_start_contract.py"
      - "catalog/flask_app/tests/test_windows_start_script.py"
      - "catalog/federation/tests/cf7_acceptance/test_physical_readiness.py"
      - "catalog/federation/tests/cf7_acceptance/physical_evidence.py"
      - "catalog/federation/tests/cf7_acceptance/test_physical_evidence.py"
      - "docs/implementation/cf7c_physical_test_readiness.md"
      - "docs/implementation/federation/acceptance/cf7c_physical_test_readiness.md"

permissions:
  contents: read

jobs:
  readiness:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: fcp-linux-fast
            shell: bash
          - os: Windows
            runner: fcp-windows
            shell: powershell
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/self-hosted-python
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest ruff

      - name: Compile readiness tooling
        run: >-
          python -m compileall -q
          scripts/acceptance/cf7_physical_readiness.py
          catalog/flask_app/services/device_state_reset.py
          catalog/flask_app/services/headless_federation_cli.py
          catalog/federation/tests/cf7_acceptance/test_physical_readiness.py

      - name: Validate topology template
        run: >-
          python -m scripts.acceptance.cf7_physical_readiness
          topology scripts/acceptance/cf7_physical_topology.template.json

      - name: Ubuntu storage precondition
        if: runner.os == 'Linux'
        uses: ./.github/actions/ubuntu-storage-precondition

      - name: Run readiness and evidence tests
        run: >-
          python -m pytest -o addopts= -q
          catalog/federation/tests/cf7_acceptance/test_physical_readiness.py
          catalog/federation/tests/cf7_acceptance/test_physical_evidence.py

      - name: Run factory-reset and admin-first lifecycle tests
        run: >-
          python -m pytest -o addopts= -q
          catalog/flask_app/tests/test_device_state_reset.py
          catalog/flask_app/tests/test_first_user_bootstrap.py
          catalog/flask_app/tests/test_headless_federation_cli.py
          catalog/flask_app/tests/test_fresh_start_contract.py
          catalog/flask_app/tests/test_windows_start_script.py

      - name: Validate Linux wrapper syntax
        if: runner.os == 'Linux'
        shell: bash
        run: bash -n scripts/acceptance/cf7_prepare_linux.sh

      - name: Validate Windows wrapper and fresh-shutdown helper
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($script in @(
            'scripts/acceptance/cf7_prepare_windows.ps1',
            'scripts/windows/stop_fcp_for_fresh_reset.ps1',
            'scripts/windows/tests/stop_fcp_for_fresh_reset_smoke.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

          powershell -NoProfile -ExecutionPolicy Bypass `
            -File .\scripts\windows\tests\stop_fcp_for_fresh_reset_smoke.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ruff readiness tooling
        run: >-
          ruff check
          scripts/acceptance/cf7_physical_readiness.py
          catalog/flask_app/services/device_state_reset.py
          catalog/flask_app/services/headless_federation_cli.py
          catalog/flask_app/tests/test_device_state_reset.py
          catalog/flask_app/tests/test_headless_federation_cli.py
          catalog/flask_app/tests/test_fresh_start_contract.py
          catalog/federation/tests/cf7_acceptance/test_physical_readiness.py

      - name: Diff hygiene
        run: git diff --check
