name: F8.5 test precision fix

on:
  pull_request:
    paths:
      - ".github/workflows/f85-fix-test-precision.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply exact test-only fixes
        shell: python
        run: |
          from pathlib import Path

          operator = Path("catalog/capabilities/tests/test_operator_surface.py")
          text = operator.read_text(encoding="utf-8")
          old = """        provider,\n        reader,\n        outsider,\n        current,\n    ) = values\n"""
          new = """        provider,\n        _reader,\n        _outsider,\n        current,\n    ) = values\n"""
          if text.count(old) != 1:
              raise SystemExit(f"expected one operator fixture block, found {text.count(old)}")
          operator.write_text(text.replace(old, new), encoding="utf-8")

          web = Path("catalog/flask_app/tests/test_provider_federation_surface.py")
          text = web.read_text(encoding="utf-8")
          old = '    assert b"properties" not in response.data\n'
          new = '    assert b"<dt>Properties</dt>" not in response.data\n    assert b"handler_id" not in response.data\n'
          if text.count(old) != 1:
              raise SystemExit(f"expected one HTML assertion, found {text.count(old)}")
          web.write_text(text.replace(old, new), encoding="utf-8")
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/f85-fix-test-precision.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/capabilities/tests/test_operator_surface.py catalog/flask_app/tests/test_provider_federation_surface.py
          git commit -m "Fix F8.5 test precision"
          git push origin HEAD:${{ github.head_ref }}
