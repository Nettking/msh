name: F8.5 relay regression marker

on:
  pull_request:
    paths:
      - ".github/workflows/f85-mark-relay-regression.yml"

permissions:
  contents: write

jobs:
  mark:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Add exact regression-boundary docstring
        shell: python
        run: |
          from pathlib import Path

          path = Path("catalog/relay/tests/test_phase_f83_remote_ai_binding.py")
          text = path.read_text(encoding="utf-8")
          marker = '"""F8.3 relay acceptance, also guarding the F8.5 AI eligibility projection."""\n\n'
          if text.startswith(marker):
              raise SystemExit("regression marker already present")
          if not text.startswith("from __future__ import annotations\n"):
              raise SystemExit("unexpected F8.3 relay test header")
          path.write_text(marker + text, encoding="utf-8")
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/f85-mark-relay-regression.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/relay/tests/test_phase_f83_remote_ai_binding.py
          git commit -m "Mark F8.5 relay regression boundary"
          git push origin HEAD:${{ github.head_ref }}
