name: F8.6 exact quality patch

on:
  push:
    branches: [agent/phase-f86-reconnect-reconciliation]
    paths:
      - ".github/workflows/f86-quality-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-f86-reconnect-reconciliation
      - name: Apply exact replacements
        shell: python
        run: |
          from pathlib import Path

          path = Path("catalog/capabilities/reconciliation.py")
          content = path.read_text(encoding="utf-8")
          replacements = {
              "set((*previous_ai_ids, *desired_ai_ids))": "{*previous_ai_ids, *desired_ai_ids}",
              "set((*previous_compute_ids, *desired_compute_ids))": "{*previous_compute_ids, *desired_compute_ids}",
          }
          for old, new in replacements.items():
              if content.count(old) != 1:
                  raise SystemExit(f"expected exactly one occurrence of {old!r}")
              content = content.replace(old, new)
          path.write_text(content, encoding="utf-8")
      - name: Commit exact replacements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/capabilities/reconciliation.py
          git commit -m "Fix F8.6 reconciliation set unions"
          git push origin HEAD:agent/phase-f86-reconnect-reconciliation
