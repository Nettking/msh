name: CFI-5 contribution composition

on:
  pull_request:
    paths:
      - ".github/workflows/cfi5-contribution-composition.yml"
      - "catalog/flask_app/app.py"
      - "catalog/flask_app/capability_contribution_routes.py"
      - "catalog/flask_app/services/capability_contribution_components.py"
      - "catalog/flask_app/services/capability_contribution_service.py"
      - "catalog/flask_app/services/mtconnect_discovery_service.py"
      - "catalog/flask_app/services/recorder_control_service.py"
      - "catalog/flask_app/services/run_once_capability_evidence.py"
      - "catalog/flask_app/services/startup_contribution_reconcile.py"
      - "catalog/flask_app/templates/federation/onboarding/_contributions.html"
      - "catalog/flask_app/tests/test_capability_contribution_route.py"
      - "catalog/flask_app/tests/test_unavailable_benchmark_review.py"
      - "catalog/flask_app/tests/test_mtconnect_discovery_service.py"
      - "catalog/flask_app/tests/test_recorder_control_service.py"
      - "catalog/flask_app/tests/test_run_once_capability_evidence.py"
      - "catalog/flask_app/tests/test_startup_contribution_reconcile.py"
      - "catalog/capabilities/contributions/**"
      - "catalog/flask_app/capability_benchmark_routes.py"
      - "catalog/flask_app/services/capability_benchmark_service.py"
      - "catalog/flask_app/services/capability_inspection_service.py"
      - "catalog/federation/onboarding_models.py"
  push:
    branches:
      - main
      - "agent/cfi5-*"
    paths:
      - ".github/workflows/cfi5-contribution-composition.yml"
      - "catalog/flask_app/app.py"
      - "catalog/flask_app/capability_contribution_routes.py"
      - "catalog/flask_app/services/capability_contribution_components.py"
      - "catalog/flask_app/services/capability_contribution_service.py"
      - "catalog/flask_app/services/mtconnect_discovery_service.py"
      - "catalog/flask_app/services/recorder_control_service.py"
      - "catalog/flask_app/services/run_once_capability_evidence.py"
      - "catalog/flask_app/services/startup_contribution_reconcile.py"
      - "catalog/flask_app/templates/federation/onboarding/_contributions.html"
      - "catalog/flask_app/tests/test_capability_contribution_route.py"
      - "catalog/flask_app/tests/test_unavailable_benchmark_review.py"
      - "catalog/flask_app/tests/test_mtconnect_discovery_service.py"
      - "catalog/flask_app/tests/test_recorder_control_service.py"
      - "catalog/flask_app/tests/test_run_once_capability_evidence.py"
      - "catalog/flask_app/tests/test_startup_contribution_reconcile.py"
      - "catalog/capabilities/contributions/**"
      - "catalog/flask_app/capability_benchmark_routes.py"
      - "catalog/flask_app/services/capability_benchmark_service.py"
      - "catalog/flask_app/services/capability_inspection_service.py"
      - "catalog/federation/onboarding_models.py"

permissions:
  contents: read

concurrency:
  group: cfi5-contributions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contributions:
    name: contributions (${{ matrix.os }})
    if: >-
      github.repository == 'Nettking/msh' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == 'Nettking/msh')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: fcp-linux-fast
            shell: bash
          - os: Windows
            runner: fcp-test-windows
            shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
    runs-on: [self-hosted, "${{ matrix.os }}", X64, "${{ matrix.runner }}"]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/self-hosted-python
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest ruff
      - name: Compile CFI-5 composition
        run: >-
          python -m compileall -q
          catalog/flask_app/capability_contribution_routes.py
          catalog/flask_app/services/capability_contribution_components.py
          catalog/flask_app/services/capability_contribution_service.py
          catalog/flask_app/services/mtconnect_discovery_service.py
          catalog/flask_app/services/recorder_control_service.py
          catalog/flask_app/services/run_once_capability_evidence.py
          catalog/flask_app/services/startup_contribution_reconcile.py
          catalog/flask_app/tests/test_capability_contribution_route.py
          catalog/flask_app/tests/test_mtconnect_discovery_service.py
          catalog/flask_app/tests/test_recorder_control_service.py
          catalog/flask_app/tests/test_run_once_capability_evidence.py
          catalog/flask_app/tests/test_startup_contribution_reconcile.py
          catalog/flask_app/tests/test_unavailable_benchmark_review.py
      - name: Ubuntu storage precondition
        if: runner.os == 'Linux'
        uses: ./.github/actions/ubuntu-storage-precondition
      - name: Run CFI-5 and affected regressions
        run: >-
          python -m pytest -o addopts= -q
          catalog/flask_app/tests/test_capability_contribution_route.py
          catalog/flask_app/tests/test_recorder_control_service.py
          catalog/flask_app/tests/test_run_once_capability_evidence.py
          catalog/flask_app/tests/test_startup_contribution_reconcile.py
          catalog/flask_app/tests/test_capability_benchmark_route.py
          catalog/flask_app/tests/test_capability_inspection_route.py
          catalog/flask_app/tests/test_capability_onboarding_route.py
          catalog/capabilities/contributions/tests
          catalog/capabilities/tests/test_benchmarking_runner.py
          catalog/capabilities/tests/test_benchmarking_store_and_validity.py
          catalog/capabilities/tests/test_benchmarking_inspection.py
          catalog/capabilities/tests/test_benchmarking_adapters.py
          catalog/federation/tests/test_onboarding_contracts.py
          catalog/federation/tests/test_onboarding_discovery_service.py
          catalog/flask_app/tests/test_cf5_ui_shell.py
          catalog/flask_app/tests/test_federation_overview_route.py
          catalog/federation/tests/test_federation_projections.py
          catalog/flask_app/tests/test_post_setup_handoff.py
          catalog/flask_app/tests/test_connected_ai_provider.py
          catalog/flask_app/tests/test_mtconnect_discovery_service.py
          catalog/flask_app/tests/test_unavailable_benchmark_review.py
      - name: Validate Compose configuration
        run: docker compose config
      - name: Ruff CFI-5 composition
        run: >-
          python -m ruff check
          catalog/flask_app/app.py
          catalog/flask_app/capability_contribution_routes.py
          catalog/flask_app/services/capability_contribution_components.py
          catalog/flask_app/services/capability_contribution_service.py
          catalog/flask_app/services/mtconnect_discovery_service.py
          catalog/flask_app/services/recorder_control_service.py
          catalog/flask_app/services/run_once_capability_evidence.py
          catalog/flask_app/tests/test_capability_contribution_route.py
          catalog/flask_app/tests/test_mtconnect_discovery_service.py
          catalog/flask_app/tests/test_recorder_control_service.py
          catalog/flask_app/tests/test_run_once_capability_evidence.py
          catalog/flask_app/tests/test_startup_contribution_reconcile.py
          catalog/flask_app/tests/test_unavailable_benchmark_review.py
      - name: Diff hygiene
        shell: bash
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi
