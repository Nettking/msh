name: Documentation portal

on:
  pull_request:
    paths:
      - "catalog/flask_app/docs_routes.py"
      - "catalog/flask_app/templates/docs_viewer.html"
      - "catalog/flask_app/static/css/docs*.css"
      - "catalog/flask_app/static/js/docs-navigation.js"
      - "catalog/flask_app/tests/test_docs_portal.py"
      - "docs/**"
      - ".github/workflows/docs-portal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-portal:
    name: docs-portal (${{ matrix.os }})
    if: >-
      github.repository == 'Nettking/msh' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == 'Nettking/msh')
    runs-on: [self-hosted, "${{ matrix.os }}", X64, "${{ matrix.runner }}"]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: fcp-linux-fast
            shell: bash
          - os: Windows
            runner: fcp-test-windows
            shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: ./.github/actions/self-hosted-python
        with:
          python-version: "3.12"

      - name: Install application and test dependencies
        run: |
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest

      - name: Ubuntu storage precondition
        if: runner.os == 'Linux'
        uses: ./.github/actions/ubuntu-storage-precondition

      - name: Run documentation portal tests
        run: python -m pytest catalog/flask_app/tests/test_docs_portal.py -q
