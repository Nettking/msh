name: Phase F8.5 operator federation surface

on:
  pull_request:
    paths:
      - "catalog/capabilities/**"
      - "catalog/flask_app/**"
      - "catalog/ai/**"
      - "catalog/relay/tests/test_phase_f83_remote_ai_binding.py"
      - "catalog/relay/tests/test_phase_f84_compute_worker_activation.py"
      - "docs/implementation/phase_f85_plan.md"
      - ".github/workflows/phase-f85-operator-federation-surface.yml"
  push:
    branches: [main]
    paths:
      - "catalog/capabilities/**"
      - "catalog/flask_app/**"
      - "catalog/ai/**"
      - "catalog/relay/tests/test_phase_f83_remote_ai_binding.py"
      - "catalog/relay/tests/test_phase_f84_compute_worker_activation.py"
      - "docs/implementation/phase_f85_plan.md"
      - ".github/workflows/phase-f85-operator-federation-surface.yml"

permissions:
  contents: read

concurrency:
  group: f85-operator-surface-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  operator-surface:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest ruff
      - name: Compile F8.5 boundaries
        run: >-
          python -m compileall
          catalog/capabilities
          catalog/ai
          catalog/flask_app
          catalog/relay/tests/test_phase_f83_remote_ai_binding.py
          catalog/relay/tests/test_phase_f84_compute_worker_activation.py
      - name: F8.5 and affected regressions
        run: >-
          python -m pytest -o addopts= -q
          catalog/capabilities/tests
          catalog/ai/tests/test_remote_provider.py
          catalog/relay/tests/test_phase_f83_remote_ai_binding.py
          catalog/relay/tests/test_phase_f84_compute_worker_activation.py
          catalog/flask_app/tests/test_docs_viewer.py
          catalog/flask_app/tests/test_provider_federation_surface.py
          catalog/flask_app/test_navigation_smoke.py
          catalog/federation/tests/test_phase0.py
          catalog/federation/tests/test_phase1.py
          catalog/federation/tests/test_phase2_unit.py
      - name: Ruff F8.5 boundaries
        run: >-
          python -m ruff check
          catalog/capabilities
          catalog/ai/remote_provider.py
          catalog/flask_app/app.py
          catalog/flask_app/docs_routes.py
          catalog/flask_app/provider_federation_routes.py
          catalog/flask_app/tests/test_docs_viewer.py
          catalog/flask_app/tests/test_provider_federation_surface.py
          --ignore I001,RUF022,B008,C408,PLC0206,UP035
      - name: Compose validation
        run: docker compose config --quiet
      - name: Diff hygiene
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD
