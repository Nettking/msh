name: Trim Phase E EOF

on:
  push:
    branches: [agent/complete-phase-e-recovery]
    paths:
      - ".github/workflows/phase-e-trim-eof.yml"

permissions:
  contents: write

jobs:
  trim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Remove extra EOF blank line
        shell: python
        run: |
          from pathlib import Path

          path = Path("catalog/federation/former_primary_repair.py")
          text = path.read_text(encoding="utf-8")
          path.write_text(text.rstrip("\n") + "\n", encoding="utf-8")
      - name: Verify diff hygiene
        run: git diff --check origin/main...HEAD
      - name: Commit cleanup and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/phase-e-trim-eof.yml
          git add catalog/federation/former_primary_repair.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix Phase E diff hygiene"
          git push origin HEAD:agent/complete-phase-e-recovery
