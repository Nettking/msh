name: Fix CF7 marker read race

on:
  push:
    branches:
      - agent/cf7c-physical-test-readiness
    paths:
      - ".github/workflows/cf7c-fix-marker-read-race.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cf7c-physical-test-readiness
          fetch-depth: 0

      - name: Apply exact restart assertion fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("catalog/federation/tests/cf7_acceptance/test_foundation.py")
          text = path.read_text(encoding="utf-8")
          old = '''        process = process.restart()
        wait_until(
            lambda: marker.exists()
            and int(marker.read_text(encoding="utf-8")) != first_pid
        )
        second_pid = int(marker.read_text(encoding="utf-8"))
'''
          new = '''        process = process.restart()

        def marker_contains_new_pid() -> bool:
            if not marker.exists():
                return False
            try:
                return int(marker.read_text(encoding="utf-8")) != first_pid
            except ValueError:
                return False

        wait_until(marker_contains_new_pid)
        second_pid = int(marker.read_text(encoding="utf-8"))
'''
          assert text.count(old) == 1
          path.write_text(text.replace(old, new), encoding="utf-8")
          Path(".github/workflows/cf7c-fix-marker-read-race.yml").unlink()
          PY

      - name: Commit bounded test fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make CF7 restart assertion tolerate partial marker writes"
          git push origin HEAD:agent/cf7c-physical-test-readiness
