name: CF6 Federation projections

on:
  pull_request:
    paths:
      - ".github/workflows/cf6-federation-projections.yml"
      - "catalog/federation/projections/**"
      - "catalog/federation/tests/test_federation_projections.py"
  push:
    branches:
      - main
      - "agent/cf6-*"
    paths:
      - ".github/workflows/cf6-federation-projections.yml"
      - "catalog/federation/projections/**"
      - "catalog/federation/tests/test_federation_projections.py"

permissions:
  contents: read

concurrency:
  group: cf6-federation-projections-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  projections:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest ruff
      - name: Compile CF6 projections
        run: >-
          python -m compileall -q
          catalog/federation/projections
          catalog/federation/tests/test_federation_projections.py
      - name: Run CF6 projection tests
        run: >-
          python -m pytest -o addopts= -q
          catalog/federation/tests/test_federation_projections.py
      - name: Ruff CF6 projections
        run: >-
          python -m ruff check
          catalog/federation/projections
          catalog/federation/tests/test_federation_projections.py
      - name: Diff hygiene
        shell: bash
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi
