name: Apply final Phase E EOF cleanup

on:
  push:
    branches: [agent/complete-phase-e-recovery]
    paths:
      - ".phase-e-eof-fix.py"
      - ".github/workflows/phase-e-eof-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize final newline
        run: python .phase-e-eof-fix.py
      - name: Commit EOF cleanup
        shell: bash
        run: |
          set -euo pipefail
          git rm .phase-e-eof-fix.py
          git add catalog/federation/former_primary_repair.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Normalize Phase E recovery EOF"
          git push origin HEAD:agent/complete-phase-e-recovery
