name: Phase F7 capability scheduling closeout

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/actions/**"
      - "catalog/capabilities/**"
      - "catalog/ai/**"
      - "catalog/common/tests/test_f7_ci_coverage.py"
      - "catalog/federation/object_transfer.py"
      - "catalog/federation/resumable_chunk_transfer.py"
      - "catalog/federation/tests/test_phase_f641_chunk_contract.py"
      - "catalog/node/tests/test_phase_f642_verified_chunk_transfer.py"
      - "catalog/node/tests/test_phase_f65_resumable_chunk_transfer.py"
      - "catalog/flask_app/ai_routes.py"
      - "catalog/flask_app/services/server_setup_service.py"
      - "catalog/flask_app/static/js/ai-explainer.js"
      - "catalog/flask_app/templates/ai_explainer.html"
      - "catalog/flask_app/tests/test_ai_explainer_candidate_visibility.py"
      - "catalog/flask_app/tests/test_ai_explainer_chat.py"
      - "catalog/flask_app/tests/test_ai_runtime_integration.py"
      - "catalog/flask_app/tests/test_connected_ai_provider.py"
      - "catalog/flask_app/tests/test_model_provider_compose.py"
      - "catalog/relay/tests/test_phase_f74_capability_dispatch.py"
      - "catalog/relay/tests/test_phase_f75_retry_cancellation.py"
      - "docs/connected_capabilities.md"
      - "docs/architecture.md"
      - "docs/implementation/phase_f7_closeout.md"
      - ".github/workflows/phase-f7-closeout.yml"
      - ".github/workflows/phase-f6-closeout.yml"
      - ".github/workflows/phase2-federation.yml"
  push:
    branches: [main]
    paths:
      - ".github/actions/**"
      - "catalog/capabilities/**"
      - "catalog/ai/**"
      - "catalog/common/tests/test_f7_ci_coverage.py"
      - "catalog/federation/object_transfer.py"
      - "catalog/federation/resumable_chunk_transfer.py"
      - "catalog/federation/tests/test_phase_f641_chunk_contract.py"
      - "catalog/node/tests/test_phase_f642_verified_chunk_transfer.py"
      - "catalog/node/tests/test_phase_f65_resumable_chunk_transfer.py"
      - "catalog/flask_app/ai_routes.py"
      - "catalog/flask_app/services/server_setup_service.py"
      - "catalog/flask_app/static/js/ai-explainer.js"
      - "catalog/flask_app/templates/ai_explainer.html"
      - "catalog/flask_app/tests/test_ai_explainer_candidate_visibility.py"
      - "catalog/flask_app/tests/test_ai_explainer_chat.py"
      - "catalog/flask_app/tests/test_ai_runtime_integration.py"
      - "catalog/flask_app/tests/test_connected_ai_provider.py"
      - "catalog/flask_app/tests/test_model_provider_compose.py"
      - "catalog/relay/tests/test_phase_f74_capability_dispatch.py"
      - "catalog/relay/tests/test_phase_f75_retry_cancellation.py"
      - "docs/connected_capabilities.md"
      - "docs/architecture.md"
      - "docs/implementation/phase_f7_closeout.md"
      - ".github/workflows/phase-f7-closeout.yml"
      - ".github/workflows/phase-f6-closeout.yml"
      - ".github/workflows/phase2-federation.yml"

permissions:
  contents: read
  actions: read # Native job identity for evidence provenance only.

concurrency:
  group: f7-closeout-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capability-closeout:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: fcp-linux-fast
            shell: bash
          - os: Windows
            runner: fcp-windows
            shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/self-hosted-python
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest ruff==0.16.10
      - name: Ubuntu storage precondition
        if: runner.os == 'Linux'
        uses: ./.github/actions/ubuntu-storage-precondition

      - name: Compile complete F7 boundary
        run: >-
          python -m compileall
          catalog/capabilities
          catalog/ai
          catalog/common/tests/test_f7_ci_coverage.py
          catalog/flask_app/ai_routes.py
          catalog/flask_app/tests/test_ai_explainer_chat.py
          catalog/flask_app/tests/test_ai_runtime_integration.py
          catalog/flask_app/tests/test_connected_ai_provider.py
          catalog/flask_app/tests/test_model_provider_compose.py
          catalog/relay/tests/test_phase_f74_capability_dispatch.py
          catalog/relay/tests/test_phase_f75_retry_cancellation.py
      - name: Complete F7 and Phase 6 acceptance matrix
        env:
          TEMP: ${{ runner.os == 'Windows' && '\\?\C:\fcp-qtmp' || runner.temp }}
          TMP: ${{ runner.os == 'Windows' && '\\?\C:\fcp-qtmp' || runner.temp }}
        run: >-
          python -m pytest -o addopts= -q
          --junitxml="${{ runner.temp }}/f7-closeout-${{ matrix.os }}.xml"
          catalog/common/tests/test_f7_ci_coverage.py
          catalog/capabilities/tests
          catalog/ai/tests
          catalog/flask_app/tests/test_ai_explainer_chat.py
          catalog/flask_app/tests/test_ai_runtime_integration.py
          catalog/flask_app/tests/test_connected_ai_provider.py
          catalog/flask_app/tests/test_model_provider_compose.py
          catalog/relay/tests/test_phase_f74_capability_dispatch.py
          catalog/relay/tests/test_phase_f75_retry_cancellation.py
          catalog/federation/tests/test_phase0.py
          catalog/federation/tests/test_phase1.py
          catalog/federation/tests/test_phase_f641_chunk_contract.py
          catalog/node/tests/test_phase_f642_verified_chunk_transfer.py
          catalog/node/tests/test_phase_f65_resumable_chunk_transfer.py
      - name: Ruff complete F7 boundary
        run: >-
          python -m ruff check
          catalog/capabilities
          catalog/ai
          catalog/common/tests/test_f7_ci_coverage.py
          catalog/flask_app/ai_routes.py
          catalog/flask_app/tests/test_ai_runtime_integration.py
          --ignore I001,RUF022,B008,C408,PLC0206,UP035
      - name: Preserve capability UP035 coverage
        run: python -m ruff check catalog/capabilities --select UP035
      - name: Preserve relay lifecycle lint coverage
        run: >-
          python -m ruff check
          catalog/relay/tests/test_phase_f74_capability_dispatch.py
          catalog/relay/tests/test_phase_f75_retry_cancellation.py
          --ignore I001,RUF022,B008,C408,PLC0206
      - name: Compose validation
        run: docker compose config --quiet
      - name: Diff hygiene
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD
      - name: Manifest native F7 test evidence
        if: always()
        env:
          EVIDENCE_PATH: ${{ runner.temp }}/f7-closeout-${{ matrix.os }}.xml
          EVIDENCE_DIR: ${{ runner.temp }}/f7-closeout-${{ github.run_id }}-a${{ github.run_attempt }}-${{ matrix.os }}
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          JOB_KEY: ${{ github.job }}
          RUNNER_NAME: ${{ runner.name }}
          RUNNER_OS: ${{ runner.os }}
          JOB_STATUS: ${{ job.status }}
          MATRIX_JSON: ${{ toJSON(matrix) }}
        run: >-
          python -c "import datetime,hashlib,json,os,shutil,subprocess; from pathlib import Path; source=Path(os.environ['EVIDENCE_PATH']); root=Path(os.environ['EVIDENCE_DIR']); assert source.is_file(), f'required JUnit evidence is missing: {source}'; checkout_sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(); assert checkout_sha==os.environ['SOURCE_SHA'], 'checked-out source SHA does not match the workflow event SHA'; root.mkdir(parents=True,exist_ok=False); retained=root/source.name; shutil.copy2(source,retained); data=retained.read_bytes(); manifest={'schema':'fcp.ci-evidence-manifest.v1','kind':'f7-closeout-junit','repository':os.environ['GITHUB_REPOSITORY'],'source_sha':os.environ['SOURCE_SHA'],'checkout_sha':checkout_sha,'event_sha':os.environ['GITHUB_SHA'],'workflow':os.environ['GITHUB_WORKFLOW'],'workflow_ref':os.environ['WORKFLOW_REF'],'workflow_sha':os.environ['WORKFLOW_SHA'],'run_id':os.environ['RUN_ID'],'run_attempt':int(os.environ['RUN_ATTEMPT']),'job_key':os.environ['JOB_KEY'],'matrix':json.loads(os.environ['MATRIX_JSON']),'runner_name':os.environ['RUNNER_NAME'],'runner_os':os.environ['RUNNER_OS'],'job_status_at_capture':os.environ['JOB_STATUS'],'captured_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'files':[{'path':retained.name,'source_path':source.as_posix(),'size':len(data),'sha256':hashlib.sha256(data).hexdigest()}]}; (root/'archive-manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n',encoding='utf-8')"
      - name: Upload native F7 test evidence
        id: f7_artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f7-closeout-${{ github.run_id }}-a${{ github.run_attempt }}-${{ matrix.os }}
          path: ${{ runner.temp }}/f7-closeout-${{ github.run_id }}-a${{ github.run_attempt }}-${{ matrix.os }}/
          if-no-files-found: error
          retention-days: 90
          overwrite: false
      - name: Record F7 artifact receipt
        if: always()
        env:
          ARTIFACT_NAME: f7-closeout-${{ github.run_id }}-a${{ github.run_attempt }}-${{ matrix.os }}
          ARTIFACT_ID: ${{ steps.f7_artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.f7_artifact.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.f7_artifact.outputs.artifact-url }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          JOB_KEY: ${{ github.job }}
          MATRIX_JSON: ${{ toJSON(matrix) }}
        run: >-
          python -c "import json,os; from pathlib import Path; receipt={'artifact_name':os.environ['ARTIFACT_NAME'],'artifact_id':os.environ.get('ARTIFACT_ID',''),'artifact_digest':os.environ.get('ARTIFACT_DIGEST',''),'artifact_url':os.environ.get('ARTIFACT_URL',''),'source_sha':os.environ['SOURCE_SHA'],'run_id':os.environ['RUN_ID'],'run_attempt':int(os.environ['RUN_ATTEMPT']),'job_key':os.environ['JOB_KEY'],'matrix':json.loads(os.environ['MATRIX_JSON'])}; Path(os.environ['GITHUB_STEP_SUMMARY']).open('a',encoding='utf-8').write('### F7 test evidence artifact receipt\\n\\n'+json.dumps(receipt,indent=2,sort_keys=True)+'\\n\\n')"
