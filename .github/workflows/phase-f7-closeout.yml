name: Phase F7 capability scheduling closeout

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/actions/**"
      - "catalog/capabilities/**"
      - "catalog/ai/**"
      - "catalog/common/tests/test_f7_ci_coverage.py"
      - "catalog/federation/object_transfer.py"
      - "catalog/federation/resumable_chunk_transfer.py"
      - "catalog/federation/tests/test_phase_f641_chunk_contract.py"
      - "catalog/node/tests/test_phase_f642_verified_chunk_transfer.py"
      - "catalog/node/tests/test_phase_f65_resumable_chunk_transfer.py"
      - "catalog/flask_app/ai_routes.py"
      - "catalog/flask_app/services/server_setup_service.py"
      - "catalog/flask_app/static/js/ai-explainer.js"
      - "catalog/flask_app/templates/ai_explainer.html"
      - "catalog/flask_app/tests/test_ai_explainer_candidate_visibility.py"
      - "catalog/flask_app/tests/test_ai_explainer_chat.py"
      - "catalog/flask_app/tests/test_ai_runtime_integration.py"
      - "catalog/flask_app/tests/test_connected_ai_provider.py"
      - "catalog/flask_app/tests/test_model_provider_compose.py"
      - "catalog/relay/tests/test_phase_f74_capability_dispatch.py"
      - "catalog/relay/tests/test_phase_f75_retry_cancellation.py"
      - "docs/connected_capabilities.md"
      - "docs/architecture.md"
      - "docs/implementation/phase_f7_closeout.md"
      - ".github/workflows/phase-f7-closeout.yml"
      - ".github/workflows/phase-f6-closeout.yml"
      - ".github/workflows/phase2-federation.yml"
  push:
    branches: [main]
    paths:
      - ".github/actions/**"
      - "catalog/capabilities/**"
      - "catalog/ai/**"
      - "catalog/common/tests/test_f7_ci_coverage.py"
      - "catalog/federation/object_transfer.py"
      - "catalog/federation/resumable_chunk_transfer.py"
      - "catalog/federation/tests/test_phase_f641_chunk_contract.py"
      - "catalog/node/tests/test_phase_f642_verified_chunk_transfer.py"
      - "catalog/node/tests/test_phase_f65_resumable_chunk_transfer.py"
      - "catalog/flask_app/ai_routes.py"
      - "catalog/flask_app/services/server_setup_service.py"
      - "catalog/flask_app/static/js/ai-explainer.js"
      - "catalog/flask_app/templates/ai_explainer.html"
      - "catalog/flask_app/tests/test_ai_explainer_candidate_visibility.py"
      - "catalog/flask_app/tests/test_ai_explainer_chat.py"
      - "catalog/flask_app/tests/test_ai_runtime_integration.py"
      - "catalog/flask_app/tests/test_connected_ai_provider.py"
      - "catalog/flask_app/tests/test_model_provider_compose.py"
      - "catalog/relay/tests/test_phase_f74_capability_dispatch.py"
      - "catalog/relay/tests/test_phase_f75_retry_cancellation.py"
      - "docs/connected_capabilities.md"
      - "docs/architecture.md"
      - "docs/implementation/phase_f7_closeout.md"
      - ".github/workflows/phase-f7-closeout.yml"
      - ".github/workflows/phase-f6-closeout.yml"
      - ".github/workflows/phase2-federation.yml"

permissions:
  contents: read
  actions: read # Native job identity for evidence provenance only.

concurrency:
  group: f7-closeout-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capability-closeout:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: fcp-linux-fast
            shell: bash
          - os: Windows
            runner: fcp-windows
            shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
    runs-on: [self-hosted, "${{ matrix.runner }}"]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/self-hosted-python
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest ruff
      - name: Ubuntu storage precondition
        if: runner.os == 'Linux'
        uses: ./.github/actions/ubuntu-storage-precondition

      - name: Compile complete F7 boundary
        run: >-
          python -m compileall
          catalog/capabilities
          catalog/ai
          catalog/common/tests/test_f7_ci_coverage.py
          catalog/flask_app/ai_routes.py
          catalog/flask_app/tests/test_ai_explainer_chat.py
          catalog/flask_app/tests/test_ai_runtime_integration.py
          catalog/flask_app/tests/test_connected_ai_provider.py
          catalog/flask_app/tests/test_model_provider_compose.py
          catalog/relay/tests/test_phase_f74_capability_dispatch.py
          catalog/relay/tests/test_phase_f75_retry_cancellation.py
      - name: Complete F7 and Phase 6 acceptance matrix
        env:
          TEMP: ${{ runner.os == 'Windows' && '\\?\C:\fcp-qtmp' || runner.temp }}
          TMP: ${{ runner.os == 'Windows' && '\\?\C:\fcp-qtmp' || runner.temp }}
        run: >-
          python -m pytest -o addopts= -q
          --junitxml="${{ runner.temp }}/f7-closeout-${{ matrix.os }}.xml"
          catalog/common/tests/test_f7_ci_coverage.py
          catalog/capabilities/tests
          catalog/ai/tests
          catalog/flask_app/tests/test_ai_explainer_chat.py
          catalog/flask_app/tests/test_ai_runtime_integration.py
          catalog/flask_app/tests/test_connected_ai_provider.py
          catalog/flask_app/tests/test_model_provider_compose.py
          catalog/relay/tests/test_phase_f74_capability_dispatch.py
          catalog/relay/tests/test_phase_f75_retry_cancellation.py
          catalog/federation/tests/test_phase0.py
          catalog/federation/tests/test_phase1.py
          catalog/federation/tests/test_phase_f641_chunk_contract.py
          catalog/node/tests/test_phase_f642_verified_chunk_transfer.py
          catalog/node/tests/test_phase_f65_resumable_chunk_transfer.py
      - name: Ruff complete F7 boundary
        run: >-
          python -m ruff check
          catalog/capabilities
          catalog/ai
          catalog/common/tests/test_f7_ci_coverage.py
          catalog/flask_app/ai_routes.py
          catalog/flask_app/tests/test_ai_runtime_integration.py
          --ignore I001,RUF022,B008,C408,PLC0206,UP035
      - name: Preserve capability UP035 coverage
        run: python -m ruff check catalog/capabilities --select UP035
      - name: Preserve relay lifecycle lint coverage
        run: >-
          python -m ruff check
          catalog/relay/tests/test_phase_f74_capability_dispatch.py
          catalog/relay/tests/test_phase_f75_retry_cancellation.py
          --ignore I001,RUF022,B008,C408,PLC0206
      - name: Compose validation
        run: docker compose config --quiet
      - name: Diff hygiene
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD
      - name: Preserve native F7 test evidence
        if: always()
        uses: ./.github/actions/nitro-artifact
        with:
          operation: upload
          ssh-key: ${{ secrets.NITRO_ARTIFACT_SSH_KEY }}
          host: ${{ vars.NITRO_ARTIFACT_HOST }}
          known-hosts: ${{ vars.NITRO_ARTIFACT_KNOWN_HOSTS }}
          matrix: ${{ toJSON(matrix) }}
          job-status: ${{ job.status }}
          name: f7-closeout-${{ matrix.os }}
          path: ${{ runner.temp }}/f7-closeout-${{ matrix.os }}.xml
