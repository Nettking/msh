name: FCP documentation repository reference cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/federated-capability-platform-rename'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/federated-capability-platform-rename
          fetch-depth: 0
      - name: Remove repository slug from product documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          legacy = bytes((109, 115, 104)).decode("ascii")
          slug = "Nettking/" + legacy
          base = "https://github.com/" + slug
          changed = []
          for path in Path("docs").rglob("*.md"):
              original = path.read_text(encoding="utf-8")
              updated = original.replace(
                  f"git clone {base}.git",
                  "git clone <repository-url> fcp",
              )
              updated = updated.replace(f"{base}.git", "<repository-url>")
              updated = updated.replace(base, "<repository-url>")
              updated = updated.replace(slug, "this repository")
              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))
          print("updated", len(changed), "documentation files")
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove repository slug from product documentation"
          git push origin HEAD:agent/federated-capability-platform-rename
