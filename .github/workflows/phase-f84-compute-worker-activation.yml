name: Phase F8.4 trusted compute worker activation

# Final gate for the public activation boundary and relay acceptance path.
on:
  pull_request:
    paths:
      - "catalog/capabilities/**"
      - "catalog/relay/tests/test_phase_f84_compute_worker_activation.py"
      - "docs/implementation/phase_f8_plan.md"
      - ".github/workflows/phase-f84-compute-worker-activation.yml"
  push:
    branches: [main]
    paths:
      - "catalog/capabilities/**"
      - "catalog/relay/tests/test_phase_f84_compute_worker_activation.py"
      - "docs/implementation/phase_f8_plan.md"
      - ".github/workflows/phase-f84-compute-worker-activation.yml"

permissions:
  contents: read

concurrency:
  group: f84-compute-worker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compute-worker:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest ruff
      - name: Compile F8.4 boundaries
        run: >-
          python -m compileall
          catalog/capabilities
          catalog/relay/tests/test_phase_f84_compute_worker_activation.py
      - name: F8.4 and affected regressions
        run: >-
          python -m pytest -o addopts= -q
          catalog/capabilities/tests
          catalog/relay/tests/test_phase_f74_capability_dispatch.py
          catalog/relay/tests/test_phase_f75_retry_cancellation.py
          catalog/relay/tests/test_phase_f84_compute_worker_activation.py
          catalog/federation/tests/test_phase0.py
          catalog/federation/tests/test_phase1.py
          catalog/federation/tests/test_phase2_unit.py
      - name: Ruff F8.4 boundaries
        run: >-
          python -m ruff check
          catalog/capabilities
          catalog/relay/tests/test_phase_f84_compute_worker_activation.py
          --ignore I001,RUF022,B008,C408,PLC0206,UP035
      - name: Compose validation
        run: docker compose config --quiet
      - name: Diff hygiene
        run: git diff --check origin/${{ github.base_ref || 'main' }}...HEAD
