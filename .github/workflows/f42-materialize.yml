name: Materialize F4.2

on:
  pull_request:
    paths:
      - ".f42-payload/**"
      - ".github/workflows/f42-materialize.yml"

permissions:
  contents: write

concurrency:
  group: f42-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Detect payload
        id: payload
        shell: bash
        run: |
          if compgen -G '.f42-payload/part-*' > /dev/null; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          else
            echo 'found=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Materialize focused F4.2 change
        if: steps.payload.outputs.found == 'true'
        shell: bash
        run: |
          cat .f42-payload/part-* | base64 --decode > /tmp/f42.tar.gz
          tar -xzf /tmp/f42.tar.gz
          rm -rf .f42-payload
          python -m py_compile \
            catalog/federation/live_reinstatement.py \
            catalog/node/storage_reinstatement.py \
            catalog/node/tests/test_live_storage_reinstatement.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            catalog/federation/live_reinstatement.py \
            catalog/node/storage_reinstatement.py \
            catalog/node/tests/test_live_storage_reinstatement.py \
            docs/implementation/phase_f42_live_replica_reinstatement.md \
            .f42-payload
          git commit -m 'Implement safe F4.2 replica reinstatement'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
