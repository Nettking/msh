name: Product branding boundary

on:
  workflow_dispatch:
  push:
    branches: ['**']
permissions:
  contents: read

jobs:
  product-branding:
    if: github.repository_id == '1033058161'
    runs-on: [self-hosted, Linux, X64, fcp-linux-fast]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/self-hosted-python
        with:
          python-version: "3.12"
      - name: Enforce Federated Capability Platform identity
        run: python scripts/check_product_branding.py
