name: Product branding boundary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  product-branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce Federated Capability Platform identity
        run: python scripts/check_product_branding.py
