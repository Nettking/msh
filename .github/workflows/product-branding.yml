name: Product branding boundary

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  product-branding:
    runs-on: [self-hosted, fcp-linux-fast]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/self-hosted-python
        with:
          python-version: "3.12"
      - name: Enforce Federated Capability Platform identity
        run: python scripts/check_product_branding.py
