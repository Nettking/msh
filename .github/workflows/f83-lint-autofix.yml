name: F8.3 bounded lint autofix

on:
  push:
    branches:
      - agent/phase-f83-remote-ai-binding
    paths:
      - ".github/workflows/f83-lint-autofix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-f83-remote-ai-binding
          fetch-depth: 0
      - name: Apply exact lint fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("catalog/ai/relay_remote.py")
          text = path.read_text(encoding="utf-8")
          replacements = (
              (
                  "        except Exception:\n"
                  "            return RemoteAIInvocationResponse.failed(\n"
                  "                request,\n"
                  "                error_code=\"provider-internal-error\",",
                  "        except Exception:  # noqa: BLE001 - isolate provider plugin\n"
                  "            return RemoteAIInvocationResponse.failed(\n"
                  "                request,\n"
                  "                error_code=\"provider-internal-error\",",
              ),
              (
                  "        except asyncio.CancelledError:\n"
                  "            raise\n"
                  "        except Exception as exc:\n"
                  "            for pending in tuple(self._pending.values()):",
                  "        except asyncio.CancelledError:\n"
                  "            raise\n"
                  "        except Exception as exc:  # noqa: BLE001 - isolate relay reader\n"
                  "            for pending in tuple(self._pending.values()):",
              ),
              (
                  "        try:\n"
                  "            response = RemoteAIInvocationResponse.from_json(frame)\n"
                  "        except Exception as exc:\n",
                  "        try:\n"
                  "            response = RemoteAIInvocationResponse.from_json(frame)\n"
                  "        except FederationValidationError as exc:\n",
              ),
              (
                  "        try:\n"
                  "            request = RemoteAIInvocationRequest.from_json(frame)\n"
                  "        except Exception:\n",
                  "        try:\n"
                  "            request = RemoteAIInvocationRequest.from_json(frame)\n"
                  "        except FederationValidationError:\n",
              ),
          )
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one replacement target, found {count}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/f83-lint-autofix.yml").unlink()
          PY
      - name: Commit bounded patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/ai/relay_remote.py .github/workflows/f83-lint-autofix.yml
          git diff --cached --check
          git commit -m "Narrow F8.3 relay error boundaries"
          git push origin HEAD:agent/phase-f83-remote-ai-binding
