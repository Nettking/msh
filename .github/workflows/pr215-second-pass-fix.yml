name: PR 215 second-pass fix

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  fix-and-test:
    if: github.event.pull_request.number == 215
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-production-readiness-issues-in-pipeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest ruff
      - name: Apply second-pass runtime fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          pipeline_path = Path('catalog/orchestrator/pipeline.py')
          text = pipeline_path.read_text(encoding='utf-8')

          load_anchor = "        return state\n\n    def _startup_decision_context"
          load_replacement = (
              "        # In-flight scheduler state belongs to the process that owned the\n"
              "        # worker. Persisted ownership cannot survive a process restart.\n"
              "        state.update_running = False\n"
              "        state.active_execution_id = None\n"
              "        return state\n\n    def _startup_decision_context"
          )
          if load_anchor not in text:
              raise SystemExit('load-state replacement anchor not found')
          text = text.replace(load_anchor, load_replacement, 1)

          reservation_anchor = (
              "            self._state.active_execution_id = execution_id\n"
              "            self._persist_state()\n"
          )
          reservation_replacement = (
              "            # Reserve the scheduler before starting every requested worker,\n"
              "            # including ordinary /refresh requests without an external job id.\n"
              "            reserved_execution_id = execution_id or f\"runtime-refresh-{uuid.uuid4().hex}\"\n"
              "            self._state.active_execution_id = reserved_execution_id\n"
              "            try:\n"
              "                self._persist_state()\n"
              "            except Exception:  # noqa: BLE001 - roll back an unpersisted reservation\n"
              "                self._state.active_execution_id = None\n"
              "                raise\n"
          )
          if reservation_anchor not in text:
              raise SystemExit('request-refresh reservation anchor not found')
          text = text.replace(reservation_anchor, reservation_replacement, 1)

          thread_anchor = (
              "        threading.Thread(\n"
              "            target=self._run_requested_update,\n"
              "            kwargs={\"bootstrap\": False, \"execution_id\": execution_id},\n"
              "            daemon=True,\n"
              "        ).start()\n"
              "        return True\n"
          )
          thread_replacement = (
              "        worker = threading.Thread(\n"
              "            target=self._run_requested_update,\n"
              "            kwargs={\"bootstrap\": False, \"execution_id\": reserved_execution_id},\n"
              "            daemon=True,\n"
              "        )\n"
              "        try:\n"
              "            worker.start()\n"
              "        except Exception:  # noqa: BLE001 - release a reservation if start fails\n"
              "            # A worker that never started must not leave the scheduler fenced.\n"
              "            with self._lock:\n"
              "                if self._state.active_execution_id == reserved_execution_id:\n"
              "                    self._state.active_execution_id = None\n"
              "                    self._persist_state()\n"
              "            raise\n"
              "        return True\n"
          )
          if thread_anchor not in text:
              raise SystemExit('request-refresh thread anchor not found')
          text = text.replace(thread_anchor, thread_replacement, 1)

          import_anchor = "import traceback\n"
          if "import uuid\n" not in text:
              if import_anchor not in text:
                  raise SystemExit('uuid import anchor not found')
              text = text.replace(import_anchor, import_anchor + "import uuid\n", 1)
          pipeline_path.write_text(text, encoding='utf-8')

          test_path = Path('catalog/orchestrator/tests/test_pipeline_bootstrap.py')
          tests = test_path.read_text(encoding='utf-8')
          addition = '''

          def test_load_state_clears_process_local_execution_reservation(tmp_path: Path) -> None:
              orchestrator = pipeline.RuntimeOrchestrator.__new__(pipeline.RuntimeOrchestrator)
              orchestrator.state_path = tmp_path / "runtime_state.json"
              state = pipeline.RuntimeOrchestrator._default_state(orchestrator)
              state.update_running = True
              state.active_execution_id = "analysis-upload-crashed"
              state.completed_execution_id = "analysis-upload-previous"
              state.completed_execution_succeeded = True
              orchestrator.state_path.write_text(
                  pipeline.json.dumps(state.__dict__) + "\\n", encoding="utf-8"
              )

              loaded = pipeline.RuntimeOrchestrator._load_state(orchestrator)

              assert loaded.update_running is False
              assert loaded.active_execution_id is None
              assert loaded.completed_execution_id == "analysis-upload-previous"
              assert loaded.completed_execution_succeeded is True


          def test_uncorrelated_refresh_reserves_scheduler_before_worker_start(monkeypatch) -> None:
              orchestrator = pipeline.RuntimeOrchestrator.__new__(pipeline.RuntimeOrchestrator)
              orchestrator._lock = threading.Lock()
              orchestrator._state = pipeline.RuntimeOrchestrator._default_state(orchestrator)
              orchestrator._state.startup_mode = pipeline.STARTUP_MODE_CLEAN
              orchestrator._persist_state = lambda: None
              created = []

              class _DeferredThread:
                  def __init__(self, *, target, kwargs, daemon):
                      created.append((target, kwargs, daemon))

                  def start(self):
                      return None

              monkeypatch.setattr(pipeline.threading, "Thread", _DeferredThread)

              accepted = pipeline.RuntimeOrchestrator.request_refresh(orchestrator)

              assert accepted is True
              assert orchestrator._state.active_execution_id.startswith("runtime-refresh-")
              assert len(created) == 1
              assert created[0][1]["execution_id"] == orchestrator._state.active_execution_id
              assert created[0][2] is True


          def test_refresh_worker_start_failure_releases_scheduler_reservation(monkeypatch) -> None:
              orchestrator = pipeline.RuntimeOrchestrator.__new__(pipeline.RuntimeOrchestrator)
              orchestrator._lock = threading.Lock()
              orchestrator._state = pipeline.RuntimeOrchestrator._default_state(orchestrator)
              orchestrator._state.startup_mode = pipeline.STARTUP_MODE_CLEAN
              orchestrator._persist_state = lambda: None

              class _BrokenThread:
                  def __init__(self, *, target, kwargs, daemon):
                      pass

                  def start(self):
                      raise RuntimeError("thread start failed")

              monkeypatch.setattr(pipeline.threading, "Thread", _BrokenThread)

              try:
                  pipeline.RuntimeOrchestrator.request_refresh(orchestrator)
              except RuntimeError as exc:
                  assert str(exc) == "thread start failed"
              else:
                  raise AssertionError("request_refresh should propagate worker start failure")

              assert orchestrator._state.active_execution_id is None
              assert orchestrator._state.update_running is False
          '''
          marker = 'def test_load_state_clears_process_local_execution_reservation'
          if marker not in tests:
              test_path.write_text(tests.rstrip() + addition + '\n', encoding='utf-8')
          PY
      - name: Ruff changed boundaries
        run: python -m ruff check catalog/orchestrator/pipeline.py catalog/orchestrator/tests/test_pipeline_bootstrap.py --ignore I001,RUF022,B008,C408,PLC0206,UP035,DTZ001,DTZ003,DTZ004
      - name: Run focused runtime regressions
        run: python -m pytest -o addopts= -q catalog/orchestrator/tests/test_pipeline_bootstrap.py catalog/flask_app/tests/test_upload_analysis_jobs.py catalog/flask_app/tests/test_data_upload.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/orchestrator/pipeline.py catalog/orchestrator/tests/test_pipeline_bootstrap.py
          git diff --cached --check
          git commit -m "Recover runtime refresh reservations safely"
          git push origin HEAD:fix-production-readiness-issues-in-pipeline
