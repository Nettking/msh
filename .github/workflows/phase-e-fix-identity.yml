name: Fix Phase E identity contract

on:
  push:
    branches:
      - agent/complete-phase-e-recovery
    paths:
      - ".github/workflows/phase-e-fix-identity.yml"

permissions:
  contents: write

concurrency:
  group: phase-e-identity-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest
      - name: Align repair identity validation with provider contract
        shell: python
        run: |
          from pathlib import Path

          path = Path("catalog/federation/former_primary_repair.py")
          text = path.read_text(encoding="utf-8")
          old = '''        expected = (
              item.session_id,
              item.group_id,
              item.dataset_id,
              item.schema_name,
              item.schema_version,
              item.item_id,
              item.idempotency_key,
              item.content_hash,
          )
          actual = (
              identity.session_id,
              identity.group_id,
              identity.dataset_id,
              identity.dataset_schema_name,
              identity.dataset_schema_version,
              identity.batch_id,
              identity.idempotency_key,
              identity.content_hash,
          )
          '''
          new = '''        expected = (
              item.dataset_id,
              item.schema_name,
              item.schema_version,
              item.item_id,
              item.idempotency_key,
              item.content_hash,
          )
          actual = (
              identity.dataset_id,
              identity.dataset_schema_name,
              identity.dataset_schema_version,
              identity.batch_id,
              identity.idempotency_key,
              identity.content_hash,
          )
          '''
          if text.count(old) != 1:
              raise SystemExit("expected identity-validation block was not found exactly once")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Run focused recovery tests
        run: >-
          python -m pytest -o addopts= -q
          catalog/federation/tests/test_phase_e72_former_primary_transfer.py
          catalog/federation/tests/test_phase_e78_former_primary_completion.py
      - name: Commit verified fix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/phase-e-fix-identity.yml
          git add catalog/federation/former_primary_repair.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix Phase E provider identity validation"
          git push origin HEAD:agent/complete-phase-e-recovery
