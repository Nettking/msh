name: Capability product readers

on:
  push:
    branches: ['**']
    paths:
      - ".github/workflows/capability-product-readers.yml"
      - "catalog/flask_app/app.py"
      - "catalog/flask_app/capability_product_routes.py"
      - "catalog/flask_app/routes.py"
      - "catalog/flask_app/templates/status.html"
      - "catalog/flask_app/test_navigation_smoke.py"
      - "catalog/flask_app/tests/test_capability_product_routes.py"
      - "catalog/flask_app/tests/test_capability_startup_transition_route.py"
      - "catalog/flask_app/tests/test_legacy_startup_retired.py"
      - "catalog/flask_app/tests/test_recorder_control_service.py"
permissions:
  contents: read

concurrency:
  group: capability-product-readers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-readers:
    if: github.repository_id == '1033058161'
    name: product-readers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: [self-hosted, Linux, X64, fcp-linux-fast]
            shell: bash
          - os: Windows
            runner: [self-hosted, Windows, X64, fcp-windows]
            shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/self-hosted-python
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest ruff

      - name: Compile capability product readers
        run: >-
          python -m compileall -q
          catalog/flask_app/app.py
          catalog/flask_app/capability_product_routes.py
          catalog/flask_app/routes.py
          catalog/flask_app/tests/test_capability_product_routes.py
          catalog/flask_app/tests/test_capability_startup_transition_route.py
          catalog/flask_app/tests/test_legacy_startup_retired.py
          catalog/flask_app/tests/test_recorder_control_service.py

      - name: Ubuntu storage precondition
        if: runner.os == 'Linux'
        uses: ./.github/actions/ubuntu-storage-precondition

      - name: Run capability product reader regressions
        run: >-
          python -m pytest -o addopts= -q
          catalog/flask_app/tests/test_capability_product_routes.py
          catalog/flask_app/tests/test_capability_startup_transition_route.py
          catalog/flask_app/tests/test_legacy_startup_retired.py
          catalog/flask_app/tests/test_recorder_control_service.py
          catalog/flask_app/test_navigation_smoke.py

      - name: Ruff capability product readers
        run: >-
          python -m ruff check
          catalog/flask_app/app.py
          catalog/flask_app/capability_product_routes.py
          catalog/flask_app/routes.py
          catalog/flask_app/tests/test_capability_product_routes.py
          --ignore I001,RUF022,B008,C408,PLC0206,UP035

      - name: Diff hygiene
        shell: bash
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi
