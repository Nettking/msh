name: Capability product readers

on:
  pull_request:
    paths:
      - ".github/workflows/capability-product-readers.yml"
      - "catalog/flask_app/app.py"
      - "catalog/flask_app/capability_product_routes.py"
      - "catalog/flask_app/tests/test_capability_product_routes.py"
      - "catalog/flask_app/tests/test_capability_startup_transition_route.py"
      - "catalog/flask_app/tests/test_legacy_startup_retired.py"
      - "catalog/flask_app/tests/test_recorder_control_service.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/capability-product-readers.yml"
      - "catalog/flask_app/app.py"
      - "catalog/flask_app/capability_product_routes.py"
      - "catalog/flask_app/tests/test_capability_product_routes.py"
      - "catalog/flask_app/tests/test_capability_startup_transition_route.py"
      - "catalog/flask_app/tests/test_legacy_startup_retired.py"
      - "catalog/flask_app/tests/test_recorder_control_service.py"

permissions:
  contents: read

concurrency:
  group: capability-product-readers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-readers:
    name: product-readers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-phase2.txt
          python -m pip install pytest ruff

      - name: Compile capability product readers
        run: >-
          python -m compileall -q
          catalog/flask_app/app.py
          catalog/flask_app/capability_product_routes.py
          catalog/flask_app/tests/test_capability_product_routes.py
          catalog/flask_app/tests/test_capability_startup_transition_route.py
          catalog/flask_app/tests/test_legacy_startup_retired.py
          catalog/flask_app/tests/test_recorder_control_service.py

      - name: Run capability product reader regressions
        run: >-
          python -m pytest -o addopts= -q
          catalog/flask_app/tests/test_capability_product_routes.py
          catalog/flask_app/tests/test_capability_startup_transition_route.py
          catalog/flask_app/tests/test_legacy_startup_retired.py
          catalog/flask_app/tests/test_recorder_control_service.py
          catalog/flask_app/test_navigation_smoke.py

      - name: Ruff capability product readers
        run: >-
          python -m ruff check
          catalog/flask_app/app.py
          catalog/flask_app/capability_product_routes.py
          catalog/flask_app/tests/test_capability_product_routes.py
          --ignore I001,RUF022,B008,C408,PLC0206,UP035

      - name: Diff hygiene
        shell: bash
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check HEAD^ HEAD
          fi
