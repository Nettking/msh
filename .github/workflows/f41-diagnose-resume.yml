name: Diagnose F4.1 resume

on:
  push:
    branches:
      - agent/phase-f41-live-former-primary-catchup
    paths:
      - ".github/workflows/f41-diagnose-resume.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-f41-live-former-primary-catchup
          fetch-depth: 0
      - name: Expose resume failure and use normal relay shutdown
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('catalog/node/tests/test_live_storage_catchup.py')
          text = path.read_text()
          text = text.replace(
              '            assert completed.status == "caught-up"\n',
              '            assert completed.status == "caught-up", completed.to_dict()\n',
              1,
          )
          text = text.replace(
              '                await relay.close()\n',
              '                await relay.stop()\n',
              1,
          )
          path.write_text(text)
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/node/tests/test_live_storage_catchup.py
          git commit -m "Expose F4.1 resume diagnostics"
          git push origin HEAD:agent/phase-f41-live-former-primary-catchup
