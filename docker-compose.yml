services:
  flask:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${MSH_WEB_BIND:-0.0.0.0}:${MSH_WEB_PORT:-5000}:5000"
    environment:
      - MSH_SCAN_DIRS=${MSH_SCAN_DIRS:-results,data}
      - MSH_SKIP_ORCHESTRATION=${MSH_SKIP_ORCHESTRATION:-0}
      - MSH_FLASK_SECRET=${MSH_FLASK_SECRET:-msh-dev}
      - MSH_AI_MODEL=${MSH_AI_MODEL:-llama3.2:3b}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - MSH_DEVICE_NAME=${MSH_DEVICE_NAME:-This MSH device}
      - MSH_RELAY_PORT=${MSH_RELAY_PORT:-8765}
      - MSH_PAIRING_RELAY_URL=${MSH_PAIRING_RELAY_URL:-}
      - MSH_FEDERATION_NODE_STATE_DIR=${MSH_FEDERATION_NODE_STATE_DIR:-/app/data/federation/device}
      - MSH_FEDERATION_ONBOARDING_DATABASE=${MSH_FEDERATION_ONBOARDING_DATABASE:-/app/data/federation/onboarding/onboarding.sqlite3}
      - MSH_FEDERATION_COORDINATOR_DATABASE=${MSH_FEDERATION_COORDINATOR_DATABASE:-/var/lib/msh-relay/control.sqlite3}
    volumes:
      - type: bind
        source: ${MSH_RESULTS_DIR:-./results}
        target: /app/results
      - type: bind
        source: ${MSH_DATA_DIR:-./data}
        target: /app/data
      - type: volume
        source: relay_state
        target: /var/lib/msh-relay
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - type: volume
        source: ollama_models
        target: /root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  ollama-pull:
    profiles: ["model-install"]
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${MSH_AI_MODEL:-llama3.2:3b}"]

  model-provider:
    profiles: ["provider"]
    image: ollama/ollama:latest
    ports:
      - "${MSH_PROVIDER_BIND:-0.0.0.0}:${MSH_PROVIDER_PORT:-11434}:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - type: volume
        source: model_provider_models
        target: /root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    labels:
      - "no.msh.capability=language-model"
      - "no.msh.protocol=ollama"

  model-provider-install:
    profiles: ["provider"]
    image: ollama/ollama:latest
    depends_on:
      model-provider:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://model-provider:11434
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${MSH_PROVIDER_MODEL:-smollm2:360m}"]

  recorder:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["python", "catalog/standalone-recorder_v2/standalone-recorder_v2.py"]
    environment:
      - MSH_RECORDER_MANAGED=true
      - MSH_RECORDER_DATA_DIR=data
      - MSH_RECORDER_STATE_FILE=data/source_state/mtconnect_recorder_state.json
      - MSH_RECORDER_CONTROL_FILE=data/source_state/mtconnect_recorder_control.json
      - MSH_RECORDER_SETTINGS_FILE=data/server_setup/server_settings.json
      - MSH_RECORDER_STATUS_FILE=data/source_state/mtconnect_recorder_status.json
      - MSH_RECORDER_LOG_FILE=data/source_state/mtconnect_recorder.log
      - MSH_RECORDER_REQUEST_TIMEOUT=${MSH_RECORDER_REQUEST_TIMEOUT:-10.0}
      - MSH_RECORDER_BATCH_SIZE=${MSH_RECORDER_BATCH_SIZE:-1000}
      - MSH_RECORDER_MAX_BATCHES_PER_CYCLE=${MSH_RECORDER_MAX_BATCHES_PER_CYCLE:-20}
      - MSH_RECORDER_CONFIG_REFRESH_INTERVAL=${MSH_RECORDER_CONFIG_REFRESH_INTERVAL:-1.0}
      - MSH_RECORDER_STATUS_INTERVAL=${MSH_RECORDER_STATUS_INTERVAL:-1.0}
    volumes:
      - type: bind
        source: ${MSH_DATA_DIR:-./data}
        target: /app/data
    restart: unless-stopped

  relay:
    # Authenticated development relay for copy-and-paste pairing on a trusted
    # private LAN or VPN. The pairing code is signed, expires quickly and uses
    # one-use enrollment/invitation tokens. Configure WSS for untrusted networks.
    build:
      context: .
      dockerfile: Dockerfile.cli
    entrypoint: []
    command:
      - python
      - -m
      - catalog.relay.provider_service
      - serve
      - --database
      - /var/lib/msh-relay/control.sqlite3
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --unsafe-development-plaintext
    ports:
      - "${MSH_RELAY_BIND:-0.0.0.0}:${MSH_RELAY_PORT:-8765}:8765"
    volumes:
      - type: volume
        source: relay_state
        target: /var/lib/msh-relay
    restart: unless-stopped

  prep:
    profiles: ["prep"]
    build:
      context: .
      dockerfile: Dockerfile.cli
    environment:
      - MSH_SCAN_DIRS=${MSH_SCAN_DIRS:-results,data}
    volumes:
      - type: bind
        source: ${MSH_DATA_DIR:-./data}
        target: /app/data
      - type: bind
        source: ${MSH_RESULTS_DIR:-./results}
        target: /app/results

  observer-sync:
    profiles: ["observer-sync"]
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["python", "-m", "catalog.observer_phoenix.export_jsonl"]
    environment:
      - MSH_SCAN_DIRS=${MSH_SCAN_DIRS:-results,data}
    volumes:
      - type: bind
        source: ${MSH_DATA_DIR:-./data}
        target: /app/data

volumes:
  ollama_models:
    name: ${MSH_OLLAMA_VOLUME_NAME:-msh_ollama_models}
  model_provider_models:
    name: ${MSH_MODEL_PROVIDER_VOLUME_NAME:-msh_model_provider_models}
  relay_state:
    name: ${MSH_RELAY_VOLUME_NAME:-msh_relay_state}
