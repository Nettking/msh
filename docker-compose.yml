services:
  # Primary server UI for operating, replaying, and analyzing telemetry.
  # Enabled by setup profiles: web, full.
  flask:
    profiles: ["web", "full"]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${MSH_WEB_BIND:-0.0.0.0}:${MSH_WEB_PORT:-5000}:5000"
    environment:
      - MSH_SCAN_DIRS=${MSH_SCAN_DIRS:-results,data}
      - MSH_SKIP_ORCHESTRATION=${MSH_SKIP_ORCHESTRATION:-0}
      - MSH_FLASK_SECRET=${MSH_FLASK_SECRET:-msh-dev}
      - MSH_AI_MODEL=${MSH_AI_MODEL:-llama3.2:3b}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
    volumes:
      - ./results:/app/results
      - ./data:/app/data
    restart: unless-stopped

  # Optional local Ollama model server for the MSH AI explainer.
  # Enabled by setup profile: ai.
  ollama:
    profiles: ["ai"]
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  # One-shot model installer. It waits for the Ollama server and pulls the
  # selected setup model into the shared ollama_models volume.
  # Enabled by setup profile: ai.
  ollama-pull:
    profiles: ["ai"]
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - MSH_AI_MODEL=${MSH_AI_MODEL:-llama3.2:3b}
    entrypoint:
      - /bin/sh
      - -lc
      - |
        for i in $$(seq 1 60); do
          if ollama list >/dev/null 2>&1; then
            break
          fi
          sleep 2
        done
        echo "Pulling Ollama model: $${MSH_AI_MODEL}"
        ollama pull "$${MSH_AI_MODEL}"

  # Optional always-on MTConnect recorder. Use this on a machine that should only
  # collect source data, or together with flask for a full server deployment.
  # Enabled by setup profiles: recorder, full.
  recorder:
    profiles: ["recorder", "full"]
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["python", "catalog/standalone-recorder_v2/standalone-recorder_v2.py"]
    environment:
      - MSH_RECORDER_SOURCES_JSON=${MSH_RECORDER_SOURCES_JSON:-}
      - MSH_RECORDER_SOURCES=${MSH_RECORDER_SOURCES:-}
      - MSH_RECORDER_DATA_DIR=${MSH_RECORDER_DATA_DIR:-data}
      - MSH_RECORDER_STATE_FILE=${MSH_RECORDER_STATE_FILE:-data/source_state/mtconnect_recorder_state.json}
      - MSH_RECORDER_POLL_INTERVAL=${MSH_RECORDER_POLL_INTERVAL:-0.2}
      - MSH_RECORDER_FLUSH_INTERVAL=${MSH_RECORDER_FLUSH_INTERVAL:-1.0}
      - MSH_RECORDER_REQUEST_TIMEOUT=${MSH_RECORDER_REQUEST_TIMEOUT:-1.0}
      - MSH_RECORDER_INCLUDE_CONDITION=${MSH_RECORDER_INCLUDE_CONDITION:-false}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Optional one-shot orchestration/preparation run.
  # Enabled by setup profile: prep.
  prep:
    profiles: ["prep"]
    build:
      context: .
      dockerfile: Dockerfile.cli
    environment:
      - MSH_SCAN_DIRS=${MSH_SCAN_DIRS:-results,data}
    volumes:
      - ./data:/app/data
      - ./results:/app/results

  # Optional one-shot Observer Phoenix synchronization. This uses credentials
  # from environment variables or data/source_config/observer_phoenix.json.
  # Enabled by setup profile: observer-sync.
  observer-sync:
    profiles: ["observer-sync"]
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["python", "-m", "catalog.observer_phoenix.export_jsonl"]
    environment:
      - MSH_SCAN_DIRS=${MSH_SCAN_DIRS:-results,data}
    volumes:
      - ./data:/app/data

volumes:
  ollama_models:
