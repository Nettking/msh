services:
  flask:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${MSH_WEB_BIND:-0.0.0.0}:${MSH_WEB_PORT:-5000}:5000"
    environment:
      - MSH_SCAN_DIRS=${MSH_SCAN_DIRS:-results,data}
      - MSH_SKIP_ORCHESTRATION=${MSH_SKIP_ORCHESTRATION:-0}
      - MSH_FLASK_SECRET=${MSH_FLASK_SECRET:-msh-dev}
      - MSH_AI_MODEL=${MSH_AI_MODEL:-llama3.2:3b}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
    volumes:
      - ./results:/app/results
      - ./data:/app/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  ollama-pull:
    profiles: ["model-install"]
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${MSH_AI_MODEL:-llama3.2:3b}"]

  model-provider:
    profiles: ["provider"]
    image: ollama/ollama:latest
    ports:
      - "${MSH_PROVIDER_BIND:-0.0.0.0}:${MSH_PROVIDER_PORT:-11434}:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - model_provider_models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    labels:
      - "no.msh.capability=language-model"
      - "no.msh.protocol=ollama"

  model-provider-install:
    profiles: ["provider"]
    image: ollama/ollama:latest
    depends_on:
      model-provider:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://model-provider:11434
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${MSH_PROVIDER_MODEL:-smollm2:360m}"]

  recorder:
    profiles: ["recorder", "full"]
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["python", "catalog/standalone-recorder_v2/standalone-recorder_v2.py"]
    environment:
      - MSH_RECORDER_SOURCES_JSON=${MSH_RECORDER_SOURCES_JSON:-}
      - MSH_RECORDER_SOURCES=${MSH_RECORDER_SOURCES:-}
      - MSH_RECORDER_DATA_DIR=${MSH_RECORDER_DATA_DIR:-data}
      - MSH_RECORDER_STATE_FILE=${MSH_RECORDER_STATE_FILE:-data/source_state/mtconnect_recorder_state.json}
      - MSH_RECORDER_POLL_INTERVAL=${MSH_RECORDER_POLL_INTERVAL:-0.2}
      - MSH_RECORDER_FLUSH_INTERVAL=${MSH_RECORDER_FLUSH_INTERVAL:-1.0}
      - MSH_RECORDER_REQUEST_TIMEOUT=${MSH_RECORDER_REQUEST_TIMEOUT:-1.0}
      - MSH_RECORDER_INCLUDE_CONDITION=${MSH_RECORDER_INCLUDE_CONDITION:-false}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  prep:
    profiles: ["prep"]
    build:
      context: .
      dockerfile: Dockerfile.cli
    environment:
      - MSH_SCAN_DIRS=${MSH_SCAN_DIRS:-results,data}
    volumes:
      - ./data:/app/data
      - ./results:/app/results

  observer-sync:
    profiles: ["observer-sync"]
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["python", "-m", "catalog.observer_phoenix.export_jsonl"]
    environment:
      - MSH_SCAN_DIRS=${MSH_SCAN_DIRS:-results,data}
    volumes:
      - ./data:/app/data

volumes:
  ollama_models:
  model_provider_models:
