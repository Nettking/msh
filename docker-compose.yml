services:
  flask:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FCP_BUILD_COMMIT: ${FCP_BUILD_COMMIT:-unknown}
    ports:
      - "${FCP_WEB_BIND:-127.0.0.1}:${FCP_WEB_PORT:-5000}:5000"
    environment:
      - FCP_SCAN_DIRS=${FCP_SCAN_DIRS:-results,data}
      - FCP_SKIP_ORCHESTRATION=${FCP_SKIP_ORCHESTRATION:-0}
      - FCP_FLASK_SECRET=${FCP_FLASK_SECRET:-fcp-dev}
      - FCP_PASSWORD_SALT=${FCP_PASSWORD_SALT:-}
      - FCP_AUTH_DATABASE=${FCP_AUTH_DATABASE:-/app/data/auth/users.sqlite3}
      - FCP_AUTH_SECRET_DIR=${FCP_AUTH_SECRET_DIR:-/app/data/auth}
      - FCP_HTTPS=${FCP_HTTPS:-0}
      - FCP_DEVELOPMENT=${FCP_DEVELOPMENT:-0}
      - FCP_AI_MODEL=${FCP_AI_MODEL:-llama3.2:3b}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - FCP_DEVICE_NAME=${FCP_DEVICE_NAME:-This FCP device}
      - FCP_RELAY_PORT=${FCP_RELAY_PORT:-8765}
      - FCP_PAIRING_RELAY_URL=${FCP_PAIRING_RELAY_URL:-}
      - FCP_RECORDER_STATE_FILE=${FCP_RECORDER_STATE_FILE:-data/source_state/mtconnect_recorder_state.json}
      - FCP_RECORDER_STORAGE_GROUP=${FCP_RECORDER_STORAGE_GROUP:-}
      - FCP_FEDERATION_STORAGE_GROUP=${FCP_FEDERATION_STORAGE_GROUP:-}
      - FCP_FEDERATED_TELEMETRY_MIRROR_DIR=${FCP_FEDERATED_TELEMETRY_MIRROR_DIR:-data/federation/shared}
      - FCP_FEDERATED_TELEMETRY_MAX_PAGES_PER_SYNC=${FCP_FEDERATED_TELEMETRY_MAX_PAGES_PER_SYNC:-5}
      - FCP_FEDERATED_TELEMETRY_MAX_BATCHES_PER_SYNC=${FCP_FEDERATED_TELEMETRY_MAX_BATCHES_PER_SYNC:-100}
      - FCP_FEDERATION_NODE_STATE_DIR=${FCP_FEDERATION_NODE_STATE_DIR:-/app/data/federation/device}
      - FCP_FEDERATION_ONBOARDING_DATABASE=${FCP_FEDERATION_ONBOARDING_DATABASE:-/app/data/federation/onboarding/onboarding.sqlite3}
      - FCP_FEDERATION_COORDINATOR_DATABASE=${FCP_FEDERATION_COORDINATOR_DATABASE:-/var/lib/fcp-relay/control.sqlite3}
    volumes:
      - type: bind
        source: ${FCP_RESULTS_DIR:-./results}
        target: /app/results
      - type: bind
        source: ${FCP_DATA_DIR:-./data}
        target: /app/data
      - type: volume
        source: relay_state
        target: /var/lib/fcp-relay
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.32.6@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42
    volumes:
      - type: volume
        source: ollama_models
        target: /root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  ollama-pull:
    profiles: ["model-install"]
    image: ollama/ollama:0.32.6@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${FCP_AI_MODEL:-llama3.2:3b}"]

  model-provider:
    profiles: ["provider"]
    image: ollama/ollama:0.32.6@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42
    ports:
      - "${FCP_PROVIDER_BIND:-0.0.0.0}:${FCP_PROVIDER_PORT:-11434}:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    volumes:
      - type: volume
        source: model_provider_models
        target: /root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    labels:
      - "no.fcp.capability=language-model"
      - "no.fcp.protocol=ollama"

  model-provider-install:
    profiles: ["provider"]
    image: ollama/ollama:0.32.6@sha256:b88c73ace3e115f8ec53dc8761ae1c0aabfa675406e3681786b98757ce050f42
    depends_on:
      model-provider:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://model-provider:11434
    entrypoint: ["/bin/ollama"]
    command: ["pull", "${FCP_PROVIDER_MODEL:-smollm2:360m}"]

  recorder:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FCP_BUILD_COMMIT: ${FCP_BUILD_COMMIT:-unknown}
    entrypoint: ["python", "-m", "catalog.mtconnect_recorder.managed_service"]
    environment:
      - FCP_RECORDER_MANAGED=true
      - FCP_RECORDER_DATA_DIR=data
      - FCP_RECORDER_STATE_FILE=${FCP_RECORDER_STATE_FILE:-data/source_state/mtconnect_recorder_state.json}
      - FCP_RECORDER_CONTROL_FILE=data/source_state/mtconnect_recorder_control.json
      - FCP_RECORDER_CONFIG_FILE=data/capabilities/config.json
      - FCP_RECORDER_STATUS_FILE=data/source_state/mtconnect_recorder_status.json
      - FCP_RECORDER_LOG_FILE=data/source_state/mtconnect_recorder.log
      - FCP_RECORDER_REQUEST_TIMEOUT=${FCP_RECORDER_REQUEST_TIMEOUT:-10.0}
      - FCP_RECORDER_BATCH_SIZE=${FCP_RECORDER_BATCH_SIZE:-1000}
      - FCP_RECORDER_MAX_BATCHES_PER_CYCLE=${FCP_RECORDER_MAX_BATCHES_PER_CYCLE:-20}
      - FCP_RECORDER_CONFIG_REFRESH_INTERVAL=${FCP_RECORDER_CONFIG_REFRESH_INTERVAL:-1.0}
      - FCP_RECORDER_STATUS_INTERVAL=${FCP_RECORDER_STATUS_INTERVAL:-1.0}
      - FCP_RECORDER_DEVICE_NAME=${FCP_RECORDER_DEVICE_NAME:-FCP MTConnect recorder}
      - FCP_RECORDER_FEDERATION_TIMEOUT=${FCP_RECORDER_FEDERATION_TIMEOUT:-15.0}
      - FCP_RECORDER_FEDERATION_POLL_SECONDS=${FCP_RECORDER_FEDERATION_POLL_SECONDS:-2.0}
      - FCP_RECORDER_STORAGE_GROUP=${FCP_RECORDER_STORAGE_GROUP:-}
    volumes:
      - type: bind
        source: ${FCP_DATA_DIR:-./data}
        target: /app/data
    restart: unless-stopped

  relay:
    # Authenticated development relay for copy-and-paste pairing on a trusted
    # private LAN or VPN. The pairing code is signed, expires quickly and uses
    # one-use enrollment/invitation tokens. Configure WSS for untrusted networks.
    build:
      context: .
      dockerfile: Dockerfile.cli
      args:
        FCP_BUILD_COMMIT: ${FCP_BUILD_COMMIT:-unknown}
    entrypoint: []
    command:
      - python
      - -m
      - catalog.relay.provider_service
      - serve
      - --database
      - /var/lib/fcp-relay/control.sqlite3
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --unsafe-development-plaintext
    ports:
      - "${FCP_RELAY_BIND:-127.0.0.1}:${FCP_RELAY_PORT:-8765}:8765"
    volumes:
      - type: volume
        source: relay_state
        target: /var/lib/fcp-relay
    restart: unless-stopped

  prep:
    profiles: ["prep"]
    build:
      context: .
      dockerfile: Dockerfile.cli
    environment:
      - FCP_SCAN_DIRS=${FCP_SCAN_DIRS:-results,data}
    volumes:
      - type: bind
        source: ${FCP_DATA_DIR:-./data}
        target: /app/data
      - type: bind
        source: ${FCP_RESULTS_DIR:-./results}
        target: /app/results

  observer-sync:
    profiles: ["observer-sync"]
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["python", "-m", "catalog.observer_phoenix.export_jsonl"]
    environment:
      - FCP_SCAN_DIRS=${FCP_SCAN_DIRS:-results,data}
    volumes:
      - type: bind
        source: ${FCP_DATA_DIR:-./data}
        target: /app/data
      - type: bind
        source: ${FCP_RESULTS_DIR:-./results}
        target: /app/results

volumes:
  ollama_models:
    name: ${FCP_OLLAMA_VOLUME_NAME:-fcp_ollama_models}
  model_provider_models:
    name: ${FCP_MODEL_PROVIDER_VOLUME_NAME:-fcp_model_provider_models}
  relay_state:
    name: ${FCP_RELAY_VOLUME_NAME:-fcp_relay_state}