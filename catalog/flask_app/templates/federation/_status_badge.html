{% macro status_badge(state, label=None, live=False) -%}
  {% set normalized = (state or 'unknown')|replace('_', '-') %}
  <span class="federation-status federation-status--{{ normalized }}"{% if live %} role="status" aria-live="polite"{% endif %}>
    <span class="federation-status__dot" aria-hidden="true"></span>
    {{ label or normalized|replace('-', ' ')|title }}
  </span>
{%- endmacro %}
